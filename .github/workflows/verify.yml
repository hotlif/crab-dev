name: Test

on:
  push:
    branches: ["canary"]
  pull_request:
    branches: ["canary"]

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.check.name }} (${{ matrix.os }})
    env:
      CRAB_CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RAYON_NUM_THREADS: "2"
      TURBO_CONCURRENCY: "2"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        check:
          - name: project
          - name: workspace-tests
          - name: required-date-picker
            shard: date-picker
          - name: required-1
            shard: "1/2"
          - name: required-2
            shard: "2/2"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          ref: ${{ env.CRAB_CI_SOURCE_SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Verify the exact submitted revision
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          const actual = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (actual !== process.env.CRAB_CI_SOURCE_SHA) throw Error('CI checkout does not match the submitted revision');
          console.log(`Verified CI source revision: ${actual}`);
          JS
      - name: Enable Corepack
        run: corepack enable
      - name: Install project package manager
        run: corepack install
      - name: Install dependencies
        run: yarn install --immutable
      - name: Install CJK fonts for browser checks
        if: runner.os == 'Linux' && matrix.check.name != 'project'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Install the pinned browser for tests
        if: matrix.check.name != 'project'
        run: yarn test:browser:install
      - name: Run repository checks and builds
        if: matrix.check.name == 'project'
        run: yarn check --project-checks
      - name: Build library outputs for tests
        if: matrix.check.name != 'project'
        run: yarn build:library
      - name: Run workspace tests
        if: matrix.check.name == 'workspace-tests'
        run: yarn test
      - name: Run required workspace tests
        if: matrix.check.shard
        shell: bash
        env:
          SHARD: ${{ matrix.check.shard }}
        run: yarn test:required --shard "$SHARD"
      - name: Confirm the verified revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CRAB_CI_SOURCE_SHA"
      - name: Preserve exact source and build fingerprints
        if: matrix.check.name == 'project'
        shell: bash
        run: |
          yarn node --input-type=module <<'JS'
          import { mkdir, writeFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          import { captureVisualInputs } from './scripts/visual/evidence-inputs.mjs';
          const sourceCommit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (sourceCommit !== process.env.CRAB_CI_SOURCE_SHA) throw Error('CI source revision changed during verification');
          const inputs = await captureVisualInputs();
          await mkdir('.cache/visual', { recursive: true });
          await writeFile('.cache/visual/ci-source-build.json', JSON.stringify({ recordedAt: new Date().toISOString(), sourceCommit, platform: process.platform, node: process.version, inputs }, null, 2) + '\n');
          console.log(JSON.stringify({ sourceCommit, source: inputs.source.fingerprint, artifact: inputs.artifact.fingerprint, siteBuild: inputs.siteBuild.fingerprint, sourceFiles: inputs.source.files.length }));
          JS
      - name: Preserve verification evidence and browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence-${{ matrix.os }}-${{ env.CRAB_CI_SOURCE_SHA }}-${{ matrix.check.name }}-attempt-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
          path: |
            .cache/visual/ci-source-build.json
            components/*/.cache/forced-colors/**/*.json
            components/*/.cache/forced-colors/**/*.png
            components/*/.cache/focus-colors/**/*.json
            components/*/.cache/focus-colors/**/*.png
            components/*/.cache/reduced-motion/**/*.json
            components/*/.cache/reduced-motion/**/*.png
            components/*/.cache/natural-motion/**/*.json
            components/*/.cache/natural-motion/**/*.png

  # Retain the existing status check names. Every gate requires all matrix jobs.
  verify:
    needs: checks
    if: always()
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ubuntu-latest
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.checks.result }}
  test:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.verify.result }}
  lint:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.verify.result }}
  typecheck:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.verify.result }}
