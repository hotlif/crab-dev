name: Verify platform

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      revision:
        required: true
        type: string

env:
  CRAB_CI_SOURCE_SHA: ${{ inputs.revision }}
  RAYON_NUM_THREADS: "2"
  TURBO_CONCURRENCY: "2"

jobs:
  shared:
    name: Build shared packages
    runs-on: ${{ inputs.os }}
    env:
      BUILD_GROUP: shared
    steps: &build-steps
      - &checkout
        uses: actions/checkout@v7
        with:
          lfs: true
          ref: ${{ inputs.revision }}
      - &node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - &install
        name: Verify checkout and install dependencies
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$CRAB_CI_SOURCE_SHA"
          corepack enable
          corepack install
          yarn install --immutable
      - name: Download shared builds
        if: env.BUILD_GROUP != 'shared'
        uses: actions/download-artifact@v8
        with:
          name: build-${{ inputs.os }}-${{ inputs.revision }}-shared
          path: .turbo/cache
      - name: Build package group
        shell: bash
        run: yarn ci:build build "$BUILD_GROUP"
      - name: Upload package builds
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ inputs.os }}-${{ inputs.revision }}-${{ env.BUILD_GROUP }}
          path: .tmp/ci-build/${{ env.BUILD_GROUP }}
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 14

  packages:
    needs: shared
    name: Build ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        group: [group-1, group-2, group-3]
    runs-on: ${{ inputs.os }}
    env:
      BUILD_GROUP: ${{ matrix.group }}
    steps: *build-steps

  date-picker:
    needs: shared
    name: DatePicker browser ${{ matrix.check.browser-shard }}
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: date-picker, shard: date-picker, browser-shard: "1/3" }
          - { name: date-picker, shard: date-picker, browser-shard: "2/3" }
          - { name: date-picker, shard: date-picker, browser-shard: "3/3" }
    runs-on: ${{ inputs.os }}
    steps: &check-steps
      - *checkout
      - *node
      - *install
      - name: Download builds for this check
        uses: actions/download-artifact@v8
        with:
          pattern: build-${{ inputs.os }}-${{ inputs.revision }}-${{ matrix.check.browser-shard && 'shared' || '*' }}
          path: .turbo/cache
          merge-multiple: true
      - name: Install CJK fonts for browser checks
        if: runner.os == 'Linux' && matrix.check.name != 'project'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Install the pinned browser for tests
        if: matrix.check.name != 'project'
        run: yarn test:browser:install
      - name: Run repository checks and builds
        if: matrix.check.name == 'project'
        run: yarn check --project-checks --reuse-build
      - name: Restore compiled library for tests
        if: matrix.check.name != 'project'
        run: yarn ci:build restore ${{ matrix.check.browser-shard && 'shared' || 'all' }}
      - name: Run workspace tests
        if: matrix.check.name == 'workspace-tests'
        run: yarn test
      - name: Run required workspace tests
        if: matrix.check.shard
        shell: bash
        env:
          SHARD: ${{ matrix.check.shard }}
          BROWSER_SHARD: ${{ matrix.check.browser-shard }}
        run: |
          args=(--shard "$SHARD")
          if [[ -n "$BROWSER_SHARD" ]]; then args+=(--browser-shard "$BROWSER_SHARD"); fi
          yarn test:required "${args[@]}"
      - name: Confirm the verified revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CRAB_CI_SOURCE_SHA"
      - name: Preserve exact source and build fingerprints
        if: matrix.check.name == 'project'
        shell: bash
        run: |
          yarn node --input-type=module <<'JS'
          import { mkdir, writeFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          import { captureVisualInputs } from './scripts/visual/evidence-inputs.mjs';
          const sourceCommit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (sourceCommit !== process.env.CRAB_CI_SOURCE_SHA) throw Error('CI source revision changed during verification');
          const inputs = await captureVisualInputs();
          await mkdir('.cache/visual', { recursive: true });
          await writeFile('.cache/visual/ci-source-build.json', JSON.stringify({ recordedAt: new Date().toISOString(), sourceCommit, platform: process.platform, node: process.version, inputs }, null, 2) + '\n');
          console.log(JSON.stringify({ sourceCommit, source: inputs.source.fingerprint, artifact: inputs.artifact.fingerprint, siteBuild: inputs.siteBuild.fingerprint, sourceFiles: inputs.source.files.length }));
          JS
      - name: Preserve verification evidence and browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence-${{ inputs.os }}-${{ env.CRAB_CI_SOURCE_SHA }}-${{ matrix.check.name }}-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
          path: |
            .cache/visual/ci-source-build.json
            components/*/.cache/forced-colors/**/*.json
            components/*/.cache/forced-colors/**/*.png
            components/*/.cache/focus-colors/**/*.json
            components/*/.cache/focus-colors/**/*.png
            components/*/.cache/reduced-motion/**/*.json
            components/*/.cache/reduced-motion/**/*.png
            components/*/.cache/natural-motion/**/*.json
            components/*/.cache/natural-motion/**/*.png

  checks:
    needs: packages
    name: ${{ matrix.check.name }}
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: project }
          - { name: workspace-tests }
          - { name: required-1, shard: "1/2" }
          - { name: required-2, shard: "2/2" }
    runs-on: ${{ inputs.os }}
    steps: *check-steps
