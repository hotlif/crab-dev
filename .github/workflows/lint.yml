name: Lint

on:
  push:
    branches: [ "canary" ]
    paths-ignore:
      - "**/*.md"
      - "rfc/**"
      - "components/**/docs/**"
  pull_request:
    branches: [ "canary" ]
    paths-ignore:
      - "**/*.md"
      - "rfc/**"
      - "components/**/docs/**"

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        lfs: true
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: '24'
    - name: Enable Corepack
      run: corepack enable
    - name: Install project package manager
      run: corepack install
    - name: Install dependencies
      run: yarn install --immutable
    - name: Run ESLint
      run: yarn lint
