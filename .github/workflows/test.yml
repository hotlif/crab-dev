# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Test

on:
  push:
    branches: [ "canary" ]
  pull_request:
    branches: [ "canary" ]

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        lfs: true
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: '24'
    - name: Enable Corepack
      run: corepack enable
    - name: Install project package manager
      run: corepack install
    - name: Install dependencies
      run: yarn install --immutable
    - name: Verify library inventory, boundaries, commands and generated task graph
      run: yarn check:architecture
    - name: Generate design tokens
      run: yarn generate:token
    - name: Verify generated design tokens are committed
      run: yarn check:generated
    - name: Verify design token contract
      run: yarn check:tokens
    - name: Run Wake Lint and repository contract tests
      run: yarn lint
    - name: Build the project
      run: yarn build:library
    - name: Verify built package entrypoints
      run: yarn check:exports
    - name: Verify independently packed strict PnP consumer
      run: yarn check:consumer
    - name: Run typecheck
      run: yarn typecheck
    - name: Run Wake Test
      run: yarn test
    - name: Run registered additional workspace checks
      run: yarn test:required
    - name: Build Wake Docs
      run: yarn docs:build
