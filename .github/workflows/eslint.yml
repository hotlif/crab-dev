name: ESLint CI

on:
  push:
    branches: [ "canary" ]
    paths-ignore:
      - "**/*.md"
      - "rfc/**"
      - "components/**/docs/**"
  pull_request:
    branches: [ "canary" ]
    paths-ignore:
      - "**/*.md"
      - "rfc/**"
      - "components/**/docs/**"

concurrency:
  group: eslint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node (latest)
      uses: actions/setup-node@v4
    - name: Enable Corepack
      run: corepack enable
    - name: Activate Yarn 4.13.0
      run: corepack prepare yarn@4.13.0 --activate
    - name: Install dependencies
      run: yarn install
    - name: Run ESLint
      run: yarn eslint
