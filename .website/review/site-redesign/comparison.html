<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crab UI · 三主题改版对照</title>
<style>body{margin:0;padding:24px;font:16px/1.6 system-ui,sans-serif;background:#f5f5f5;color:#202020}main{max-width:1600px;margin:auto}h1{font-size:28px;margin:0}p{max-width:76ch}form{display:flex;flex-wrap:wrap;gap:16px;margin:24px 0}label{display:grid;gap:4px}select{font:inherit;padding:8px;border:1px solid #888;border-radius:6px;background:white}section{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}figure{margin:0;min-width:0}figcaption{font-weight:600;padding:8px 0}img{width:100%;height:auto;border:1px solid #aaa;display:block}a{color:#304cc4}video{max-width:100%}@media(max-width:700px){section{grid-template-columns:1fr}}</style>
<main><h1>Crab UI · 三主题改版对照</h1><p>2026-11-05，同一 Windows Chromium 环境；包含 MD3 紧凑化的工作区作为改版前基准。五类页面、三主题、浅深色、三档宽度，共 90 组。图片为默认可见视口，不代表整页所有状态。</p>
<form><label>页面<select id="page"><option value="home">首页</option><option value="catalog">组件目录</option><option value="design">设计指南</option><option value="component">组件文档</option><option value="tutorial">实战教程</option></select></label><label>主题<select id="theme"><option value="md3">MD3</option><option value="apple">Apple</option><option value="shadcn">shadcn</option></select></label><label>明暗<select id="mode"><option value="light">浅色</option><option value="dark">深色</option></select></label><label>视口<select id="viewport"><option value="desktop">1440 × 900</option><option value="tablet">768 × 1024</option><option value="narrow">320 × 768</option></select></label></form>
<section><figure><figcaption>改版前</figcaption><a id="before-link"><img id="before" alt="改版前页面"></a></figure><figure><figcaption>改版后</figcaption><a id="after-link"><img id="after" alt="改版后页面"></a></figure></section>
<p><a href="README.md">检查记录与验证边界</a> · <a href="evidence.json">完整截图及运行记录</a></p>
<h2>关键动效</h2><p>首屏错峰、主题连续切换、草稿保留、滚动呈现与目录入场。下面的视频保留真实执行过程。</p><label>当前主题与明暗模式的演示<video id="motion" controls preload="metadata"></video></label></main>
<script>const controls=['page','theme','mode','viewport'].map(id=>document.getElementById(id));function update(){const values=controls.map(node=>node.value);const name=values.join('-')+'-viewport.png';for(const phase of ['before','after']){const url=phase+'/'+name;document.getElementById(phase).src=url;document.getElementById(phase+'-link').href=url;}document.getElementById('motion').src='motion/'+values[1]+'-'+values[2]+'.webm';}for(const control of controls)control.addEventListener('change',update);update();</script></html>
