[build]
output = "./src/token.ts"
prefix = "menu"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

# ── Vertical ──────────────────────────────────────────

vertical.item.depth.padding-left = "var(--menu-vertical-item-inline-indent, $ref(space.dialog-padding))"

vertical.item.title.width = "100%"
vertical.item.title.height = "$ref(size.navigation)"
vertical.item.title.color = "$ref(color.text.primary)"
vertical.item.title.font-size = "$ref(typography.body.font-size)"
vertical.item.title.padding-inline-start = "$ref(space.section-gap)"
vertical.item.title.padding-inline-end = "$ref(space.section-gap)"
vertical.item.title.margin-top = "0.125rem"
vertical.item.title.margin-bottom = "0.125rem"
vertical.item.title.border-radius = "$ref(shape.full)"
vertical.item.title.transition = "background-color $ref(motion.interaction), color $ref(motion.interaction)"
vertical.item.title.background-color-hover = "$ref(color.state.hover)"
vertical.item.title.background-color-active = "$ref(color.secondary.container)"
vertical.item.title.background-color-selected = "var(--menu-vertical-item-title-background-color-select, $ref(color.secondary.container))"
vertical.item.title.background-color-open = "transparent"
vertical.item.title.color-hover = "$ref(color.text.primary)"
vertical.item.title.color-active = "$ref(color.secondary.on-container)"
vertical.item.title.color-selected = "var(--menu-vertical-item-title-color-select, $ref(color.secondary.on-container))"
vertical.item.title.color-open = "$ref(color.text.primary)"
vertical.item.title.font-weight-selected = "var(--menu-vertical-item-title-font-weight-select, $ref(typography.label.large.emphasized.font-weight))"

vertical.item.children.background-color = "transparent"
vertical.item.children.padding = "0px"

vertical.item-group.title.color = "$ref(color.text.tertiary)"
vertical.item-group.title.height = "$ref(size.navigation)"
vertical.item-group.title.font-size = "$ref(typography.title.small.font-size)"
vertical.item-group.title.font-weight = "$ref(typography.label.font-weight)"
vertical.item-group.title.letter-spacing = "0.04em"
vertical.item-group.title.text-transform = "uppercase"

vertical.item.icon.width = "var(--menu-vertical-item-icon-size, 24px)"
vertical.item.icon.margin-right = "$ref(space.component-gap)"

# ── Vertical (inline-collapsed) ───────────────────────

vertical.collapsed.width = "4rem"
vertical.collapsed.item.title.height = "$ref(size.navigation)"
vertical.collapsed.item.title.padding-inline = "$ref(space.inline-gap)"
vertical.collapsed.item.icon.width = "var(--menu-vertical-collapsed-item-icon-size, 1.125rem)"
vertical.collapsed.transition = "width $ref(motion.expand), padding $ref(motion.fade)"

vertical.submenu.background-color = "$ref(color.surface.container)"
vertical.submenu.box-shadow = "$ref(shadow.float)"
vertical.submenu.padding = "$ref(space.inline-gap)"
vertical.submenu.border-radius = "$ref(shape.extra-small)"
vertical.submenu.min-width = "10rem"
vertical.submenu.z-index = "$ref(z-index.float)"
vertical.submenu.margin = "var(--menu-vertical-submenu-offset, $ref(space.inline-gap))"

vertical.tooltip.background-color = "$ref(color.background.inverse)"
vertical.tooltip.color = "$ref(color.text.inverse)"
vertical.tooltip.padding-inline = "$ref(space.component-gap)"
vertical.tooltip.padding-block = "$ref(space.inline-gap)"
vertical.tooltip.border-radius = "$ref(shape.extra-small)"
vertical.tooltip.font-size = "$ref(typography.caption.font-size)"
vertical.tooltip.z-index = "$ref(z-index.float)"

# ── Horizontal ────────────────────────────────────────

horizontal.border-color = "$ref(color.border.subtle)"

horizontal.item.font-size = "$ref(typography.body.font-size)"
horizontal.item.transition = "color $ref(motion.interaction), background-color $ref(motion.interaction), border-color $ref(motion.interaction)"
horizontal.item.color = "$ref(color.text.primary)"
horizontal.item.color-hover = "$ref(color.text.primary)"
horizontal.item.content.height = "$ref(size.navigation)"
horizontal.item.content.padding-left = "$ref(space.section-gap)"
horizontal.item.content.font-size = "$ref(typography.body.font-size)"
horizontal.item.content.background-color-hover = "$ref(color.state.hover)"

horizontal.submenu.background-color = "$ref(color.surface.container)"
horizontal.submenu.box-shadow = "$ref(shadow.float)"
horizontal.submenu.padding = "$ref(space.inline-gap)"
horizontal.submenu.line-height = "2.5rem"
horizontal.submenu.border-radius = "$ref(shape.extra-small)"
horizontal.submenu.z-index = "$ref(z-index.float)"

horizontal.group-item.header.indent-base.padding-left = "var(--menu-horizontal-group-item-indent-base, $ref(space.inline-gap))"
horizontal.group-item.header.indent-scale.padding-left = "var(--menu-horizontal-group-item-indent-scale, 1)"
horizontal.group-item.font-size = "$ref(typography.caption.font-size)"
horizontal.group-item.margin = "$ref(space.component-gap) 0px"
horizontal.group-item.transition = "color $ref(motion.interaction), background-color $ref(motion.interaction), border-color $ref(motion.interaction)"
horizontal.group-item.title.color = "$ref(color.text.secondary)"
horizontal.group-item.title.font-weight = "$ref(typography.label.font-weight)"
horizontal.group-item.header.padding-inline = "$ref(space.section-gap)"
horizontal.group-item.icon.color = "$ref(color.text.secondary)"
horizontal.group-item.icon.margin-right = "$ref(space.component-gap)"

horizontal.item.icon.margin-right = "$ref(space.component-gap)"

motion.expand.transition = "var(--menu-motion-expand, $ref(motion.expand))"

interaction.touch.min-width = "$ref(size.touch-target)"
interaction.touch.min-height = "$ref(size.touch-target)"
interaction.outline-color-focus = "$ref(color.focus.ring)"
interaction.outline-width-focus = "2px"
interaction.outline-offset-focus = "2px"
