[build]
output = "./src/token.ts"
prefix = "menu"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

# ── Vertical ──────────────────────────────────────────

vertical.item.inline-indent = "$ref(space.dialog-padding)"

vertical.item.title.width = "100%"
vertical.item.title.height = "2.5rem"
vertical.item.title.color = "$ref(color.text.primary)"
vertical.item.title.font-size = "$ref(font.size.body)"
vertical.item.title.padding-inline-start = "$ref(space.section-gap)"
vertical.item.title.padding-inline-end = "$ref(space.section-gap)"
vertical.item.title.margin-top = "0.125rem"
vertical.item.title.margin-bottom = "0.125rem"
vertical.item.title.border-radius = "$ref(radius.lg)"
vertical.item.title.transition = "background-color $ref(motion.fade), color $ref(motion.fade)"
vertical.item.title.background-color-hover = "$ref(color.background.hover-subtle)"
vertical.item.title.background-color-active = "$ref(color.background.active-subtle)"
vertical.item.title.background-color-select = "$ref(color.background.active-subtle)"
vertical.item.title.background-color-open = "transparent"
vertical.item.title.color-hover = "$ref(color.text.primary)"
vertical.item.title.color-active = "$ref(color.text.primary)"
vertical.item.title.color-select = "$ref(color.text.primary)"
vertical.item.title.color-open = "$ref(color.text.primary)"
vertical.item.title.font-weight-select = "$ref(font.weight.label)"

vertical.item.children.background-color = "transparent"
vertical.item.children.padding = "0px"

vertical.item-group.title.color = "$ref(color.text.tertiary)"
vertical.item-group.title.height = "2rem"
vertical.item-group.title.font-size = "$ref(font.size.caption)"
vertical.item-group.title.font-weight = "$ref(font.weight.label)"
vertical.item-group.title.letter-spacing = "0.04em"
vertical.item-group.title.text-transform = "uppercase"

vertical.item.icon.size = "1rem"
vertical.item.icon.margin-right = "$ref(space.component-gap)"

# ── Horizontal ────────────────────────────────────────

horizontal.border-color = "$ref(color.border.default)"

horizontal.item.font-size = "$ref(font.size.body)"
horizontal.item.transition = "$ref(motion.fade)"
horizontal.item.color-hover = "$ref(color.text.primary)"
horizontal.item.content.height = "2.5rem"
horizontal.item.content.padding-left = "$ref(space.section-gap)"
horizontal.item.content.font-size = "$ref(font.size.body)"
horizontal.item.content.background-color-hover = "$ref(color.background.hover-subtle)"

horizontal.submenu.background-color = "$ref(color.background.elevated)"
horizontal.submenu.box-shadow = "$ref(shadow.float)"
horizontal.submenu.padding = "$ref(space.inline-gap)"
horizontal.submenu.line-height = "2.5rem"
horizontal.submenu.border-radius = "$ref(radius.sm)"

horizontal.group-item.indent-base = "$ref(space.inline-gap)"
horizontal.group-item.indent-scale = "1"
horizontal.group-item.font-size = "$ref(font.size.caption)"
horizontal.group-item.margin = "$ref(space.component-gap) 0px"
horizontal.group-item.transition = "$ref(motion.fade)"
horizontal.group-item.title.color = "$ref(color.text.secondary)"
horizontal.group-item.title.font-weight = "$ref(font.weight.label)"
horizontal.group-item.header.padding-inline = "$ref(space.section-gap)"
horizontal.group-item.icon.color = "$ref(color.text.secondary)"
horizontal.group-item.icon.margin-right = "$ref(space.component-gap)"

horizontal.item.icon.margin-right = "$ref(space.component-gap)"
