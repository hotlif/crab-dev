[build]
output = "./src/token.ts"
prefix = "menu"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

# ── Vertical ──────────────────────────────────────────

vertical.item.inline-indent = "$ref(space.dialog-padding)"

vertical.item.title.width = "100%"
vertical.item.title.height = "2.5rem"
vertical.item.title.font-size = "$ref(font.size.body)"
vertical.item.title.padding-inline-start = "$ref(space.section-gap)"
vertical.item.title.padding-inline-end = "$ref(space.section-gap)"
vertical.item.title.margin-top = "0.125rem"
vertical.item.title.margin-bottom = "0.125rem"
vertical.item.title.border-radius = "$ref(radius.lg)"
vertical.item.title.background-color-hover = "$ref(color.background.hover-subtle)"
vertical.item.title.background-color-active = "$ref(color.background.active-subtle)"
vertical.item.title.background-color-select = "$ref(color.background.hover-subtle)"
vertical.item.title.background-color-open = "$ref(color.background.active-subtle)"

vertical.item.children.background-color = "$ref(color.background.elevated)"
vertical.item.children.padding = "0px $ref(space.inline-gap)"

vertical.item-group.title.color = "$ref(color.text.tertiary)"
vertical.item-group.title.height = "2.25rem"
vertical.item-group.title.font-size = "$ref(font.size.body)"

vertical.item.icon.size = "1rem"
vertical.item.icon.margin-right = "8px"

# ── Horizontal ────────────────────────────────────────

horizontal.border-color = "$ref(color.border.default)"

horizontal.item.font-size = "$ref(font.size.body)"
horizontal.item.transition = "$ref(motion.fade)"
horizontal.item.color-hover = "$ref(color.brand.primary)"
horizontal.item.divider-color-hover = "$ref(color.brand.primary)"
horizontal.item.content.height = "40px"
horizontal.item.content.padding-left = "$ref(space.section-gap)"
horizontal.item.content.font-size = "$ref(font.size.body)"
horizontal.item.content.background-color-hover = "$ref(color.background.hover-subtle)"

horizontal.submenu.background-color = "$ref(color.background.elevated)"
horizontal.submenu.box-shadow = "rgba(0, 0, 0, 0.08) 0px 6px 16px 0px, rgba(0, 0, 0, 0.12) 0px 3px 6px -4px, rgba(0, 0, 0, 0.05) 0px 9px 28px 8px"
horizontal.submenu.padding = "6px 4px"
horizontal.submenu.line-height = "40px"
horizontal.submenu.border-radius = "4px"

horizontal.group-item.indent-base = "5px"
horizontal.group-item.indent-scale = "0.7"
horizontal.group-item.font-size = "14px"
horizontal.group-item.margin = "6px 0px"
horizontal.group-item.transition = "border-color 0.3s, color 0.3s"
horizontal.group-item.title.opacity = "0.5"
horizontal.group-item.header.padding-inline = "16px"
horizontal.group-item.icon.opacity = "0.5"
horizontal.group-item.icon.margin-right = "8px"

horizontal.item.icon.margin-right = "8px"
