# Published renderer and extracted CSS geometry. No Crab CSS mock in this root.
# Run both browser roots with the public package script: yarn test:browser.
[test]
environment = "browser"
include = ["menu-visual.test.tsx"]
timeout_ms = 15000
leaks = "error"

[test.react]
strict_mode = false
cleanup = true
act_warnings = "error"

[test.network]
mode = "deny"
allow_hosts = []

[test.coverage]
enabled = true
reporters = ["text", "lcov"]
