[docs]
source_dir = "docs"
title = "Menu 菜单"
description = "为页面和功能提供导航的菜单列表。"
locale = "zh-CN"
theme_css = "docs/theme.css"
preview = "docs/preview.tsx"

[test]
setup = ["../../test/wake-css.setup.ts"]
environment = "dom"
include = ["src/**/*.{test,spec}.{js,mjs,cjs,jsx,ts,mts,cts,tsx}"]
exclude = ["**/node_modules/**", "**/coverage/**", "**/esm/**", "**/cjs/**", "**/declarations/**", "src/__tests__/browser/**", "src/__tests__/browser-behavior/**"]
timeout_ms = 5000
leaks = "error"

[test.react]
strict_mode = false
cleanup = true
act_warnings = "error"
test_id_attribute = "data-testid"

[test.network]
mode = "deny"
allow_hosts = []

[test.coverage]
enabled = true
reporters = ["text", "lcov"]
