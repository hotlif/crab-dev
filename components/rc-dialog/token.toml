[build]
output = "./src/token.ts"
prefix = "dialog"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

overlay.background-color = "$ref(color.background.overlay)"
root.background-color = "$ref(color.surface.high)"
root.top = "50%"
# An explicit top override disables centering without changing its coordinate.
root.transform = "translateY(calc(var(--dialog-root-top, 0px) - var(--dialog-root-top, 50%)))"
root.min-width = "280px"
root.max-width = "calc(100vw - $ref(space.section-gap) * 2)"
root.max-height = "calc(100dvh - $ref(space.section-gap) * 2)"
confirm.min-width = "22rem"
root.padding = "$ref(space.dialog-padding)"
root.border-radius = "$ref(shape.overlay)"
root.box-shadow = "$ref(shadow.overlay)"

heading.margin-bottom = "$ref(space.section-gap)"
heading.font-weight = "$ref(typography.headline.small.emphasized.font-weight)"
heading.font-size = "$ref(typography.headline.small.font-size)"
heading.line-height = "$ref(typography.headline.small.line-height)"
heading.gap = "$ref(space.component-gap)"
close.width = "$ref(size.48)"
close.height = "$ref(size.48)"
close.touch.min-width = "$ref(size.48)"
close.touch.min-height = "$ref(size.48)"

footer.margin-top = "$ref(space.dialog-padding)"
footer.button.margin = "$ref(space.component-gap)"
footer.button.min-height = "$ref(size.control)"
footer.button.padding-block = "$ref(space.inline-gap)"

motion.fade.transition = "$ref(motion.fade)"
motion.interaction.transition = "$ref(motion.interaction)"
motion.offset.translate = "calc($ref(space.component-gap) * -1)"

motion.spatial.transition = "$ref(motion.spatial.fast)"
