[build]
output = "./src/token.ts"
prefix = "dialog"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

overlay.background.color = "$ref(color.background.overlay)"
background.color = "$ref(color.background.elevated)"
top = "100px"
min.width = "520px"
confirm.min.width = "22rem"
padding = "$ref(space.card-padding) $ref(space.dialog-padding)"
border.radius = "$ref(radius.lg)"
box.shadow = "$ref(shadow.overlay)"

heading.margin.bottom = "$ref(space.stack-gap)"
heading.font.weight = "$ref(font.weight.heading)"
heading.font.size = "$ref(font.size.subhead)"
heading.line.height = "1.5"

footer.margin.top = "$ref(space.stack-gap)"
footer.button.spacing = "$ref(space.component-gap)"