[build]
output = "./src/token.ts"
prefix = "dialog"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

overlay.background-color = "$ref(color.background.overlay)"
root.background-color = "$ref(overlay.dialog.background)"
root.border-color = "$ref(overlay.dialog.border)"
root.top = "50%"
# An explicit top override disables centering without changing its coordinate.
root.transform = "translateY(calc(var(--dialog-root-top, 0px) - var(--dialog-root-top, 50%)))"
root.min-width = "280px"
root.max-width = "calc(100vw - $ref(space.section-gap) * 2)"
root.max-height = "calc(100dvh - $ref(space.section-gap) * 2)"
confirm.min-width = "22rem"
root.padding = "$ref(overlay.dialog.padding)"
root.border-radius = "$ref(shape.overlay)"
root.box-shadow = "$ref(shadow.overlay)"

heading.margin-bottom = "$ref(space.section-gap)"
heading.font-weight = "$ref(overlay.dialog.headline.font-weight)"
heading.font-size = "$ref(overlay.dialog.headline.font-size)"
heading.line-height = "$ref(overlay.dialog.headline.line-height)"
heading.gap = "$ref(space.component-gap)"
close.width = "$ref(size.32)"
close.height = "$ref(size.32)"
close.touch.min-width = "$ref(size.48)"
close.touch.min-height = "$ref(size.48)"

footer.margin-top = "$ref(overlay.dialog.padding)"
footer.button.margin = "$ref(space.component-gap)"
footer.button.min-height = "$ref(size.control)"
footer.button.padding-block = "$ref(space.inline-gap)"
footer.button.border-width = "1px"
footer.confirm.background-color = "$ref(overlay.dialog.confirm.background)"
footer.confirm.color = "$ref(overlay.dialog.confirm.foreground)"
footer.confirm.border-color = "$ref(overlay.dialog.confirm.border)"
footer.confirm.background-color-hover = "$ref(overlay.dialog.confirm.hover)"
footer.confirm.background-color-focus = "$ref(overlay.dialog.confirm.focus)"
footer.confirm.background-color-active = "$ref(overlay.dialog.confirm.pressed)"
footer.cancel.background-color = "$ref(overlay.dialog.cancel.background)"
footer.cancel.color = "$ref(overlay.dialog.cancel.foreground)"
footer.cancel.border-color = "$ref(overlay.dialog.cancel.border)"
footer.cancel.background-color-hover = "$ref(overlay.dialog.cancel.hover)"
footer.cancel.background-color-focus = "$ref(overlay.dialog.cancel.focus)"
footer.cancel.background-color-active = "$ref(overlay.dialog.cancel.pressed)"

motion.fade.transition = "$ref(motion.fade)"
motion.interaction.transition = "$ref(motion.interaction)"
motion.offset.translate = "calc($ref(space.component-gap) * -1)"

motion.spatial.transition = "$ref(motion.spatial.fast)"
