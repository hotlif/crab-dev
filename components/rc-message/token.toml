[build]
output = "./src/token.ts"
prefix = "message"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

# ─── 通用 ────────────────────────────────────────────────────────────────────
root.padding = "var(--message-padding, $ref(space.component-gap) $ref(space.card-padding))"
root.border-radius = "var(--message-border-radius, $ref(radius.lg))"
root.font-size = "var(--message-font-size, $ref(font.size.body))"
root.line-height = "var(--message-line-height, 1.625)"
root.background-color = "var(--message-background-color, $ref(color.background.elevated))"
root.box-shadow = "var(--message-box-shadow, $ref(shadow.overlay))"

# ─── 图标 ────────────────────────────────────────────────────────────────────
icon.width = "var(--message-icon-size, 18px)"
icon.margin-right = "$ref(space.component-gap)"

# ─── 类型颜色 ────────────────────────────────────────────────────────────────
success.icon.color = "var(--message-success-color, $ref(color.feedback.success.icon))"
warning.icon.color = "var(--message-warning-color, $ref(color.feedback.warning.icon))"
icon.color-error = "var(--message-error-icon-color, var(--message-error-color, $ref(color.feedback.error.icon)))"
info.icon.color = "var(--message-info-color, $ref(color.feedback.info.icon))"

# ─── 文本 ────────────────────────────────────────────────────────────────────
text.color = "$ref(color.text.primary)"

# ─── 进度条 ──────────────────────────────────────────────────────────────────
progress.start.color = "$ref(color.brand.primary)"
progress.end.color = "$ref(color.brand.primary-hover)"
progress.height = "3px"
progress.duration = "var(--message-countdown-duration, 0ms)"
progress.delay = "var(--message-countdown-delay, 0ms)"

motion.interaction = "$ref(motion.interaction)"
stack.offset = "$ref(space.group-gap)"
