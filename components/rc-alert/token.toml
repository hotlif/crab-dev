[build]
output = "./src/token.ts"
prefix = "alert"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

# ─── 通用 ────────────────────────────────────────────────────────────────────
transition = "background-color 100ms cubic-bezier(0.4, 0, 0.2, 1), border-color 100ms cubic-bezier(0.4, 0, 0.2, 1), color 100ms cubic-bezier(0.4, 0, 0.2, 1)"
padding = "$ref(space.card-padding)"
border.radius = "$ref(radius.lg)"
font.size = "$ref(font.size.body)"
line.height = "1.625"

# ─── 标题 ────────────────────────────────────────────────────────────────────
title.font.size = "$ref(font.size.subhead)"
title.font.weight = "$ref(font.weight.label)"
title.margin.bottom = "$ref(space.component-gap)"

# ─── 图标 ────────────────────────────────────────────────────────────────────
icon.size = "16px"
icon.size-with-title = "20px"
icon.margin.right = "$ref(space.component-gap)"

# ─── 关闭按钮 ────────────────────────────────────────────────────────────────
close.size = "16px"
close.color = "$ref(color.text.secondary)"
close.color-hover = "$ref(color.text.primary)"

# ─── Success ─────────────────────────────────────────────────────────────────
success.color = "$ref(color.feedback.success)"
success.background.color = "$ref(color.feedback.success-background)"
success.border-color = "$ref(color.feedback.success)"

# ─── Warning ─────────────────────────────────────────────────────────────────
warning.color = "$ref(color.feedback.warning)"
warning.background.color = "$ref(color.feedback.warning-background)"
warning.border-color = "$ref(color.feedback.warning)"

# ─── Error ───────────────────────────────────────────────────────────────────
error.color = "$ref(color.feedback.error)"
error.background.color = "$ref(color.feedback.error-background)"
error.border-color = "$ref(color.feedback.error)"

# ─── Info ────────────────────────────────────────────────────────────────────
info.color = "$ref(color.feedback.info)"
info.background.color = "$ref(color.feedback.info-background)"
info.border-color = "$ref(color.feedback.info)"
