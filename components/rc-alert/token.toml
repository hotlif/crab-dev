[build]
output = "./src/token.ts"
prefix = "alert"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

# ─── 通用 ────────────────────────────────────────────────────────────────────
root.transition = "var(--alert-transition, background-color 100ms cubic-bezier(0.4, 0, 0.2, 1), border-color 100ms cubic-bezier(0.4, 0, 0.2, 1), color 100ms cubic-bezier(0.4, 0, 0.2, 1))"
root.padding = "var(--alert-padding, $ref(space.card-padding))"
root.border-radius = "var(--alert-border-radius, $ref(radius.lg))"
root.font-size = "var(--alert-font-size, $ref(font.size.body))"
root.line-height = "var(--alert-line-height, 1.625)"

# ─── 标题 ────────────────────────────────────────────────────────────────────
title.font-size = "$ref(font.size.subhead)"
title.font-weight = "$ref(font.weight.label)"
title.margin-bottom = "$ref(space.component-gap)"

# ─── 图标 ────────────────────────────────────────────────────────────────────
icon.width = "var(--alert-icon-size, 16px)"
icon.with-title.width = "var(--alert-icon-size-with-title, 20px)"
icon.margin-right = "$ref(space.component-gap)"

# ─── 关闭按钮 ────────────────────────────────────────────────────────────────
close.width = "var(--alert-close-size, 16px)"
close.color = "$ref(color.text.secondary)"
close.color-hover = "$ref(color.text.primary)"

# ─── Success ─────────────────────────────────────────────────────────────────
success.color = "$ref(color.feedback.success.text)"
success.icon.color = "$ref(color.feedback.success.icon)"
success.background-color = "$ref(color.feedback.success.background)"
success.border-color = "$ref(color.feedback.success.border)"

# ─── Warning ─────────────────────────────────────────────────────────────────
warning.color = "$ref(color.feedback.warning.text)"
warning.icon.color = "$ref(color.feedback.warning.icon)"
warning.background-color = "$ref(color.feedback.warning.background)"
warning.border-color = "$ref(color.feedback.warning.border)"

# ─── Error ───────────────────────────────────────────────────────────────────
root.color-error = "var(--alert-error-color, $ref(color.feedback.error.text))"
icon.color-error = "var(--alert-error-icon-color, $ref(color.feedback.error.icon))"
root.background-color-error = "var(--alert-error-background-color, $ref(color.feedback.error.background))"
root.border-color-error = "var(--alert-error-border-color, $ref(color.feedback.error.border))"

# ─── Info ────────────────────────────────────────────────────────────────────
info.color = "$ref(color.feedback.info.text)"
info.icon.color = "$ref(color.feedback.info.icon)"
info.background-color = "$ref(color.feedback.info.background)"
info.border-color = "$ref(color.feedback.info.border)"
