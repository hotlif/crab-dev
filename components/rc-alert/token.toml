[build]
output = "./src/token.ts"
prefix = "alert"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

# ─── 通用 ────────────────────────────────────────────────────────────────────
root.transition = "background-color $ref(motion.interaction), border-color $ref(motion.interaction), color $ref(motion.interaction)"
root.padding = "$ref(feedback.banner.padding)"
root.border-radius = "$ref(feedback.banner.shape)"
root.font-size = "$ref(typography.body.font-size)"
root.line-height = "$ref(typography.body.line-height)"

# ─── 标题 ────────────────────────────────────────────────────────────────────
title.font-size = "$ref(feedback.banner.title-font-size)"
title.font-weight = "$ref(typography.label.font-weight)"
title.margin-bottom = "$ref(space.component-gap)"

# ─── 图标 ────────────────────────────────────────────────────────────────────
icon.width = "16px"
icon.with-title.width = "20px"
icon.margin-right = "$ref(space.component-gap)"

# ─── 关闭按钮 ────────────────────────────────────────────────────────────────
close.width = "16px"
close.color = "$ref(color.text.secondary)"
close.color-hover = "$ref(color.text.primary)"

# ─── Success ─────────────────────────────────────────────────────────────────
success.color = "$ref(color.feedback.success.text)"
success.icon.color = "$ref(color.feedback.success.icon)"
success.background-color = "color-mix(in oklab, $ref(color.feedback.success.background) $ref(feedback.banner.tint), $ref(color.surface.content))"
success.border-color = "color-mix(in oklab, $ref(color.feedback.success.border) $ref(feedback.banner.border-tint), $ref(color.border.subtle))"

# ─── Warning ─────────────────────────────────────────────────────────────────
warning.color = "$ref(color.feedback.warning.text)"
warning.icon.color = "$ref(color.feedback.warning.icon)"
warning.background-color = "color-mix(in oklab, $ref(color.feedback.warning.background) $ref(feedback.banner.tint), $ref(color.surface.content))"
warning.border-color = "color-mix(in oklab, $ref(color.feedback.warning.border) $ref(feedback.banner.border-tint), $ref(color.border.subtle))"

# ─── Error ───────────────────────────────────────────────────────────────────
root.color-error = "$ref(color.feedback.error.text)"
icon.color-error = "$ref(color.feedback.error.icon)"
root.background-color-error = "color-mix(in oklab, $ref(color.feedback.error.background) $ref(feedback.banner.tint), $ref(color.surface.content))"
root.border-color-error = "color-mix(in oklab, $ref(color.feedback.error.border) $ref(feedback.banner.border-tint), $ref(color.border.subtle))"

# ─── Info ────────────────────────────────────────────────────────────────────
info.color = "$ref(color.feedback.info.text)"
info.icon.color = "$ref(color.feedback.info.icon)"
info.background-color = "color-mix(in oklab, $ref(color.feedback.info.background) $ref(feedback.banner.tint), $ref(color.surface.content))"
info.border-color = "color-mix(in oklab, $ref(color.feedback.info.border) $ref(feedback.banner.border-tint), $ref(color.border.subtle))"

interaction.touch.min-width = "$ref(size.touch-target)"
interaction.touch.min-height = "$ref(size.touch-target)"
interaction.outline-color-focus = "$ref(color.focus.ring)"
interaction.outline-width-focus = "2px"
interaction.outline-offset-focus = "2px"
interaction.transition = "$ref(motion.interaction)"
motion.collapse.transition = "$ref(motion.layout)"

close.background-color-hover = "$ref(color.background.hover-subtle)"
close.background-color-focus = "$ref(color.background.active-subtle)"
close.background-color-active = "$ref(color.background.active-subtle)"
