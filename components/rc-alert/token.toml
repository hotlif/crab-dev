[build]
output = "./src/token.ts"
prefix = "alert"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

# ─── 通用 ────────────────────────────────────────────────────────────────────
root.transition = "background-color $ref(motion.interaction), border-color $ref(motion.interaction), color $ref(motion.interaction)"
root.padding = "$ref(space.card-padding)"
root.border-radius = "$ref(shape.medium)"
root.font-size = "$ref(typography.body.font-size)"
root.line-height = "$ref(typography.body.line-height)"

# ─── 标题 ────────────────────────────────────────────────────────────────────
title.font-size = "$ref(font.size.subhead)"
title.font-weight = "$ref(typography.label.font-weight)"
title.margin-bottom = "$ref(space.component-gap)"

# ─── 图标 ────────────────────────────────────────────────────────────────────
icon.width = "16px"
icon.with-title.width = "20px"
icon.margin-right = "$ref(space.component-gap)"

# ─── 关闭按钮 ────────────────────────────────────────────────────────────────
close.width = "16px"
close.color = "$ref(color.text.secondary)"
close.color-hover = "$ref(color.text.primary)"

# ─── Success ─────────────────────────────────────────────────────────────────
success.color = "$ref(color.feedback.success.text)"
success.icon.color = "$ref(color.feedback.success.icon)"
success.background-color = "$ref(color.feedback.success.background)"
success.border-color = "$ref(color.feedback.success.border)"

# ─── Warning ─────────────────────────────────────────────────────────────────
warning.color = "$ref(color.feedback.warning.text)"
warning.icon.color = "$ref(color.feedback.warning.icon)"
warning.background-color = "$ref(color.feedback.warning.background)"
warning.border-color = "$ref(color.feedback.warning.border)"

# ─── Error ───────────────────────────────────────────────────────────────────
root.color-error = "$ref(color.feedback.error.text)"
icon.color-error = "$ref(color.feedback.error.icon)"
root.background-color-error = "$ref(color.feedback.error.background)"
root.border-color-error = "$ref(color.feedback.error.border)"

# ─── Info ────────────────────────────────────────────────────────────────────
info.color = "$ref(color.feedback.info.text)"
info.icon.color = "$ref(color.feedback.info.icon)"
info.background-color = "$ref(color.feedback.info.background)"
info.border-color = "$ref(color.feedback.info.border)"

interaction.touch.min-width = "$ref(size.touch-target)"
interaction.touch.min-height = "$ref(size.touch-target)"
interaction.outline-color-focus = "$ref(color.focus.ring)"
interaction.outline-width-focus = "2px"
interaction.outline-offset-focus = "2px"
interaction.transition = "$ref(motion.interaction)"
motion.collapse.transition = "$ref(motion.layout)"
