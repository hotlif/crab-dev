[build]
output = "./src/token.ts"
prefix = "avatar"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

# ─── 通用 ────────────────────────────────────────────────────────────────────
root.transition = "var(--avatar-transition, box-shadow $ref(motion.interaction), transform $ref(motion.spatial.fast), background-color $ref(motion.interaction), color $ref(motion.interaction))"

# ─── 尺寸阶梯 ────────────────────────────────────────────────────────────────
size.small.width     = "var(--avatar-size-small-value, 28px)"
size.small.font-size = "$ref(typography.caption.font-size)"

size.middle.width     = "var(--avatar-size-middle-value, 40px)"
size.middle.font-size = "$ref(typography.body.font-size)"

size.large.width     = "var(--avatar-size-large-value, 48px)"
size.large.font-size = "$ref(font.size.subhead)"

icon.small.font-size  = "var(--avatar-icon-size-small, 14px)"
icon.middle.font-size = "var(--avatar-icon-size-middle, 18px)"
icon.large.font-size  = "var(--avatar-icon-size-large, 22px)"

content.max-width   = "70%"
content.font-weight = "$ref(typography.label.font-weight)"

# ─── 形态 ────────────────────────────────────────────────────────────────────
shape.square.border-radius = "var(--avatar-shape-square-radius, $ref(radius.lg))"

# ─── 交互语义 ────────────────────────────────────────────────────────────────
root.border-color = "var(--avatar-border-color, $ref(color.border.default))"
root.border-color-hover = "var(--avatar-border-color-hover, var(--avatar-border-hover, $ref(color.border.hover)))"
ring.color-focus = "var(--avatar-focus-ring-color, $ref(color.focus.ring))"
root.opacity-disabled = "var(--avatar-opacity-disabled, var(--avatar-disabled-opacity, $ref(opacity.disabled)))"

# ─── 颜色语义 ────────────────────────────────────────────────────────────────
default.color            = "$ref(color.text.primary)"
default.background-color = "$ref(color.background.hover-subtle)"

primary.color            = "$ref(color.text.on-brand)"
primary.background-color = "$ref(color.brand.primary)"

success.color            = "$ref(color.feedback.success.text)"
success.background-color = "$ref(color.feedback.success.background)"

warning.color            = "$ref(color.feedback.warning.text)"
warning.background-color = "$ref(color.feedback.warning.background)"

root.color-error = "var(--avatar-error-color, $ref(color.feedback.error.text))"
root.background-color-error = "var(--avatar-error-background-color, $ref(color.feedback.error.background))"

# ─── AvatarGroup ─────────────────────────────────────────────────────────────
group.margin                 = "var(--avatar-group-overlap, -8px)"
group.transition             = "transform $ref(motion.spatial.fast), box-shadow $ref(motion.effects.fast)"
group.transform-hover = "var(--avatar-group-translate-y-hover, translateY(var(--avatar-group-hover-translate-y, -2px)))"

group.item.ring.width = "2px"
group.item.border-color      = "$ref(color.surface.content)"

interaction.touch.min-width = "$ref(size.touch-target)"
interaction.touch.min-height = "$ref(size.touch-target)"
interaction.outline-color-focus = "$ref(color.focus.ring)"
interaction.outline-width-focus = "2px"
interaction.outline-offset-focus = "2px"
