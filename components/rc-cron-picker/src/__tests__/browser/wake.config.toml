# Run via the package test:browser script: actual ESM/CSS are prerequisites.
[test]
environment = "browser"
include = ["cronPicker.test.tsx"]
timeout_ms = 15000
leaks = "error"

[test.react]
strict_mode = false
cleanup = true
act_warnings = "error"

[test.network]
mode = "deny"
allow_hosts = []

[test.coverage]
enabled = true
reporters = ["text", "lcov"]
