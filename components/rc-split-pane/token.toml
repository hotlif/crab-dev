[build]
output = "./src/token.ts"
prefix = "split-pane"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

# 分隔条命中区厚度：可见线只有 1px，命中区必须更宽才抓得住
separator.vertical.width = "$ref(data.split.handle-width)"
separator.horizontal.height = "$ref(data.split.handle-width)"
separator.line.width = "1px"
separator.line.background-color = "$ref(color.border.default)"
separator.line.background-color-active = "$ref(color.brand.primary)"
separator.grip.width = "$ref(data.split.grip-width)"
separator.grip.height = "$ref(data.split.grip-height)"
separator.grip.border-radius = "$ref(data.split.grip-radius)"
separator.transition = "background-color $ref(motion.interaction)"

separator.box-shadow-focus = "$ref(shadow.focus-ring)"
separator.touch.width = "$ref(size.touch-target)"
separator.opacity-disabled = "$ref(opacity.disabled)"
separator.outline-width-focus = "2px"
separator.outline-color-focus = "$ref(color.focus.ring)"
