[docs]
source_dir = "docs"
title = "Canvas WebGL 画布"
description = "基于纯 WebGL 2 的 2D React 绘制组件库，提供 Canvas、Rect、Circle、Line、Image、Text、Group 等组件"
locale = "zh-CN"

[test]
setup = ["../../test/wake-css.setup.ts"]
environment = "dom"
include = ["src/**/*.{test,spec}.{js,mjs,cjs,jsx,ts,mts,cts,tsx}"]
exclude = ["**/node_modules/**", "**/coverage/**", "**/esm/**", "**/cjs/**", "**/declarations/**"]
timeout_ms = 5000
leaks = "error"

[test.react]
strict_mode = false
cleanup = true
act_warnings = "error"
test_id_attribute = "data-testid"

[test.network]
mode = "deny"
allow_hosts = []

[test.coverage]
enabled = true
reporters = ["text", "lcov"]
