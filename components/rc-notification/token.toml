[build]
output = "./src/token.ts"
prefix = "notification"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

root.background-color = "var(--notification-background-color, $ref(color.background.elevated))"
text.color = "$ref(color.text.primary)"
root.padding = "var(--notification-padding, $ref(space.card-padding) $ref(space.dialog-padding))"
root.border-radius = "var(--notification-border-radius, $ref(radius.lg))"
root.box-shadow = "var(--notification-box-shadow, $ref(shadow.overlay))"
root.width = "360px"
root.border-color = "$ref(color.border.subtle)"

title.margin-bottom = "$ref(space.component-gap)"
title.font-size = "$ref(font.size.subhead)"
title.line-height = "1.5"

content.font-size = "$ref(font.size.body)"
content.line-height = "$ref(font.line-height.body)"

progress.start.color = "$ref(color.brand.primary)"
progress.end.color = "$ref(color.brand.primary-hover)"
progress.height = "3px"
progress.duration = "var(--notification-countdown-duration, 0ms)"
progress.delay = "var(--notification-countdown-delay, 0ms)"

close.opacity = "$ref(opacity.tertiary)"

motion.interaction = "$ref(motion.interaction)"
stack.offset = "$ref(space.group-gap)"
stack.gap = "$ref(space.component-gap)"
stack.front.z-index = "3"
stack.second.z-index = "2"
stack.second.scale = "0.96"
stack.second.background-color = "color-mix(in oklch, $ref(color.background.elevated) 94%, $ref(color.text.primary))"
stack.third.z-index = "1"
stack.third.scale = "0.92"
stack.third.background-color = "color-mix(in oklch, $ref(color.background.elevated) 88%, $ref(color.text.primary))"
stack.box-shadow = "$ref(shadow.float)"
