[build]
output = "./src/token.ts"
prefix = "dropdown-container"
imports = ["@crab-dev/rc-token-semantic"]

[token]
root.box-shadow = "var(--dropdown-container-box-shadow, $ref(shadow.overlay))"
root.border-radius = "var(--dropdown-container-border-radius, 8px)"
root.background-color = "var(--dropdown-container-background-color, $ref(color.background.elevated))"
root.border-color = "$ref(color.border.subtle)"
root.z-index = "var(--dropdown-container-z-index, $ref(z-index.float))"

motion.interaction.transition = "var(--dropdown-container-motion-interaction, $ref(motion.interaction))"
motion.offset.translate = "var(--dropdown-container-motion-offset, calc($ref(space.component-gap) * -1))"
