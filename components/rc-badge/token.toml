[build]
output = "./src/token.ts"
prefix = "badge"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

# ─── 通用 ────────────────────────────────────────────────────────────────────
root.transition = "var(--badge-transition, background-color 100ms cubic-bezier(0.4, 0, 0.2, 1), color 100ms cubic-bezier(0.4, 0, 0.2, 1), transform 100ms cubic-bezier(0.4, 0, 0.2, 1))"

# ─── 计数徽标 — Default 尺寸 ─────────────────────────────────────────────────
size.default.height       = "20px"
size.default.min-width    = "20px"
size.default.padding      = "0 6px"
size.default.font-size    = "$ref(font.size.caption)"
size.default.border-width = "2px"

# ─── 计数徽标 — Small 尺寸 ───────────────────────────────────────────────────
size.small.height       = "14px"
size.small.min-width    = "14px"
size.small.padding      = "0 4px"
size.small.font-size    = "$ref(font.size.caption)"
size.small.border-width = "1px"

# ─── 圆点 ────────────────────────────────────────────────────────────────────
dot.default.width = "var(--badge-dot-size-default, 8px)"
dot.small.width   = "var(--badge-dot-size-small, 6px)"

# ─── 计数色（默认语义：红色提醒）─────────────────────────────────────────────
count.color              = "$ref(color.feedback.error.on-solid)"
count.background-color   = "$ref(color.feedback.error.solid)"
count.border-color       = "$ref(color.background.surface)"
count.font-weight        = "$ref(font.weight.label)"

# ─── 状态圆点颜色 ────────────────────────────────────────────────────────────
status.default.color    = "$ref(color.fill.default)"
status.processing.color = "$ref(color.feedback.info.icon)"
status.success.color    = "$ref(color.feedback.success.icon)"
status.warning.color    = "$ref(color.feedback.warning.icon)"
status.color-error = "var(--badge-status-error-color, $ref(color.feedback.error.icon))"

# ─── 状态文字 ────────────────────────────────────────────────────────────────
status.text.color     = "$ref(color.text.primary)"
status.text.gap       = "$ref(space.component-gap)"
status.text.font-size = "$ref(font.size.body)"

# ─── 定位（作为子节点角标时）─────────────────────────────────────────────────
indicator.transform = "translate(var(--badge-offset-x, 50%), var(--badge-offset-y, -50%))"
