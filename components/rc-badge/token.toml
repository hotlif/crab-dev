[build]
output = "./src/token.ts"
prefix = "badge"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

# ─── 通用 ────────────────────────────────────────────────────────────────────
root.transition = "background-color $ref(motion.interaction), color $ref(motion.interaction), transform $ref(motion.spatial.fast)"

# ─── 计数徽标 — Default 尺寸 ─────────────────────────────────────────────────
size.default.height = "16px"
size.default.min-width = "16px"
size.default.padding = "0 4px"
size.default.font-size    = "$ref(typography.caption.font-size)"
size.default.border-width = "0px"

# ─── 计数徽标 — Small 尺寸 ───────────────────────────────────────────────────
size.small.height = "16px"
size.small.min-width = "16px"
size.small.padding      = "0 4px"
size.small.font-size    = "$ref(typography.caption.font-size)"
size.small.border-width = "1px"

# ─── 圆点 ────────────────────────────────────────────────────────────────────
dot.default.width = "6px"
dot.small.width   = "6px"

# ─── 计数色（默认语义：红色提醒）─────────────────────────────────────────────
count.color              = "$ref(color.feedback.error.on-solid)"
count.background-color   = "$ref(color.feedback.error.solid)"
count.border-color       = "$ref(color.surface.content)"
count.font-weight        = "$ref(typography.label.font-weight)"

# ─── 状态圆点颜色 ────────────────────────────────────────────────────────────
status.default.color    = "$ref(color.fill.default)"
status.processing.color = "$ref(color.feedback.info.icon)"
status.success.color    = "$ref(color.feedback.success.icon)"
status.warning.color    = "$ref(color.feedback.warning.icon)"
status.color-error = "$ref(color.feedback.error.icon)"

# ─── 状态文字 ────────────────────────────────────────────────────────────────
status.text.color     = "$ref(color.text.primary)"
status.text.gap       = "$ref(space.component-gap)"
status.text.font-size = "$ref(typography.body.font-size)"

# ─── 定位（作为子节点角标时）─────────────────────────────────────────────────
indicator.transform = "translate(50%, -50%)"
