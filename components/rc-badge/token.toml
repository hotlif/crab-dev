[build]
output = "./src/token.ts"
prefix = "badge"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

# ─── 通用 ────────────────────────────────────────────────────────────────────
transition = "background-color 100ms cubic-bezier(0.4, 0, 0.2, 1), color 100ms cubic-bezier(0.4, 0, 0.2, 1), transform 100ms cubic-bezier(0.4, 0, 0.2, 1)"

# ─── 计数徽标 — Default 尺寸 ─────────────────────────────────────────────────
size.default.height       = "20px"
size.default.min-width    = "20px"
size.default.padding      = "0 6px"
size.default.font.size    = "$ref(font.size.caption)"
size.default.border.width = "2px"

# ─── 计数徽标 — Small 尺寸 ───────────────────────────────────────────────────
size.small.height       = "14px"
size.small.min-width    = "14px"
size.small.padding      = "0 4px"
size.small.font.size    = "$ref(font.size.caption)"
size.small.border.width = "1px"

# ─── 圆点 ────────────────────────────────────────────────────────────────────
dot.size.default = "8px"
dot.size.small   = "6px"

# ─── 计数色（默认语义：红色提醒）─────────────────────────────────────────────
count.color              = "$ref(color.text.on-brand)"
count.background.color   = "$ref(color.feedback.error)"
count.border-color       = "$ref(color.background.surface)"
count.font.weight        = "$ref(font.weight.label)"

# ─── 状态圆点颜色 ────────────────────────────────────────────────────────────
status.default.color    = "$ref(color.fill.inactive)"
status.primary.color    = "$ref(color.brand.primary)"
status.processing.color = "$ref(color.feedback.info)"
status.success.color    = "$ref(color.feedback.success)"
status.warning.color    = "$ref(color.feedback.warning)"
status.error.color      = "$ref(color.feedback.error)"

# ─── 状态文字 ────────────────────────────────────────────────────────────────
status.text.color     = "$ref(color.text.primary)"
status.text.gap       = "$ref(space.component-gap)"
status.text.font.size = "$ref(font.size.body)"

# ─── 定位（作为子节点角标时）─────────────────────────────────────────────────
offset.x = "50%"
offset.y = "-50%"
