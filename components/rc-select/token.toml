[build]
output = "./src/token.ts"
prefix = "select"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]
option.checkbox.width = "$ref(size.icon)"
root.transition = "background-color $ref(motion.interaction), border-color $ref(motion.interaction), color $ref(motion.interaction), box-shadow $ref(motion.interaction)"
motion.interaction.transition = "$ref(motion.interaction)"
motion.spatial.transition = "$ref(motion.spatial.fast)"
root.opacity-disabled = "$ref(opacity.disabled)"
root.touch.min-height = "$ref(size.touch-target)"
root.outline-width-focus = "2px"
root.outline-offset-focus = "2px"

root.border-width = "1px"
root.border-style = "solid"
root.border-color = "$ref(color.border.default)"
root.border-color-hover = "$ref(color.border.hover)"
root.border-color-focus = "$ref(color.border.focus)"
root.border-color-error = "$ref(color.feedback.error.border)"
root.border-color-warning = "$ref(color.feedback.warning.border)"
root.border-radius = "$ref(shape.control)"

root.background-color = "$ref(color.surface.content)"
root.background-color-disabled = "$ref(color.background.disabled)"

text.color = "$ref(color.text.primary)"
text.color-placeholder = "$ref(color.text.secondary)"
text.color-disabled = "$ref(color.text.disabled)"

option.background-color-hover = "$ref(color.state.hover)"
option.color-selected = "$ref(field.option.color-selected)"
option.background-color-selected = "$ref(field.option.background-selected)"
option.border-radius = "$ref(field.option.radius)"
option.color-disabled = "$ref(color.text.disabled)"
option.highlight.background-color = "$ref(color.state.hover)"
option.background-color-active = "$ref(color.state.pressed)"
option.selection.background-color-hover = "color-mix(in oklch, $ref(field.option.color-selected) calc($ref(state.opacity.hover) * 100%), $ref(field.option.background-selected))"
option.selection.background-color-active = "color-mix(in oklch, $ref(field.option.color-selected) calc($ref(state.opacity.pressed) * 100%), $ref(field.option.background-selected))"
option.activity.outline-color = "$ref(color.focus.ring)"
option.activity.outline-width = "2px"
option.activity.outline-offset = "-2px"
option.height = "$ref(density.item)"
option.padding-block = "$ref(space.inline-gap)"
option.font-size = "$ref(typography.body.medium.font-size)"
option.line-height = "$ref(typography.body.medium.line-height)"

root.box-shadow = "$ref(field.control.shadow)"
root.box-shadow-focus = "$ref(field.control.shadow-focus)"
root.validation.box-shadow-error = "$ref(field.control.shadow-error)"
root.validation.box-shadow-warning = "$ref(field.control.shadow-warning)"

tag.background-color = "$ref(color.background.hover-subtle)"
tag.color = "$ref(color.text.primary)"
tag.close.color-hover = "$ref(color.text.secondary)"

clear.color = "$ref(color.text.secondary)"
clear.color-hover = "$ref(color.text.primary)"
clear.width = "$ref(sizing.medium.action)"
clear.height = "$ref(sizing.medium.action)"
clear.touch.width = "$ref(size.touch-target)"
clear.box-shadow-focus = "inset 0 0 0 1px $ref(color.focus.ring)"
icon.width = "$ref(field.icon.size)"
icon.color = "$ref(color.text.secondary)"

field.gap = "$ref(space.inline-gap)"
field.padding-inline = "$ref(field.control.padding-inline)"
field.min-height = "$ref(field.control.min-height)"
field.label.top = "$ref(space.inline-gap)"
field.label.padding-inline = "$ref(space.inline-gap)"
field.label.font-size = "$ref(typography.body.small.font-size)"
field.label.line-height = "$ref(typography.body.small.line-height)"
field.label.color = "$ref(color.text.secondary)"
field.label.color-focus = "$ref(field.label.color-focus)"
field.input.padding-top = "$ref(space.section-gap)"
field.transition = "top $ref(motion.interaction), font-size $ref(motion.interaction), color $ref(motion.interaction), background-color $ref(motion.interaction)"
field.filled.background-color = "$ref(color.surface.highest)"
field.filled.background-color-hover = "color-mix(in oklch, $ref(color.text.primary) calc($ref(state.opacity.hover) * 100%), $ref(color.surface.highest))"
field.indicator.border-color = "$ref(color.text.secondary)"
field.indicator.box-shadow-focus = "inset 0 -2px 0 $ref(color.border.focus)"
field.indicator.box-shadow-error = "inset 0 -2px 0 $ref(color.feedback.error.border)"
field.indicator.box-shadow-warning = "inset 0 -2px 0 $ref(color.feedback.warning.border)"
field.color-error = "$ref(color.feedback.error.text)"
field.color-warning = "$ref(color.feedback.warning.text)"
field.support.line-height = "$ref(typography.body.small.line-height)"

group.color = "$ref(color.text.secondary)"
group.font-size = "$ref(typography.caption.font-size)"

root.color-loading = "$ref(color.text.secondary)"

size.large.height = "$ref(sizing.large.field)"
size.large.padding = "$ref(space.inline-gap) $ref(field.control.padding-inline)"
size.large.font-size = "$ref(field.input.font-size)"
size.large.line-height = "$ref(field.input.line-height)"

size.medium.height = "$ref(sizing.medium.field)"
size.medium.padding = "$ref(space.inline-gap) $ref(field.control.padding-inline)"
size.medium.font-size = "$ref(field.input.font-size)"
size.medium.line-height = "$ref(field.input.line-height)"

# Theme field roles retain the Material baseline and shadcn density independently.
size.small.height = "$ref(sizing.small.field)"
size.small.padding = "0 $ref(field.control.padding-inline)"
size.small.font-size = "$ref(field.input.font-size)"
size.small.line-height = "$ref(field.input.line-height)"

dropdown.margin = "6px"
dropdown.max-height = "240px"
dropdown.padding = "$ref(space.inline-gap)"
dropdown.option.padding = "$ref(space.component-gap)"
dropdown.border-radius = "$ref(shape.overlay)"

size.small.action.width = "$ref(sizing.small.action)"
size.medium.action.width = "$ref(sizing.medium.action)"
size.large.action.width = "$ref(sizing.large.action)"

# Filled fields reserve two text rows for their internal floating label.
field.filled.min-height = "$ref(size.field-labeled)"
field.outline.border-width-focus = "3px"
