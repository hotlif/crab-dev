[build]
output = "./src/token.ts"
prefix = "slider"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

rail.interact.height = "$ref(size.32)"
rail.height = "4px"
rail.fill-inactive = "$ref(color.secondary.container)"
rail.fill-active = "$ref(color.brand.primary)"

thumb.border-radius = "$ref(shape.full)"
thumb.fill = "$ref(color.brand.primary)"
thumb.stroke-color = "$ref(color.brand.primary)"
thumb.stroke-width = "0px"
thumb.box-shadow = "none"
thumb.halo.scale.width = "1.8"
thumb.halo.fill = "$ref(color.brand.primary)"
thumb.halo.opacity-hover = "$ref(state.opacity.hover)"
thumb.halo.opacity-focus = "$ref(state.opacity.focus)"
thumb.halo.opacity-dragging = "$ref(state.opacity.dragged)"
root.transition = "$ref(motion.interaction)"
root.touch.min-height = "$ref(size.touch-target)"
root.outline-color-focus = "$ref(color.focus.ring)"
root.outline-width-focus = "2px"
root.outline-offset-focus = "3px"
root.opacity-disabled = "$ref(opacity.disabled)"
thumb.width = "4px"
thumb.halo.width = "$ref(size.28)"

thumb.height = "$ref(size.20)"
thumb.width-active = "2px"
rail.gap = "4px"
rail.border-radius = "$ref(shape.small)"
rail.inner.border-radius = "2px"
stop.width = "4px"
stop.background-color = "$ref(color.secondary.on-container)"
thumb.transition = "width $ref(motion.spatial.fast), background-color $ref(motion.effects.fast)"
size.xs.track.height = "4px"
size.xs.thumb.height = "$ref(size.20)"
size.xs.track.border-radius = "$ref(shape.small)"
size.s.track.height = "6px"
size.s.thumb.height = "$ref(size.24)"
size.s.track.border-radius = "$ref(shape.small)"
size.m.track.height = "8px"
size.m.thumb.height = "$ref(size.28)"
size.m.track.border-radius = "$ref(shape.medium)"
size.l.track.height = "12px"
size.l.thumb.height = "$ref(size.32)"
size.l.track.border-radius = "$ref(shape.large)"
size.xl.track.height = "16px"
size.xl.thumb.height = "$ref(size.40)"
size.xl.track.border-radius = "$ref(shape.extra-large)"
