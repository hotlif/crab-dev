[build]
output = "./src/token.ts"
prefix = "slider"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

rail.interact.height = "$ref(size.32)"
rail.height = "4px"
rail.fill-inactive = "$ref(range.track.inactive)"
rail.fill-active = "$ref(color.brand.primary)"
track.fill-disabled = "$ref(range.disabled.track-fill)"
rail.fill-disabled = "$ref(range.disabled.rail-fill)"

thumb.border-radius = "$ref(shape.full)"
thumb.fill = "$ref(range.thumb.fill)"
thumb.fill-error = "$ref(range.thumb.error-fill)"
thumb.fill-disabled = "$ref(range.disabled.thumb-fill)"
thumb.stroke-color = "$ref(range.thumb.stroke-color)"
thumb.stroke-width = "$ref(range.thumb.stroke-width)"
thumb.box-shadow = "$ref(range.thumb.shadow)"
thumb.halo.scale.width = "1.8"
thumb.halo.fill = "$ref(color.brand.primary)"
thumb.halo.opacity-hover = "$ref(state.opacity.hover)"
thumb.halo.opacity-focus = "$ref(state.opacity.focus)"
thumb.halo.opacity-dragging = "$ref(state.opacity.dragged)"
root.transition = "$ref(motion.interaction)"
root.touch.min-height = "$ref(size.touch-target)"
root.outline-color-focus = "$ref(color.focus.ring)"
root.outline-width-focus = "2px"
root.outline-offset-focus = "3px"
root.opacity-disabled = "$ref(range.disabled.opacity)"
thumb.width = "$ref(range.thumb.width)"
thumb.halo.width = "$ref(range.thumb.halo-size)"

thumb.height = "$ref(size.20)"
thumb.width-active = "$ref(range.thumb.pressed-width)"
rail.gap = "$ref(range.track.gap)"
rail.border-radius = "$ref(shape.small)"
rail.inner.border-radius = "$ref(range.track.inner-radius)"
stop.width = "$ref(range.stop.size)"
stop.background-color = "$ref(color.secondary.on-container)"
stop.background-color-disabled = "color-mix(in oklch, $ref(color.text.primary) calc($ref(opacity.disabled) * 100%), transparent)"
thumb.transition = "width $ref(motion.spatial.fast), background-color $ref(motion.effects.fast)"
size.xs.track.height = "$ref(range.xs.track-height)"
size.xs.thumb.height = "$ref(range.xs.thumb-height)"
size.xs.track.border-radius = "$ref(shape.small)"
size.s.track.height = "$ref(range.s.track-height)"
size.s.thumb.height = "$ref(range.s.thumb-height)"
size.s.track.border-radius = "$ref(shape.small)"
size.m.track.height = "$ref(range.m.track-height)"
size.m.thumb.height = "$ref(range.m.thumb-height)"
size.m.track.border-radius = "$ref(shape.medium)"
size.l.track.height = "$ref(range.l.track-height)"
size.l.thumb.height = "$ref(range.l.thumb-height)"
size.l.track.border-radius = "$ref(shape.large)"
size.xl.track.height = "$ref(range.xl.track-height)"
size.xl.thumb.height = "$ref(range.xl.thumb-height)"
root.color-error = "$ref(color.feedback.error.solid)"
size.xl.track.border-radius = "$ref(shape.extra-large)"
