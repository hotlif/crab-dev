[build]
output = "./src/token.ts"
prefix = "tag"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

# ─── 通用 ────────────────────────────────────────────────────────────────────
root.transition = "var(--tag-transition, background-color $ref(motion.interaction), border-color $ref(motion.interaction), color $ref(motion.interaction))"

# ─── 尺寸 — Large ────────────────────────────────────────────────────────────
size.large.height = "$ref(size.40)"
size.large.padding       = "0 10px"
size.large.border-radius = "$ref(shape.small)"
size.large.font-size = "$ref(typography.label.large.font-size)"
size.large.gap           = "$ref(space.component-gap)"

# ─── 尺寸 — Middle（默认）────────────────────────────────────────────────────
size.middle.height = "$ref(size.32)"
size.middle.padding       = "0 8px"
size.middle.border-radius = "$ref(shape.small)"
size.middle.font-size = "$ref(typography.label.large.font-size)"
size.middle.gap           = "$ref(space.inline-gap)"

# ─── 尺寸 — Small ────────────────────────────────────────────────────────────
size.small.height = "$ref(size.32)"
size.small.padding       = "0 6px"
size.small.border-radius = "$ref(shape.small)"
size.small.font-size = "$ref(typography.label.large.font-size)"
size.small.gap           = "$ref(space.inline-gap)"

# ─── Default — 默认标签 ──────────────────────────────────────────────────────
default.color              = "$ref(color.text.primary)"
default.background-color   = "$ref(color.background.hover-subtle)"
default.border-color       = "$ref(color.border.default)"

# ─── Primary — 品牌标签 ──────────────────────────────────────────────────────
primary.color              = "$ref(color.text.on-brand)"
primary.background-color   = "$ref(color.brand.primary)"
primary.border-color       = "$ref(color.brand.primary)"

# ─── Success — 成功标签 ──────────────────────────────────────────────────────
success.color              = "$ref(color.feedback.success.text)"
success.background-color   = "$ref(color.feedback.success.background)"
success.border-color       = "$ref(color.feedback.success.border)"

# ─── Warning — 警告标签 ──────────────────────────────────────────────────────
warning.color              = "$ref(color.feedback.warning.text)"
warning.background-color   = "$ref(color.feedback.warning.background)"
warning.border-color       = "$ref(color.feedback.warning.border)"

# ─── Error — 错误标签 ────────────────────────────────────────────────────────
root.color-error            = "var(--tag-error-color, $ref(color.feedback.error.text))"
root.background-color-error = "var(--tag-error-background-color, $ref(color.feedback.error.background))"
root.border-color-error     = "var(--tag-error-border-color, $ref(color.feedback.error.border))"

# ─── 关闭按钮 ────────────────────────────────────────────────────────────────
close.width = "var(--tag-close-size, 14px)"
close.color        = "$ref(color.text.secondary)"
close.color-hover  = "$ref(color.text.primary)"

interaction.touch.min-width = "$ref(size.touch-target)"
interaction.touch.min-height = "$ref(size.touch-target)"
interaction.outline-color-focus = "$ref(color.focus.ring)"
interaction.outline-width-focus = "2px"
interaction.outline-offset-focus = "2px"

# Material Filter chip：选中使用 secondary container，并以勾选图标提供非颜色意符。
checkable.color-selected = "$ref(color.secondary.on-container)"
checkable.background-color-selected = "$ref(color.secondary.container)"
checkable.border-color-selected = "$ref(color.secondary.container)"
checkable.icon.width = "18px"
checkable.state.opacity-hover = "$ref(state.opacity.hover)"
checkable.state.opacity-focus = "$ref(state.opacity.focus)"
checkable.state.opacity-active = "$ref(state.opacity.pressed)"
checkable.state.transition = "$ref(motion.interaction)"
checkable.opacity-disabled = "$ref(opacity.disabled)"
