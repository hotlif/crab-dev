# Layout regressions consume published ESM and extracted theme CSS via test:browser.
[test]
environment = "browser"
include = ["suffix-focus.test.tsx"]
timeout_ms = 15000
leaks = "error"

[test.react]
strict_mode = false
cleanup = true
act_warnings = "error"

[test.network]
mode = "deny"
allow_hosts = []

[test.coverage]
enabled = true
reporters = ["text", "lcov"]
