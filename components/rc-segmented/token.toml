[build]
output = "./src/token.ts"
prefix = "segmented"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

# ─── 容器（track） ──────────────────────────────────────────────────────────
# Baseline M3 outlined segments share a border; the selected segment owns its fill.

track.background-color = "$ref(navigation.segment.track-background)"
track.border-radius = "$ref(navigation.segment.track-radius)"
root.font-weight = "$ref(typography.label.font-weight)"
root.font-family = "$ref(typography.label.large.font-family)"
root.line-height = "$ref(typography.label.large.line-height)"


# ─── 尺寸 — Large ────────────────────────────────────────────────────────────

size.large.height = "$ref(navigation.segment.large-height)"
size.large.font-size = "$ref(typography.label.large.font-size)"
size.large.padding-inline = "$ref(sizing.large.padding)"
size.large.gap          = "$ref(space.component-gap)"
size.large.track.padding = "$ref(navigation.segment.track-padding)"
size.large.border-radius = "$ref(navigation.segment.item-radius)"


# ─── 尺寸 — Middle (默认) ────────────────────────────────────────────

size.medium.height = "$ref(navigation.segment.medium-height)"
size.medium.font-size = "$ref(typography.label.large.font-size)"
size.medium.padding-inline = "$ref(sizing.medium.padding)"
size.medium.gap         = "$ref(space.component-gap)"
size.medium.track.padding = "$ref(navigation.segment.track-padding)"
size.medium.border-radius = "$ref(navigation.segment.item-radius)"


# ─── 尺寸 — Small ────────────────────────────────────────────────────────────

size.small.height = "$ref(navigation.segment.small-height)"
size.small.font-size = "$ref(typography.label.large.font-size)"
size.small.padding-inline = "$ref(sizing.small.padding)"
size.small.gap          = "$ref(space.component-gap)"
size.small.track.padding = "$ref(navigation.segment.track-padding)"
size.small.border-radius = "$ref(navigation.segment.item-radius)"


# ─── 选项文本 ────────────────────────────────────────────────────────────────

item.color          = "$ref(color.text.primary)"
item.color-hover    = "$ref(color.text.primary)"
item.color-selected = "$ref(navigation.segment.selected-color)"
item.color-disabled = "color-mix(in srgb, $ref(color.text.primary) calc(var(--segmented-root-opacity-disabled, $ref(opacity.disabled)) * 100%), transparent)"
item.background-color-disabled = "color-mix(in srgb, $ref(color.text.primary) 12%, transparent)"


# ─── 滑块（thumb） ──────────────────────────────────────────────────────────

thumb.background-color = "$ref(navigation.segment.selected-background)"
thumb.box-shadow = "$ref(navigation.segment.selected-shadow)"
thumb.transition = "transform $ref(motion.spatial.fast), width $ref(motion.spatial.fast)"


# ─── 焦点环 ──────────────────────────────────────────────────────────────────

item.outline-color-focus  = "$ref(color.focus.ring)"
item.outline-width-focus  = "2px"
item.outline-offset-focus = "-2px"


# ─── 禁用状态 ────────────────────────────────────────────────────────────────

root.opacity-disabled = "$ref(opacity.disabled)"


# ─── 动效 ────────────────────────────────────────────────────────────────────
# item：选项文字颜色过渡，走 semantic interaction（快到近乎即时）

item.transition = "$ref(motion.interaction)"

interaction.touch.min-width = "$ref(size.touch-target)"
interaction.touch.min-height = "$ref(size.touch-target)"
interaction.outline-color-focus = "$ref(color.focus.ring)"
interaction.outline-width-focus = "2px"
interaction.outline-offset-focus = "2px"
interaction.transition = "$ref(motion.interaction)"
track.border-color = "$ref(navigation.segment.track-border)"
item.border-color = "$ref(navigation.segment.divider)"
item.check.display = "$ref(navigation.segment.check-display)"
item.icon.display-selected = "$ref(navigation.segment.selected-icon-display)"
track.border-color-disabled = "color-mix(in srgb, $ref(color.text.primary) 12%, transparent)"
item.state-layer.opacity-hover = "$ref(state.opacity.hover)"
item.state-layer.opacity-focus = "$ref(state.opacity.focus)"
item.state-layer.opacity-active = "$ref(state.opacity.pressed)"
item.icon.width = "$ref(size.icon)"
