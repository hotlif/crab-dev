[build]
output  = "./src/token.ts"
prefix  = "component-preview"
imports = ["@crab-dev/rc-token-semantic"]

[token]

# ─── 通用 ────────────────────────────────────────────────────────────────────

transition        = "color 120ms cubic-bezier(0.4, 0, 0.2, 1), background-color 120ms cubic-bezier(0.4, 0, 0.2, 1), border-color 120ms cubic-bezier(0.4, 0, 0.2, 1), box-shadow 200ms cubic-bezier(0.4, 0, 0.2, 1), transform 200ms cubic-bezier(0.32, 0.72, 0, 1)"
transition-expand = "max-height 280ms cubic-bezier(0.32, 0.72, 0, 1)"


# ─── 卡片容器 ────────────────────────────────────────────────────────────────

card.background.color   = "$ref(color.background.elevated)"
card.border.color       = "$ref(color.border.default)"
card.border.color-hover = "$ref(color.border.hover)"
card.border.radius      = "$ref(radius.lg)"
card.shadow             = "0 1px 2px 0 oklch(0% 0 0 / 0.04)"
card.shadow-hover       = "0 1px 2px 0 oklch(0% 0 0 / 0.04), 0 8px 24px -12px oklch(0% 0 0 / 0.10)"


# ─── 舞台（预览区） ──────────────────────────────────────────────────────────

stage.padding              = "56px 24px"
stage.min-height           = "220px"
stage.background.color     = "$ref(color.background.elevated)"


# ─── 中间信息栏（title + description + 按钮，上下两行） ──────────────────────

meta.border.color           = "$ref(color.border.default)"

# 上行：信息区（白底，标题横跨虚线居中）
meta.info.padding           = "0 20px 16px"
meta.info.background.color  = "$ref(color.background.elevated)"
meta.info.divider.style     = "solid"
meta.title.padding          = "0 12px"
meta.title.offset           = "24px"  # 标题 chip 距顶部虚线的垂直位置修正

# 下行：操作区（右对齐 + 图标加文字）
meta.actions.padding        = "10px 14px"
meta.actions.background.color = "$ref(color.background.surface)"
meta.actions.border.style   = "solid"

meta.title.color          = "$ref(color.text.primary)"
meta.title.font.size      = "15px"
meta.title.font.weight    = "$ref(font.weight.heading)"
meta.title.letter-spacing = "-0.01em"
meta.title.line-height    = "1.4"

meta.desc.color           = "$ref(color.text.secondary)"
meta.desc.font.size       = "$ref(font.size.caption)"
meta.desc.line-height     = "1.6"
meta.desc.code.color            = "$ref(color.text.primary)"
meta.desc.code.background.color = "$ref(color.background.hover-subtle)"
meta.desc.code.padding          = "1px 6px"
meta.desc.code.border.radius    = "$ref(radius.sm)"

meta.info.gap             = "6px"
meta.actions.gap          = "4px"
meta.actions.icon.size      = "18px"


# ─── 操作按钮（图标 + 文字） ─────────────────────────────────────────────────

action.height           = "30px"
action.padding          = "0 12px"
action.gap              = "6px"
action.border.radius    = "$ref(radius.md)"
action.font.size        = "$ref(font.size.caption)"
action.font.weight      = "$ref(font.weight.label)"
action.color            = "$ref(color.text.secondary)"
action.color-hover      = "$ref(color.text.primary)"
action.color-active     = "$ref(color.text.primary)"
action.background.color       = "transparent"
action.background.color-hover = "$ref(color.background.hover-subtle)"
action.background.color-active = "$ref(color.background.elevated)"
action.border.color           = "transparent"
action.border.color-hover     = "transparent"
action.border.color-active    = "$ref(color.border.default)"
action.border.color-focus     = "$ref(color.border.focus)"
action.shadow-active          = "0 1px 2px 0 oklch(0% 0 0 / 0.05)"


# ─── 代码预览区 ──────────────────────────────────────────────────────────────

source.background.color      = "$ref(color.background.surface)"
source.padding-block         = "16px"
source.font.size             = "13px"
source.font.family           = "ui-monospace, 'SFMono-Regular', 'Menlo', 'Cascadia Code', 'Fira Code', monospace"
source.line-height           = "1.7"
source.tab-size              = "4"
source.border.color          = "$ref(color.border.default)"

source.collapsed-height      = "0px"
source.expanded-height       = "520px"

source.scrollbar.color       = "$ref(color.border.hover)"
source.scrollbar.color-hover = "$ref(color.text.tertiary)"

source.gutter.color          = "$ref(color.text.tertiary)"
source.gutter.min-width      = "2.5em"
source.gutter.padding-right  = "16px"
source.gutter.margin-right   = "20px"


# ─── 反馈 ────────────────────────────────────────────────────────────────────

feedback.success.color = "$ref(color.feedback.success)"
