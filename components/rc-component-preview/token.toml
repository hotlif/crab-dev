[build]
output  = "./src/token.ts"
prefix  = "component-preview"
imports = ["@crab-dev/rc-token-semantic"]

[token]

# ─── 通用 ────────────────────────────────────────────────────────────────────

root.transition = "color $ref(motion.interaction), background-color $ref(motion.interaction), border-color $ref(motion.interaction), box-shadow $ref(motion.interaction), transform $ref(motion.spatial.fast)"
source.transition = "grid-template-rows $ref(motion.expand)"


# ─── 卡片容器 ────────────────────────────────────────────────────────────────

card.background-color = "$ref(color.surface.low)"
card.border-color       = "$ref(color.border.subtle)"
card.border-color-hover = "$ref(color.border.hover)"
card.border-radius = "$ref(shape.medium)"
card.box-shadow             = "none"
card.box-shadow-hover       = "$ref(shadow.overlay)"


# ─── 舞台（预览区） ──────────────────────────────────────────────────────────

stage.padding              = "56px 24px"
stage.min-height           = "220px"
stage.background-color     = "$ref(color.surface.raised)"


# ─── 中间信息栏（title + description + 按钮，上下两行） ──────────────────────

meta.border-color           = "$ref(color.border.default)"

# 上行：信息区（白底，标题横跨虚线居中）
meta.info.padding           = "0 20px 16px"
meta.info.background-color  = "$ref(color.surface.raised)"
meta.info.divider.border-style = "solid"
meta.title.padding          = "0 12px"
# 标题 chip 距顶部虚线的垂直位置修正
meta.title.top              = "24px"

# 下行：操作区（右对齐 + 图标加文字）
meta.actions.padding        = "10px 14px"
meta.actions.background-color = "$ref(color.surface.content)"
meta.actions.border-style   = "solid"

meta.title.color          = "$ref(color.text.primary)"
meta.title.font-size      = "15px"
meta.title.font-weight    = "$ref(typography.title.large.emphasized.font-weight)"
meta.title.letter-spacing = "-0.01em"
meta.title.line-height    = "1.4"

meta.desc.color           = "$ref(color.text.secondary)"
meta.desc.font-size       = "$ref(typography.caption.font-size)"
meta.desc.line-height     = "1.6"
meta.desc.code.color            = "$ref(color.text.primary)"
meta.desc.code.background-color = "$ref(color.background.hover-subtle)"
meta.desc.code.padding          = "1px 6px"
meta.desc.code.border-radius    = "$ref(radius.sm)"

meta.info.gap             = "6px"
meta.actions.gap          = "4px"
meta.actions.min-width  = "$ref(size.touch-target)"
meta.actions.min-height = "$ref(size.touch-target)"
meta.actions.icon.width     = "18px"


# ─── 操作按钮（图标 + 文字） ─────────────────────────────────────────────────

action.height           = "30px"
action.padding          = "0 12px"
action.gap              = "6px"
action.border-radius    = "$ref(shape.control)"
action.font-size        = "$ref(typography.caption.font-size)"
action.font-weight      = "$ref(typography.label.font-weight)"
action.color            = "$ref(color.text.secondary)"
action.color-hover      = "$ref(color.text.primary)"
action.color-active     = "$ref(color.text.primary)"
action.background-color       = "transparent"
action.background-color-hover = "$ref(color.state.hover)"
action.background-color-active = "$ref(color.surface.raised)"
action.border-color           = "transparent"
action.border-color-hover     = "transparent"
action.border-color-active    = "$ref(color.border.default)"
action.border-color-focus     = "$ref(color.border.focus)"
action.box-shadow-active          = "$ref(shadow.float)"


# ─── 代码预览区 ──────────────────────────────────────────────────────────────

source.background-color      = "$ref(color.surface.content)"
source.padding-block         = "16px"
source.font-size             = "13px"
source.font-family           = "ui-monospace, 'SFMono-Regular', 'Menlo', 'Cascadia Code', 'Fira Code', monospace"
source.line-height           = "1.7"
source.tab-size              = "4"
source.border-color          = "$ref(color.border.default)"

source.collapsed.max-height  = "0px"
source.expanded.max-height   = "520px"

source.scrollbar.color       = "$ref(color.border.hover)"
source.scrollbar.color-hover = "$ref(color.text.tertiary)"

source.gutter.color          = "$ref(color.text.tertiary)"
source.gutter.min-width      = "2.5em"
source.gutter.padding-right  = "16px"
source.gutter.margin-right   = "20px"


# ─── 反馈 ────────────────────────────────────────────────────────────────────

feedback.success.color = "$ref(color.feedback.success.text)"
