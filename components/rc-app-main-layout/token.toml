[build]
output = "./src/token.ts"
prefix = "app-main-layout"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

root.background-color = "$ref(color.workspace.content)"

header.box-shadow = "none"
header.background-color = "$ref(color.workspace.toolbar)"
header.z-index = "$ref(z-index.base)"
header.divider.background-color = "$ref(color.border.subtle)"

header.toolbar.height = "$ref(size.64)"
header.toolbar.padding = "0 16px"
header.toolbar.gap = "6px"
header.toolbar.background-color = "$ref(color.workspace.toolbar)"

header.nav-btn.width = "$ref(size.48)"
header.nav-btn.color = "$ref(color.text.secondary)"
header.nav-btn.color-hover = "$ref(color.text.primary)"
header.nav-btn.background-color-hover = "color-mix(in oklch, $ref(color.text.primary) calc($ref(state.opacity.hover) * 100%), transparent)"
header.nav-btn.background-color-active = "color-mix(in oklch, $ref(color.text.primary) calc($ref(state.opacity.pressed) * 100%), transparent)"
header.nav-btn.border-radius = "$ref(shape.full)"
header.nav-btn.icon.width = "20px"
header.nav-btn.dot.background-color = "$ref(color.feedback.error.solid)"

header.user.pill.padding = "0 $ref(space.component-gap)"
header.user.pill.gap = "$ref(space.stack-gap)"
header.user.pill.height = "$ref(size.48)"
header.user.pill.border-radius = "$ref(shape.full)"
header.user.pill.background-color-hover = "color-mix(in oklch, $ref(color.text.primary) calc($ref(state.opacity.hover) * 100%), transparent)"
header.user.name.font-size = "$ref(typography.body.font-size)"
header.user.name.color = "$ref(color.text.primary)"
header.user.name.font-weight = "500"
header.user.avatar.width = "$ref(size.32)"
header.user.avatar.font-size = "14px"
header.user.avatar.icon.width = "20px"
header.user.avatar.background-color = "$ref(color.workspace.sidebar)"
header.user.avatar.color = "$ref(color.text.secondary)"

# Desktop workspace account menu: a softer surface, separate from the tab context menu.
header.user.menu.min-width = "192px"
header.user.menu.padding = "$ref(space.component-gap)"
header.user.menu.gap = "$ref(space.component-gap)"
header.user.menu.background-color = "$ref(color.workspace.toolbar)"
header.user.menu.border-radius = "$ref(shape.medium)"
header.user.menu.box-shadow = "$ref(shadow.float)"
header.user.menu.item.height = "$ref(size.40)"
header.user.menu.item.padding = "0 $ref(space.stack-gap)"
header.user.menu.item.gap = "$ref(space.stack-gap)"
header.user.menu.item.border-radius = "$ref(shape.small)"
header.user.menu.item.font-size = "$ref(typography.body.medium.font-size)"
header.user.menu.item.font-weight = "$ref(typography.body.medium.font-weight)"
header.user.menu.item.line-height = "$ref(typography.body.medium.line-height)"
header.user.menu.item.icon.width = "20px"

sidebar.width = "280px"
sidebar.collapsed.width = "80px"
sidebar.padding = "12px 8px"
sidebar.collapsed.padding = "12px 0"
sidebar.gap = "4px"
sidebar.background-color = "$ref(color.workspace.sidebar)"
sidebar.border-color = "transparent"
sidebar.logo.width = "40px"
sidebar.logo.touch.min-height = "$ref(size.touch-target)"
sidebar.logo.gap = "12px"
sidebar.logo.padding = "4px 8px 16px"
sidebar.logo.border-radius = "$ref(shape.card)"
sidebar.logo.background-color = "$ref(color.brand.primary)"
sidebar.logo.color = "$ref(color.text.on-brand)"
sidebar.logo.title.font-size = "$ref(font.size.heading)"
sidebar.logo.title.color = "$ref(color.text.primary)"

content.background-color = "$ref(color.workspace.content)"

breadcrumbs.padding = "10px 16px"
breadcrumbs.background-color = "$ref(color.workspace.toolbar)"
breadcrumbs.border-color = "$ref(color.border.default)"

tab.strip.height = "$ref(size.40)"
tab.strip.background-color = "$ref(color.workspace.frame)"
tab.strip.padding = "$ref(space.control-padding-y) 0 0"
tab.font-size = "13px"
tab.font-family = "$ref(typography.title.small.font-family)"
tab.font-weight = "$ref(typography.body.medium.font-weight)"
tab.font-weight-active = "$ref(typography.title.small.font-weight)"
tab.line-height = "$ref(typography.title.small.line-height)"

tab.item.height = "34px"
tab.item.touch.height = "$ref(size.touch-target)"
tab.item.min-width = "$ref(size.96)"
tab.item.max-width = "240px"
tab.item.padding = "0 10px"
tab.item.color = "$ref(color.text.secondary)"
tab.item.color-active = "$ref(color.text.primary)"
tab.item.background-color = "$ref(color.workspace.toolbar)"
tab.item.background-color-hover = "color-mix(in oklch, $ref(color.workspace.toolbar) 50%, $ref(color.workspace.frame))"
tab.item.border-radius = "10px"
tab.item.curve.width = "10px"
tab.item.gap = "8px"
tab.item.separator.width = "1px"
tab.item.separator.background-color = "$ref(color.border.subtle)"
tab.item.outline-color-focus = "$ref(color.focus.ring)"
tab.item.outline-width-focus = "2px"
tab.item.outline-offset-focus = "-2px"
tab.item.icon.width = "16px"
tab.item.close.width = "18px"
tab.item.close.touch.width = "$ref(size.32)"
tab.item.close.icon.width = "10px"
tab.item.close.border-radius = "$ref(shape.full)"
tab.item.close.color = "$ref(color.text.secondary)"
tab.item.close.color-hover = "$ref(color.text.primary)"
tab.item.close.background-color-hover = "color-mix(in oklch, $ref(color.text.primary) calc($ref(state.opacity.pressed) * 100%), transparent)"
tab.item.box-shadow-dragging = "$ref(shadow.overlay)"
tab.item.box-shadow-snapping = "none"
tab.item.motion.reorder.transition = "$ref(motion.spatial.fast)"

tab.context-menu.min-width = "176px"
tab.context-menu.padding = "4px"
tab.context-menu.background-color = "$ref(color.workspace.toolbar)"
tab.context-menu.border-color = "$ref(color.border.default)"
tab.context-menu.border-radius = "$ref(shape.extra-small)"
tab.context-menu.box-shadow = "$ref(shadow.overlay)"
# 右键菜单属 portal 浮层，与库内下拉 / 树右键菜单同档（float），tooltip(elevated) 仍在其上
tab.context-menu.z-index = "$ref(z-index.float)"

tab.context-menu.item.height = "$ref(size.48)"
tab.context-menu.item.padding = "0 12px"
tab.context-menu.item.gap = "10px"
tab.context-menu.item.font-size = "$ref(typography.body.large.font-size)"
tab.context-menu.item.color = "$ref(color.text.primary)"
tab.context-menu.item.color-disabled = "$ref(color.text.tertiary)"
tab.context-menu.item.background-color-hover = "$ref(color.state.hover)"
tab.context-menu.item.border-radius = "6px"
tab.context-menu.item.icon.width = "16px"
tab.context-menu.item.icon.color = "$ref(color.text.secondary)"

tab.context-menu.separator.background-color = "$ref(color.border.default)"
tab.context-menu.separator.margin = "4px 0"

motion.interaction.transition = "$ref(motion.interaction)"
motion.offset.translate = "calc($ref(space.component-gap) * -1)"

motion.spatial.transition = "$ref(motion.spatial.fast)"
