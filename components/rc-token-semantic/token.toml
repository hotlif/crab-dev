[build]
output = "./src/token.ts"
prefix = "token-semantic"
imports = ["@crab-dev/rc-token-global"]

[token]

# ═══════════════════════════════════════════════════════════════════════════════
#  🦀 Crab Design System — Semantic Tokens (Layer 2)
#
#  ┌─────────────────────────────────────────────────────────────────────────┐
#  │  职责：将 Layer 1 原始刻度赋予设计意图                                    │
#  │                                                                         │
#  │  • 本层定义"用途"，不定义"值"——所有值通过 $ref() 引用 Layer 1             │
#  │  • Light / Dark 主题切换只需在本层重新绑定                                │
#  │  • 组件不应直接引用 Layer 1，而应引用本层语义变量                           │
#  │  • 命名公式：{category}.{intent}[-{state}]                               │
#  └─────────────────────────────────────────────────────────────────────────┘
#
#  以下为 Light 主题默认值。Dark 主题通过覆写本层 CSS 变量实现。
#  参见 RFC-DESIGN-TOKEN-20260329 §4.1
# ═══════════════════════════════════════════════════════════════════════════════


# ─── 颜色 · 品牌 / 主色 ─────────────────────────────────────────────────────
# MD3 Expressive 默认紫色品牌；表面采用 Material Neutral。明暗配对见 theme.ts。

color.brand.primary        = "$ref(purple.40)"
color.brand.primary-hover  = "$ref(purple.30)"
color.brand.primary-active = "$ref(purple.20)"
color.brand.primary-subtle = "$ref(purple.40)"

# Paired tonal action colors. Legacy selection overrides remain effective.
color.brand.container = "var(--token-semantic-color-selection-background, $ref(purple.90))"
color.brand.on-container = "var(--token-semantic-color-selection-foreground, $ref(purple.10))"

# Neutral surface roles; theme.ts owns the corresponding Light / Dark values.
color.surface.canvas = "var(--token-semantic-color-background-sunken, $ref(material.neutral.98))"
color.surface.content = "var(--token-semantic-color-background-surface, $ref(material.neutral.98))"
color.surface.container = "$ref(material.neutral.94)"
color.surface.raised = "var(--token-semantic-color-background-elevated, $ref(material.neutral.96))"
color.surface.overlay = "$ref(material.neutral.92)"

# Neutral browser-style workspace surfaces; isolated from brand-tinted M3 surfaces.
color.workspace.frame = "$ref(zinc.200)"
color.workspace.toolbar = "$ref(white)"
color.workspace.sidebar = "$ref(zinc.100)"
color.workspace.content = "$ref(white)"

# Explicit code themes keep their backgrounds and gutters paired across page themes.
color.code.light.background = "$ref(material.neutral.98)"
color.code.light.gutter = "$ref(material.neutral.40)"
color.code.dark.background = "$ref(material.neutral.20)"
color.code.dark.gutter = "$ref(material.neutral.80)"

# Shared states used by neutral interactive containers; filled actions keep their paired states.
state.opacity.hover = "$ref(opacity.8)"
state.opacity.focus = "$ref(opacity.12)"
state.opacity.pressed = "$ref(opacity.12)"
state.opacity.dragged = "$ref(opacity.16)"
color.state.hover = "var(--token-semantic-color-background-hover-subtle, color-mix(in oklch, $ref(material.neutral.10) calc(var(--token-semantic-state-opacity-hover, $ref(opacity.8)) * 100%), $ref(material.neutral.98)))"
color.state.pressed = "var(--token-semantic-color-background-active-subtle, color-mix(in oklch, $ref(material.neutral.10) calc(var(--token-semantic-state-opacity-pressed, $ref(opacity.12)) * 100%), $ref(material.neutral.98)))"
color.state.dragged = "color-mix(in oklch, var(--token-semantic-color-brand-primary, $ref(purple.40)) calc(var(--token-semantic-state-opacity-dragged, $ref(opacity.16)) * 100%), transparent)"


# ─── 颜色 · 背景 ────────────────────────────────────────────────────────────

color.background.surface = "$ref(material.neutral.98)"
color.background.elevated = "$ref(material.neutral.96)"
color.background.sunken = "$ref(material.neutral.98)"
color.background.inverse = "$ref(material.neutral.20)"
color.background.overlay = "color-mix(in oklch, $ref(black) 32%, transparent)"
color.background.disabled = "$ref(material.neutral.90)"
color.background.hover-subtle = "color-mix(in oklch, $ref(material.neutral.10) calc(var(--token-semantic-state-opacity-hover, $ref(opacity.8)) * 100%), $ref(material.neutral.98))"
color.background.active-subtle = "color-mix(in oklch, $ref(material.neutral.10) calc(var(--token-semantic-state-opacity-pressed, $ref(opacity.12)) * 100%), $ref(material.neutral.98))"
color.background.selected      = "$ref(purple.90)"


# ─── 颜色 · 文本 ────────────────────────────────────────────────────────────

color.text.primary = "$ref(material.neutral.10)"
color.text.secondary = "$ref(material.neutral-variant.30)"
color.text.tertiary = "$ref(material.neutral-variant.30)"
color.text.on-brand    = "$ref(white)"
color.text.inverse = "$ref(material.neutral.95)"
color.text.disabled = "$ref(material.neutral.10)"
color.text.link        = "$ref(purple.40)"
color.text.link-hover  = "$ref(purple.30)"


# ─── 颜色 · 边框 ────────────────────────────────────────────────────────────

color.border.subtle = "$ref(material.neutral-variant.80)"
color.border.default = "$ref(material.neutral-variant.50)"
color.border.hover = "$ref(material.neutral.10)"
color.border.strong = "$ref(material.neutral.10)"
color.border.focus    = "$ref(purple.40)"
color.border.error = "$ref(material.error.40)"


# ─── 颜色 · 焦点 / 选区 / 高亮 ───────────────────────────────────────────────

color.focus.ring                  = "var(--token-semantic-color-border-focus, $ref(purple.40))"
color.selection.background        = "$ref(purple.90)"
color.selection.border            = "$ref(purple.40)"
color.selection.foreground        = "$ref(purple.10)"
color.highlight.background        = "$ref(amber.100)"
color.highlight.background-active = "$ref(amber.300)"
color.highlight.foreground        = "$ref(zinc.950)"


# ─── 颜色 · 反馈 ────────────────────────────────────────────────────────────

color.feedback.error.text = "$ref(material.error.10)"
color.feedback.error.icon = "$ref(material.error.40)"
color.feedback.error.border = "$ref(material.error.40)"
color.feedback.error.background = "$ref(material.error.90)"
color.feedback.error.background-hover = "$ref(material.error.90)"
color.feedback.error.solid = "$ref(material.error.40)"
color.feedback.error.solid-hover = "$ref(material.error.30)"
color.feedback.error.solid-active = "$ref(material.error.20)"
color.feedback.error.on-solid = "$ref(material.error.100)"

color.feedback.success.text             = "$ref(green.800)"
color.feedback.success.icon             = "$ref(green.700)"
color.feedback.success.border           = "$ref(green.700)"
color.feedback.success.background       = "$ref(green.50)"
color.feedback.success.background-hover = "var(--token-semantic-color-feedback-success-background, $ref(green.100))"
color.feedback.success.solid            = "$ref(green.700)"
color.feedback.success.solid-hover      = "$ref(green.800)"
color.feedback.success.solid-active     = "$ref(green.900)"
color.feedback.success.on-solid         = "$ref(white)"

color.feedback.warning.text             = "$ref(amber.900)"
color.feedback.warning.icon             = "$ref(amber.700)"
color.feedback.warning.border           = "$ref(amber.700)"
color.feedback.warning.background       = "$ref(amber.50)"
color.feedback.warning.background-hover = "var(--token-semantic-color-feedback-warning-background, $ref(amber.100))"
color.feedback.warning.solid            = "$ref(amber.700)"
color.feedback.warning.solid-hover      = "$ref(amber.800)"
color.feedback.warning.solid-active     = "$ref(amber.900)"
color.feedback.warning.on-solid         = "$ref(white)"

color.feedback.info.text             = "$ref(blue.800)"
color.feedback.info.icon             = "$ref(blue.600)"
color.feedback.info.border           = "$ref(blue.600)"
color.feedback.info.background       = "$ref(blue.50)"
color.feedback.info.background-hover = "var(--token-semantic-color-feedback-info-background, $ref(blue.100))"
color.feedback.info.solid            = "$ref(blue.600)"
color.feedback.info.solid-hover      = "$ref(blue.700)"
color.feedback.info.solid-active     = "$ref(blue.800)"
color.feedback.info.on-solid         = "$ref(white)"


# ─── 颜色 · 填充 ────────────────────────────────────────────────────────────

color.fill.subtle      = "var(--token-semantic-color-fill-inactive, $ref(zinc.100))"
color.fill.default     = "var(--token-semantic-color-fill-inactive, $ref(zinc.300))"
color.fill.strong      = "var(--token-semantic-color-fill-active, $ref(zinc.700))"
color.fill.translucent = "color-mix(in oklch, var(--token-semantic-color-fill-active, $ref(black)) 8%, transparent)"
color.fill.inactive    = "$ref(zinc.300)"
color.fill.active      = "$ref(purple.40)"

# Independent control roles keep the unselected switch visible in both themes.
color.control.thumb = "$ref(white)"
color.control.toggle-thumb = "$ref(material.neutral-variant.50)"
color.control.track = "$ref(zinc.500)"
color.control.track-hover = "$ref(zinc.600)"


# ─── 间距 · 语义 ────────────────────────────────────────────────────────────
# 将 Layer 1 原始刻度映射到 UI 布局语义

space.inline-gap        = "$ref(space.1)"
space.component-gap     = "$ref(space.2)"
space.stack-gap         = "$ref(space.3)"
space.section-gap       = "$ref(space.4)"
space.group-gap         = "$ref(space.6)"
space.page-padding      = "$ref(space.4)"
space.control-padding-x = "$ref(space.3)"
space.control-padding-x-small = "$ref(space.2)"
space.control-padding-y = "$ref(space.1-5)"
space.card-padding      = "$ref(space.4)"
space.dialog-padding    = "$ref(space.5)"


# ─── 排版 · 语义 ─────────────────────────────────────────────────────────
# 将 Layer 1 字号 / 字重映射到 UI 排版语义

font.family.body = "$ref(font.family.material)"
font.line-height.body = "$ref(line.height.normal)"
font.size.body = "$ref(font.size.sm)"
font.size.heading = "$ref(font.size.22)"
font.size.subhead   = "$ref(font.size.md)"
font.size.caption   = "$ref(font.size.xs)"
font.weight.body    = "$ref(font.weight.regular)"
font.weight.label   = "$ref(font.weight.medium)"
font.weight.heading = "$ref(font.weight.regular)"
font.weight.strong  = "$ref(font.weight.bold)"


# ─── 圆角 · 语义 ────────────────────────────────────────────────────────────

radius.sm = "$ref(radius.2)"
radius.md = "$ref(radius.2)"
radius.lg = "$ref(radius.6)"
radius.xl = "$ref(radius.14)"
radius.pill    = "$ref(radius.full)"

# Material defaults; the shadcn design overrides shared shapes in rc-theme.
shape.control = "$ref(radius.2)"
shape.card = "$ref(radius.6)"
shape.overlay = "$ref(radius.14)"
size.touch-target = "$ref(size.48)"
size.selection-target = "$ref(size.48)"

# Purpose-based typography. Existing font.* overrides are respected by every role.
typography.display.font-family = "$ref(font.family.material)"
typography.display.font-size = "$ref(font.size.36)"
typography.display.font-weight = "$ref(font.weight.regular)"
typography.display.line-height = "$ref(line.height.36-44)"
typography.headline.font-family = "$ref(font.family.material)"
typography.headline.font-size = "$ref(font.size.3xl)"
typography.headline.font-weight = "$ref(font.weight.regular)"
typography.headline.line-height = "$ref(line.height.28-36)"
typography.title.font-family = "$ref(font.family.material)"
typography.title.font-size = "$ref(font.size.22)"
typography.title.font-weight = "$ref(font.weight.regular)"
typography.title.line-height = "$ref(line.height.22-28)"
typography.body.font-family = "$ref(font.family.material)"
typography.body.font-size = "$ref(font.size.sm)"
typography.body.font-weight = "$ref(font.weight.regular)"
typography.body.line-height = "$ref(line.height.14-20)"
typography.label.font-family = "$ref(font.family.material)"
typography.label.font-size = "$ref(font.size.sm)"
typography.label.font-weight = "$ref(font.weight.medium)"
typography.label.line-height = "$ref(line.height.14-20)"
typography.caption.font-family = "$ref(font.family.material)"
typography.caption.font-size = "$ref(font.size.xs)"
typography.caption.font-weight = "$ref(font.weight.regular)"
typography.caption.line-height = "$ref(line.height.12-16)"


# ─── 阴影 · 语义 ────────────────────────────────────────────────────────────

shadow.float = "$ref(shadow.material-2)"
shadow.control = "$ref(shadow.material-1)"
shadow.overlay = "$ref(shadow.material-3)"
shadow.focus-ring = "0 0 0 3px color-mix(in oklch, var(--token-semantic-color-focus-ring, var(--token-semantic-color-border-focus, $ref(purple.40))) 20%, transparent)"


# ─── 层级 · 语义 ────────────────────────────────────────────────────────────
# 按堆叠意图命名，组件到层级的绑定由 Layer 3 完成。
# 层级故事（自下而上）：内容(base) < 页面内吸顶(sticky) < portal 浮层(float)
# < 遮罩(mask) < 阻塞窗体(block) < 提示气泡(elevated) < 警报(alert) < 兜底(top)。
# sticky 必须低于 float：本库浮层一律 portal + fixed，吸顶元素不得盖住浮层。
# （dialog / drawer / message / notification 走原生 top-layer，不消费此刻度。）

z-index.base     = "$ref(z-index.1)"
z-index.sticky   = "$ref(z-index.10)"
z-index.float    = "$ref(z-index.20)"
z-index.mask     = "$ref(z-index.30)"
z-index.block    = "$ref(z-index.40)"
z-index.elevated = "$ref(z-index.50)"
z-index.alert    = "$ref(z-index.60)"
z-index.top      = "$ref(z-index.70)"


# ─── 动效 · 语义 ────────────────────────────────────────────────────────────
# interaction：即时状态反馈（hover / selected / active 的颜色切换），要求"快到近乎即时"
# fade：内容淡入淡出；expand：容器展开收起

# 150 ms for immediate feedback; start promptly and settle without overshoot.
motion.interaction = "$ref(duration.150) $ref(easing.expressive-effects-fast)"
motion.fade = "$ref(duration.normal) $ref(easing.expressive-effects-default)"
motion.expand = "$ref(duration.500) $ref(easing.expressive-spatial-default)"
# Large edge panels ease into motion, then settle; exiting panels accelerate away.
motion.slide-enter = "$ref(duration.500) $ref(easing.expressive-spatial-default)"
motion.slide-exit = "$ref(duration.350) $ref(easing.expressive-spatial-fast)"

# Bounded motion for edge-anchored sheets and layout measurements: no overshoot.
motion.sheet.enter-duration = "$ref(duration.slow)"
motion.sheet.exit-duration = "$ref(duration.normal)"
motion.sheet.easing = "$ref(easing.material)"
motion.layout = "$ref(duration.normal) $ref(easing.out)"


# ─── 透明度 · 语义 ─────────────────────────────────────────────────────────

opacity.disabled   = "$ref(opacity.38)"
opacity.secondary  = "$ref(opacity.50)"
opacity.tertiary   = "$ref(opacity.70)"
opacity.hover      = "$ref(opacity.80)"
shape.none = "0px"
shape.extra-small = "$ref(radius.2)"
shape.small = "$ref(radius.4)"
shape.medium = "$ref(radius.6)"
shape.large = "$ref(radius.8)"
shape.extra-large = "$ref(radius.14)"
shape.full = "$ref(radius.full)"
shape.button = "var(--token-semantic-shape-full, $ref(radius.full))"
shape.button-selected = "var(--token-semantic-shape-medium, $ref(radius.6))"
shape.button-pressed = "var(--token-semantic-shape-small, $ref(radius.4))"
color.border.card = "transparent"
shadow.card = "var(--token-semantic-shadow-control, $ref(shadow.material-1))"
shadow.card-hover = "var(--token-semantic-shadow-float, $ref(shadow.material-2))"
size.36 = "$ref(size.36)"
size.control = "$ref(size.36)"
size.field = "$ref(size.36)"
size.navigation = "$ref(size.36)"
color.surface.lowest = "$ref(material.neutral.100)"
color.surface.low = "$ref(material.neutral.96)"
color.surface.high = "$ref(material.neutral.92)"
color.surface.highest = "$ref(material.neutral.90)"
color.surface.dim = "$ref(material.neutral.87)"
color.surface.bright = "$ref(material.neutral.98)"
color.secondary.primary = "$ref(material.secondary.40)"
color.secondary.on-primary = "$ref(material.secondary.100)"
color.secondary.container = "$ref(material.secondary.90)"
color.secondary.on-container = "$ref(material.secondary.10)"
color.tertiary.primary = "$ref(material.tertiary.40)"
color.tertiary.on-primary = "$ref(material.tertiary.100)"
color.tertiary.container = "$ref(material.tertiary.90)"
color.tertiary.on-container = "$ref(material.tertiary.10)"
typography.display.large.font-family = "$ref(font.family.material)"
typography.display.large.font-size = "$ref(font.size.57)"
typography.display.large.font-weight = "$ref(font.weight.regular)"
typography.display.large.line-height = "$ref(line.height.57-64)"
typography.display.medium.font-family = "$ref(font.family.material)"
typography.display.medium.font-size = "$ref(font.size.45)"
typography.display.medium.font-weight = "$ref(font.weight.regular)"
typography.display.medium.line-height = "$ref(line.height.45-52)"
typography.display.small.font-family = "$ref(font.family.material)"
typography.display.small.font-size = "$ref(font.size.36)"
typography.display.small.font-weight = "$ref(font.weight.regular)"
typography.display.small.line-height = "$ref(line.height.36-44)"
typography.headline.large.font-family = "$ref(font.family.material)"
typography.headline.large.font-size = "$ref(font.size.4xl)"
typography.headline.large.font-weight = "$ref(font.weight.regular)"
typography.headline.large.line-height = "$ref(line.height.32-40)"
typography.headline.medium.font-family = "$ref(font.family.material)"
typography.headline.medium.font-size = "$ref(font.size.3xl)"
typography.headline.medium.font-weight = "$ref(font.weight.regular)"
typography.headline.medium.line-height = "$ref(line.height.28-36)"
typography.headline.small.font-family = "$ref(font.family.material)"
typography.headline.small.font-size = "$ref(font.size.2xl)"
typography.headline.small.font-weight = "$ref(font.weight.regular)"
typography.headline.small.line-height = "$ref(line.height.24-32)"
typography.title.large.font-family = "$ref(font.family.material)"
typography.title.large.font-size = "$ref(font.size.22)"
typography.title.large.font-weight = "$ref(font.weight.regular)"
typography.title.large.line-height = "$ref(line.height.22-28)"
typography.title.medium.font-family = "$ref(font.family.material)"
typography.title.medium.font-size = "$ref(font.size.md)"
typography.title.medium.font-weight = "$ref(font.weight.medium)"
typography.title.medium.line-height = "$ref(line.height.16-24)"
typography.title.small.font-family = "$ref(font.family.material)"
typography.title.small.font-size = "$ref(font.size.sm)"
typography.title.small.font-weight = "$ref(font.weight.medium)"
typography.title.small.line-height = "$ref(line.height.14-20)"
typography.body.large.font-family = "$ref(font.family.material)"
typography.body.large.font-size = "$ref(font.size.md)"
typography.body.large.font-weight = "$ref(font.weight.regular)"
typography.body.large.line-height = "$ref(line.height.16-24)"
typography.body.medium.font-family = "$ref(font.family.material)"
typography.body.medium.font-size = "$ref(font.size.sm)"
typography.body.medium.font-weight = "$ref(font.weight.regular)"
typography.body.medium.line-height = "$ref(line.height.14-20)"
typography.body.small.font-family = "$ref(font.family.material)"
typography.body.small.font-size = "$ref(font.size.xs)"
typography.body.small.font-weight = "$ref(font.weight.regular)"
typography.body.small.line-height = "$ref(line.height.12-16)"
typography.label.large.font-family = "$ref(font.family.material)"
typography.label.large.font-size = "$ref(font.size.sm)"
typography.label.large.font-weight = "$ref(font.weight.medium)"
typography.label.large.line-height = "$ref(line.height.14-20)"
typography.label.medium.font-family = "$ref(font.family.material)"
typography.label.medium.font-size = "$ref(font.size.xs)"
typography.label.medium.font-weight = "$ref(font.weight.medium)"
typography.label.medium.line-height = "$ref(line.height.12-16)"
typography.label.small.font-family = "$ref(font.family.material)"
typography.label.small.font-size = "$ref(font.size.11)"
typography.label.small.font-weight = "$ref(font.weight.medium)"
typography.label.small.line-height = "$ref(line.height.11-16)"
size.32 = "$ref(size.32)"
size.40 = "$ref(size.40)"
size.48 = "$ref(size.48)"
size.56 = "$ref(size.56)"
size.64 = "$ref(size.64)"

# Expressive roles. Geometry uses spatial; color and opacity use effects.
motion.easing.spatial.default = "$ref(easing.expressive-spatial-default)"
motion.spatial.fast = "$ref(duration.350) $ref(easing.expressive-spatial-fast)"
motion.effects.fast = "$ref(duration.150) $ref(easing.expressive-effects-fast)"
motion.spatial.default = "$ref(duration.500) $ref(easing.expressive-spatial-default)"
motion.effects.default = "$ref(duration.normal) $ref(easing.expressive-effects-default)"
motion.spatial.slow = "$ref(duration.650) $ref(easing.expressive-spatial-slow)"
motion.effects.slow = "$ref(duration.slow) $ref(easing.expressive-effects-slow)"
typography.display.large.emphasized.font-family = "$ref(font.family.material)"
typography.display.large.emphasized.font-size = "$ref(font.size.57)"
typography.display.large.emphasized.font-weight = "$ref(font.weight.medium)"
typography.display.large.emphasized.line-height = "$ref(line.height.57-64)"
typography.display.medium.emphasized.font-family = "$ref(font.family.material)"
typography.display.medium.emphasized.font-size = "$ref(font.size.45)"
typography.display.medium.emphasized.font-weight = "$ref(font.weight.medium)"
typography.display.medium.emphasized.line-height = "$ref(line.height.45-52)"
typography.display.small.emphasized.font-family = "$ref(font.family.material)"
typography.display.small.emphasized.font-size = "$ref(font.size.36)"
typography.display.small.emphasized.font-weight = "$ref(font.weight.medium)"
typography.display.small.emphasized.line-height = "$ref(line.height.36-44)"
typography.headline.large.emphasized.font-family = "$ref(font.family.material)"
typography.headline.large.emphasized.font-size = "$ref(font.size.4xl)"
typography.headline.large.emphasized.font-weight = "$ref(font.weight.medium)"
typography.headline.large.emphasized.line-height = "$ref(line.height.32-40)"
typography.headline.medium.emphasized.font-family = "$ref(font.family.material)"
typography.headline.medium.emphasized.font-size = "$ref(font.size.3xl)"
typography.headline.medium.emphasized.font-weight = "$ref(font.weight.medium)"
typography.headline.medium.emphasized.line-height = "$ref(line.height.28-36)"
typography.headline.small.emphasized.font-family = "$ref(font.family.material)"
typography.headline.small.emphasized.font-size = "$ref(font.size.2xl)"
typography.headline.small.emphasized.font-weight = "$ref(font.weight.medium)"
typography.headline.small.emphasized.line-height = "$ref(line.height.24-32)"
typography.title.large.emphasized.font-family = "$ref(font.family.material)"
