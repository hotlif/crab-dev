[build]
output = "./src/token.ts"
prefix = "token-semantic"
imports = ["@crab-dev/rc-token-global"]

[token]

# ═══════════════════════════════════════════════════════════════════════════════
#  🦀 Crab Design System — Semantic Tokens (Layer 2)
#
#  ┌─────────────────────────────────────────────────────────────────────────┐
#  │  职责：将 Layer 1 原始刻度赋予设计意图                                    │
#  │                                                                         │
#  │  • 本层定义"用途"，不定义"值"——所有值通过 $ref() 引用 Layer 1             │
#  │  • Light / Dark 主题切换只需在本层重新绑定                                │
#  │  • 组件不应直接引用 Layer 1，而应引用本层语义变量                           │
#  │  • 命名公式：{category}.{intent}[-{state}]                               │
#  └─────────────────────────────────────────────────────────────────────────┘
#
#  以下为 Light 主题默认值。Dark 主题通过覆写本层 CSS 变量实现。
#  参见 RFC-DESIGN-TOKEN-20260329 §4.1
# ═══════════════════════════════════════════════════════════════════════════════


# ─── 颜色 · 品牌 / 主色 ─────────────────────────────────────────────────────
# Crab 默认紫色品牌；中性表面继续使用 Zinc。明暗配对见 theme.ts。

color.brand.primary        = "$ref(purple.40)"
color.brand.primary-hover  = "$ref(purple.30)"
color.brand.primary-active = "$ref(purple.20)"
color.brand.primary-subtle = "$ref(purple.40)"


# ─── 颜色 · 背景 ────────────────────────────────────────────────────────────

color.background.surface       = "$ref(white)"
color.background.elevated      = "$ref(white)"
color.background.sunken        = "$ref(zinc.50)"
color.background.inverse       = "$ref(zinc.950)"
color.background.overlay       = "color-mix(in oklch, $ref(black) 45%, transparent)"
color.background.disabled      = "$ref(zinc.100)"
color.background.hover-subtle  = "$ref(zinc.100)"
color.background.active-subtle = "$ref(zinc.200)"
color.background.selected      = "$ref(purple.90)"


# ─── 颜色 · 文本 ────────────────────────────────────────────────────────────

color.text.primary     = "$ref(zinc.950)"
color.text.secondary   = "$ref(zinc.700)"
color.text.tertiary    = "$ref(zinc.600)"
color.text.on-brand    = "$ref(white)"
color.text.inverse     = "$ref(zinc.50)"
color.text.disabled    = "$ref(zinc.500)"
color.text.link        = "$ref(purple.40)"
color.text.link-hover  = "$ref(purple.30)"


# ─── 颜色 · 边框 ────────────────────────────────────────────────────────────

color.border.subtle   = "$ref(zinc.200)"
color.border.default  = "$ref(zinc.600)"
color.border.hover    = "$ref(zinc.700)"
color.border.strong   = "var(--token-semantic-color-border-hover, $ref(zinc.700))"
color.border.focus    = "$ref(purple.40)"
color.border.error    = "$ref(red.600)"


# ─── 颜色 · 焦点 / 选区 / 高亮 ───────────────────────────────────────────────

color.focus.ring                  = "var(--token-semantic-color-border-focus, $ref(purple.40))"
color.selection.background        = "$ref(purple.90)"
color.selection.border            = "$ref(purple.40)"
color.selection.foreground        = "$ref(purple.10)"
color.highlight.background        = "$ref(amber.100)"
color.highlight.background-active = "$ref(amber.300)"
color.highlight.foreground        = "$ref(zinc.950)"


# ─── 颜色 · 反馈 ────────────────────────────────────────────────────────────

color.feedback.error.text             = "var(--token-semantic-color-feedback-error, $ref(red.800))"
color.feedback.error.icon             = "var(--token-semantic-color-feedback-error, $ref(red.600))"
color.feedback.error.border           = "var(--token-semantic-color-feedback-error, $ref(red.600))"
color.feedback.error.background       = "$ref(red.50)"
color.feedback.error.background-hover = "var(--token-semantic-color-feedback-error-background, $ref(red.100))"
color.feedback.error.solid            = "var(--token-semantic-color-feedback-error, $ref(red.600))"
color.feedback.error.solid-hover      = "$ref(red.700)"
color.feedback.error.solid-active     = "$ref(red.800)"
color.feedback.error.on-solid         = "$ref(white)"

color.feedback.success.text             = "var(--token-semantic-color-feedback-success, $ref(green.800))"
color.feedback.success.icon             = "var(--token-semantic-color-feedback-success, $ref(green.700))"
color.feedback.success.border           = "var(--token-semantic-color-feedback-success, $ref(green.700))"
color.feedback.success.background       = "$ref(green.50)"
color.feedback.success.background-hover = "var(--token-semantic-color-feedback-success-background, $ref(green.100))"
color.feedback.success.solid            = "var(--token-semantic-color-feedback-success, $ref(green.700))"
color.feedback.success.solid-hover      = "$ref(green.800)"
color.feedback.success.solid-active     = "$ref(green.900)"
color.feedback.success.on-solid         = "$ref(white)"

color.feedback.warning.text             = "var(--token-semantic-color-feedback-warning, $ref(amber.900))"
color.feedback.warning.icon             = "var(--token-semantic-color-feedback-warning, $ref(amber.700))"
color.feedback.warning.border           = "var(--token-semantic-color-feedback-warning, $ref(amber.700))"
color.feedback.warning.background       = "$ref(amber.50)"
color.feedback.warning.background-hover = "var(--token-semantic-color-feedback-warning-background, $ref(amber.100))"
color.feedback.warning.solid            = "var(--token-semantic-color-feedback-warning, $ref(amber.700))"
color.feedback.warning.solid-hover      = "$ref(amber.800)"
color.feedback.warning.solid-active     = "$ref(amber.900)"
color.feedback.warning.on-solid         = "$ref(white)"

color.feedback.info.text             = "var(--token-semantic-color-feedback-info, $ref(blue.800))"
color.feedback.info.icon             = "var(--token-semantic-color-feedback-info, $ref(blue.600))"
color.feedback.info.border           = "var(--token-semantic-color-feedback-info, $ref(blue.600))"
color.feedback.info.background       = "$ref(blue.50)"
color.feedback.info.background-hover = "var(--token-semantic-color-feedback-info-background, $ref(blue.100))"
color.feedback.info.solid            = "var(--token-semantic-color-feedback-info, $ref(blue.600))"
color.feedback.info.solid-hover      = "$ref(blue.700)"
color.feedback.info.solid-active     = "$ref(blue.800)"
color.feedback.info.on-solid         = "$ref(white)"


# ─── 颜色 · 填充 ────────────────────────────────────────────────────────────

color.fill.subtle      = "var(--token-semantic-color-fill-inactive, $ref(zinc.100))"
color.fill.default     = "var(--token-semantic-color-fill-inactive, $ref(zinc.300))"
color.fill.strong      = "var(--token-semantic-color-fill-active, $ref(zinc.700))"
color.fill.translucent = "color-mix(in oklch, var(--token-semantic-color-fill-active, $ref(black)) 8%, transparent)"
color.fill.inactive    = "$ref(zinc.300)"
color.fill.active      = "$ref(purple.40)"

# Independent control roles keep the unselected switch visible in both themes.
color.control.thumb = "$ref(white)"
color.control.track = "$ref(zinc.500)"
color.control.track-hover = "$ref(zinc.600)"


# ─── 间距 · 语义 ────────────────────────────────────────────────────────────
# 将 Layer 1 原始刻度映射到 UI 布局语义

space.inline-gap        = "$ref(space.1)"
space.component-gap     = "$ref(space.2)"
space.stack-gap         = "$ref(space.3)"
space.section-gap       = "$ref(space.4)"
space.group-gap         = "$ref(space.6)"
space.page-padding      = "$ref(space.6)"
space.control-padding-x = "$ref(space.3)"
space.control-padding-x-small = "$ref(space.2)"
space.control-padding-y = "$ref(space.1-5)"
space.card-padding      = "$ref(space.5)"
space.dialog-padding    = "$ref(space.6)"


# ─── 排版 · 语义 ─────────────────────────────────────────────────────────
# 将 Layer 1 字号 / 字重映射到 UI 排版语义

font.family.body    = "$ref(font.family.sans)"
font.line-height.body = "$ref(line.height.normal)"
font.size.body      = "$ref(font.size.sm)"
font.size.heading   = "$ref(font.size.lg)"
font.size.subhead   = "$ref(font.size.md)"
font.size.caption   = "$ref(font.size.xs)"
font.weight.body    = "$ref(font.weight.regular)"
font.weight.label   = "$ref(font.weight.medium)"
font.weight.heading = "$ref(font.weight.semibold)"
font.weight.strong  = "$ref(font.weight.bold)"


# ─── 圆角 · 语义 ────────────────────────────────────────────────────────────

radius.sm      = "$ref(radius.1)"
radius.md      = "$ref(radius.3)"
radius.lg      = "$ref(radius.4)"
radius.xl      = "$ref(radius.6)"
radius.pill    = "$ref(radius.full)"


# ─── 阴影 · 语义 ────────────────────────────────────────────────────────────

shadow.float      = "$ref(shadow.md)"
shadow.overlay    = "$ref(shadow.lg)"
shadow.focus-ring = "0 0 0 3px color-mix(in oklch, var(--token-semantic-color-focus-ring, var(--token-semantic-color-border-focus, $ref(purple.40))) 20%, transparent)"


# ─── 层级 · 语义 ────────────────────────────────────────────────────────────
# 按堆叠意图命名，组件到层级的绑定由 Layer 3 完成。
# 层级故事（自下而上）：内容(base) < 页面内吸顶(sticky) < portal 浮层(float)
# < 遮罩(mask) < 阻塞窗体(block) < 提示气泡(elevated) < 警报(alert) < 兜底(top)。
# sticky 必须低于 float：本库浮层一律 portal + fixed，吸顶元素不得盖住浮层。
# （dialog / drawer / message / notification 走原生 top-layer，不消费此刻度。）

z-index.base     = "$ref(z-index.1)"
z-index.sticky   = "$ref(z-index.10)"
z-index.float    = "$ref(z-index.20)"
z-index.mask     = "$ref(z-index.30)"
z-index.block    = "$ref(z-index.40)"
z-index.elevated = "$ref(z-index.50)"
z-index.alert    = "$ref(z-index.60)"
z-index.top      = "$ref(z-index.70)"


# ─── 动效 · 语义 ────────────────────────────────────────────────────────────
# interaction：即时状态反馈（hover / selected / active 的颜色切换），要求"快到近乎即时"
# fade：内容淡入淡出；expand：容器展开收起

# 150 ms for immediate feedback; start promptly and settle without overshoot.
motion.interaction = "calc(($ref(duration.fast) + $ref(duration.normal)) / 2) $ref(easing.out)"
motion.fade        = "$ref(duration.normal) $ref(easing.out)"
motion.expand      = "$ref(duration.slow) $ref(easing.out)"
# Large edge panels ease into motion, then settle; exiting panels accelerate away.
motion.slide-enter = "$ref(duration.slow) $ref(easing.default)"
motion.slide-exit  = "$ref(duration.normal) $ref(easing.in)"


# ─── 透明度 · 语义 ─────────────────────────────────────────────────────────

opacity.disabled   = "$ref(opacity.30)"
opacity.secondary  = "$ref(opacity.50)"
opacity.tertiary   = "$ref(opacity.70)"
opacity.hover      = "$ref(opacity.80)"
