# This layout-only regression requires test:browser to build published ESM/CSS.
[test]
environment = "browser"
include = ["table.test.tsx", "row-edit-actions.test.tsx", "contained-focus.test.tsx"]
timeout_ms = 15000
leaks = "error"

[test.react]
strict_mode = false
cleanup = true
act_warnings = "error"

[test.network]
mode = "deny"
allow_hosts = []

[test.coverage]
enabled = true
reporters = ["text", "lcov"]
