[build]
output  = "./src/token.ts"
prefix  = "table"
imports = ["@crab-dev/rc-token-semantic"]

[token]
motion.rows.transition = "$ref(motion.layout)"

# ─── 边框 ────────────────────────────────────────────────────────────────────
root.border-color = "color-mix(in oklch, $ref(color.border.default) 30%, $ref(color.surface.content))"
root.font-family = "$ref(typography.body.font-family)"
root.font-size = "$ref(typography.body.medium.font-size)"
root.line-height = "$ref(typography.body.medium.line-height)"
root.color = "$ref(color.text.primary)"
root.outline-color-focus = "$ref(color.focus.ring)"
root.outline-width-focus = "2px"
root.outline-offset-focus = "2px"

# ─── 单元格 ──────────────────────────────────────────────────────────────────
cell.background-color = "$ref(color.surface.content)"
cell.padding-inline = "$ref(density.cell-padding)"
cell.border-color = "color-mix(in oklch, $ref(color.border.default) 22%, $ref(color.surface.content))"
cell.separator.border-color = "color-mix(in oklch, $ref(color.border.default) 12%, $ref(color.surface.content))"

# ─── 表头 / 过滤栏 ───────────────────────────────────────────────────────────
header.background-color = "$ref(color.surface.container)"
header.color = "$ref(color.text.secondary)"
header.font-weight = "$ref(typography.title.font-weight)"
header.gap = "$ref(space.inline-gap)"
filter-cell.padding = "2px"

# ─── 拖拽调整列宽手柄 ────────────────────────────────────────────────────────
resize-handle.width = "8px"
resize-handle.indicator.width = "2px"
resize-handle.color = "$ref(color.focus.ring)"

# 固定列边缘与常驻滚动条：滚动方向不再依赖 hover 才可发现。
fixed-edge.width = "$ref(space.component-gap)"
fixed-edge.color = "color-mix(in oklch, $ref(color.text.primary) 10%, transparent)"
scrollbar.opacity = "1"

# ─── 分组行 ──────────────────────────────────────────────────────────────────
group.background-color   = "$ref(color.background.hover-subtle)"
group.color              = "$ref(color.text.primary)"
group.count.color        = "$ref(color.text.secondary)"
group.chevron.color      = "$ref(color.text.secondary)"
group.gap                = "$ref(space.component-gap)"
group.padding-inline = "$ref(density.cell-padding)"
group.text.gap           = "6px"
group.font-weight        = "$ref(typography.label.font-weight)"
group.count.font-size    = "$ref(typography.caption.font-size)"
group.chevron.width = "14px"
group.chevron.transition = "transform $ref(motion.spatial.fast)"

# ─── 选区 ────────────────────────────────────────────────────────────────────
selection.border-color   = "$ref(color.selection.border)"
selection.background-color = "color-mix(in oklch, $ref(color.selection.border) 10%, $ref(color.surface.content))"
selection.border-width   = "2px"
selection.outline-offset = "-2px"

# ─── 关键字高亮 ──────────────────────────────────────────────────────────────
highlight.background-color = "$ref(color.highlight.background)"
highlight.color = "$ref(color.highlight.foreground)"
highlight.background-color-active = "$ref(color.highlight.background-active)"
highlight.color-active = "$ref(color.highlight.foreground)"
highlight.border-radius = "$ref(radius.sm)"

# ─── 编辑标记 ────────────────────────────────────────────────────────────────
edited-indicator.color = "$ref(color.feedback.warning.icon)"
edited-indicator.border-width = "6px"

# ─── 树形数据 ─────────────────────────────────────────────────────────────────
tree.indent.width = "20px"
tree.chevron.width = "16px"
tree.chevron.color      = "$ref(color.text.secondary)"
tree.chevron.transition = "transform $ref(motion.spatial.fast)"
tree.button.border-radius = "$ref(radius.sm)"
tree.button.gap         = "4px"
tree.button.width = "24px"
tree.button.background-color-hover = "$ref(color.state.hover)"
tree.button.transition = "$ref(motion.interaction)"

# ─── 行编辑（editType="row"） ─────────────────────────────────────────────────
# 编辑行呈现为浮起卡片：中性提亮底 + 焦点蓝描边 + 柔和投影；
# 确认 / 取消以独立浮条贴行尾下方，避免遮挡相邻行内容
row-edit.row.background-color = "$ref(color.background.hover-subtle)"
row-edit.cell.background-color = "$ref(color.surface.content)"
row-edit.border-color       = "$ref(color.brand.primary)"
row-edit.outline-color      = "$ref(color.brand.primary)"
row-edit.card.box-shadow    = "$ref(shadow.overlay)"
row-edit.card.border-radius = "$ref(shape.card)"
row-edit.transition         = "$ref(motion.interaction)"
row-edit.actions.background-color = "$ref(color.surface.raised)"
row-edit.actions.border-color = "$ref(color.brand.primary)"
row-edit.actions.border-radius = "$ref(shape.card)"
row-edit.actions.box-shadow = "$ref(shadow.overlay)"
row-edit.actions.padding = "$ref(space.inline-gap)"
row-edit.actions.gap = "$ref(space.inline-gap)"
row-edit.confirm.background-color = "$ref(color.brand.primary)"
row-edit.confirm.color = "$ref(color.text.on-brand)"
row-edit.confirm.background-color-hover = "$ref(color.brand.primary-hover)"
row-edit.confirm.background-color-active = "$ref(color.brand.primary-active)"
row-edit.cancel.color = "$ref(color.text.secondary)"
row-edit.cancel.background-color-hover = "$ref(color.state.hover)"
row-edit.cancel.border-color = "$ref(color.border.default)"
row-edit.button.height = "$ref(size.control)"
row-edit.button.padding-inline = "$ref(space.control-padding-x)"
row-edit.button.border-radius = "$ref(shape.full)"
row-edit.button.font-size = "$ref(typography.body.font-size)"
row-edit.button.font-weight = "$ref(typography.label.font-weight)"
row-edit.button.gap = "$ref(space.inline-gap)"

# ─── 列拖拽排序 ───────────────────────────────────────────────────────────────
column-drag.indicator.background-color = "$ref(color.brand.primary)"
column-drag.indicator.width = "2px"
column-drag.opacity-dragging = "0.45"

# ─── 列排序 ───────────────────────────────────────────────────────────────────
sort.icon.color = "$ref(color.text.tertiary)"
sort.icon.color-active = "$ref(color.brand.primary)"
sort.header.cursor = "pointer"
sort.badge.color = "$ref(color.brand.primary)"
sort.badge.font-size = "11px"

# ─── 行选中 ───────────────────────────────────────────────────────────────────
row-selection.control.width = "$ref(size.selection-target)"
row-selection.background-color-selected = "color-mix(in oklch, $ref(color.selection.border) 10%, $ref(color.surface.content))"

# ─── 行点击（提供 onRowClick / onRowDoubleClick 时生效） ───────────────────────
# 行成为可点击目标后必须具备可感知的示能：pointer 光标 + hover 反馈；
# 二者仅在使用方传入行事件时才施加，纯展示的表格不得伪造交互暗示。
#
# row-bg-transition 只给时长与缓动，属性名留在 CSS 里写。
# 它必须同时施加于「行」与「左右固定列」——一行的底色由这几个元素共同呈现，
# 少给任何一处，那一处就会瞬时换色而其余仍在渐变，交界处撕裂、拖尾。
# 用 ease-out（快起慢收）让底色淡入，而非匀速；采用公共 150ms 反馈时长，掠过多行时不留拖影。
row-click.cursor            = "pointer"
row-click.background-color-hover = "$ref(color.state.hover)"
row-click.transition = "$ref(motion.interaction)"

# ─── 底部汇总 / 合计行 ────────────────────────────────────────────────────────
# 背景沿用表头底色（token.header.bg-color），加粗主文本以区别于普通数据行
summary.color          = "$ref(color.text.primary)"
summary.font-weight    = "$ref(font.weight.strong)"
summary.padding-inline = "$ref(density.cell-padding)"

# ─── 行展开（详情面板） ───────────────────────────────────────────────────────
# 展开图标沿用树形 chevron 的尺寸与缓动；展开内容区用微提亮底 + 顶边分隔，区别于普通数据行
expand.chevron.width = "16px"
expand.chevron.color      = "$ref(color.text.secondary)"
expand.chevron.transition = "transform $ref(motion.spatial.fast)"
expand.button.border-radius = "$ref(radius.sm)"
expand.content.background-color = "$ref(color.surface.content)"
expand.content.padding    = "$ref(space.component-gap)"
