[build]
output = "./src/token.ts"
prefix = "button"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

# ─── 通用 ────────────────────────────────────────────────────────────────────

root.transition = "var(--button-transition, transform 100ms cubic-bezier(0.4, 0, 0.2, 1), box-shadow 100ms cubic-bezier(0.4, 0, 0.2, 1), background-color 100ms cubic-bezier(0.4, 0, 0.2, 1))"
root.opacity-loading = "var(--button-opacity-loading, 0.65)"
root.opacity-disabled = "var(--button-opacity-disabled, 0.4)"


# ─── 尺寸 — Large ────────────────────────────────────────────────────────────

size.large.gap           = "$ref(space.component-gap)"
size.large.height        = "40px"
size.large.padding       = "0 $ref(space.control-padding-x)"
size.large.border-radius = "$ref(radius.lg)"
size.large.font-size     = "$ref(font.size.heading)"


# ─── 尺寸 — Middle (默认) ────────────────────────────────────────────────────

size.middle.gap           = "$ref(space.component-gap)"
size.middle.height        = "32px"
size.middle.padding       = "0 $ref(space.control-padding-x)"
size.middle.border-radius = "$ref(radius.md)"
size.middle.font-size     = "$ref(font.size.body)"


# ─── 尺寸 — Small ────────────────────────────────────────────────────────────

size.small.gap           = "$ref(space.inline-gap)"
size.small.height        = "24px"
size.small.padding       = "0 $ref(space.control-padding-y)"
size.small.border-radius = "$ref(radius.md)"
size.small.font-size     = "$ref(font.size.body)"


# ─── Primary — 主按钮 ────────────────────────────────────────────────────────

primary.color                   = "$ref(color.text.on-brand)"
primary.background-color          = "$ref(color.brand.primary)"
primary.background-color-disabled = "$ref(color.background.disabled)"
primary.background-color-hover    = "$ref(color.brand.primary-hover)"
primary.background-color-active   = "$ref(color.brand.primary-active)"
primary.box-shadow               = "none"


# ─── Link — 链接按钮 ─────────────────────────────────────────────────────────

link.color                   = "$ref(color.text.link)"
link.color-hover             = "$ref(color.text.link-hover)"
link.color-active            = "$ref(color.text.link)"
link.background-color          = "transparent"
link.background-color-disabled = "transparent"
link.text-underline-offset = "-4px"
link.text-decoration-color   = "$ref(color.brand.primary)"
link.text-decoration-width   = "2px"


# ─── Text — 文本按钮 ─────────────────────────────────────────────────────────

text.background-color-hover  = "$ref(color.background.hover-subtle)"
text.background-color-active = "$ref(color.background.active-subtle)"


# ─── Dashed — 虚线按钮 ───────────────────────────────────────────────────────

dashed.color                   = "$ref(color.text.primary)"
dashed.color-hover             = "$ref(color.text.primary)"
dashed.color-active            = "$ref(color.text.primary)"
dashed.background-color          = "$ref(color.background.surface)"
dashed.background-color-disabled = "$ref(color.background.disabled)"
dashed.box-shadow              = "none"
dashed.border-width            = "1px"
dashed.border-style            = "dashed"
dashed.border-color            = "$ref(color.border.default)"
dashed.border-color-hover      = "$ref(color.text.primary)"
dashed.border-color-active     = "$ref(color.text.primary)"


# ─── Subtle — 次级按钮 ───────────────────────────────────────────────────────

subtle.color                   = "$ref(color.text.primary)"
subtle.color-hover             = "$ref(color.text.primary)"
subtle.color-active            = "$ref(color.text.primary)"
subtle.background-color          = "$ref(color.background.surface)"
subtle.background-color-disabled = "$ref(color.background.disabled)"
subtle.border-width            = "1px"
subtle.border-style            = "solid"
subtle.border-color            = "$ref(color.border.default)"
subtle.border-color-hover      = "$ref(color.border.hover)"
subtle.border-color-active     = "$ref(color.border.hover)"
subtle.box-shadow              = "none"


# ─── Danger — 危险按钮 ───────────────────────────────────────────────────────

danger.color                      = "$ref(color.feedback.error.on-solid)"
danger.background-color           = "$ref(color.feedback.error.solid)"
danger.background-color-disabled  = "$ref(color.background.disabled)"
danger.background-color-hover     = "$ref(color.feedback.error.solid-hover)"
danger.background-color-active    = "$ref(color.feedback.error.solid-active)"
danger.box-shadow                 = "none"


# ─── Selected — 选中状态覆盖 ─────────────────────────────────────────────────

root.background-color-selected = "var(--button-background-color-selected, var(--button-selected-background-color, $ref(color.brand.primary)))"
root.color-selected = "var(--button-color-selected, var(--button-selected-color, $ref(color.text.on-brand)))"
root.border-color-selected = "var(--button-border-color-selected, var(--button-selected-border-color, $ref(color.brand.primary)))"


# ─── Shape — 形状变体 ────────────────────────────────────────────────────────

shape.circle.border-radius = "9999px"
shape.circle.padding       = "0"
