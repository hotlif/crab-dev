[build]
output = "./src/token.ts"
prefix = "button"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]
root.outline-color-focus = "$ref(color.secondary.primary)"
root.outline-width-focus = "3px"
root.outline-offset-focus = "2px"
# Crab independent touch targets; visual size props remain unchanged.
root.touch.min-width = "$ref(size.touch-target)"
root.touch.min-height = "$ref(size.touch-target)"
root.line-height = "$ref(typography.label.line-height)"
root.font-family = "$ref(typography.label.font-family)"
root.font-weight = "$ref(typography.label.font-weight)"

tonal.color = "$ref(color.secondary.on-container)"
tonal.background-color = "$ref(color.secondary.container)"
outlined.color = "var(--button-subtle-color, $ref(color.text.secondary))"
outlined.background-color = "var(--button-subtle-background-color, $ref(navigation.button.outlined-background))"
outlined.border-color = "var(--button-subtle-border-color, $ref(color.border.subtle))"
state-layer.opacity-hover = "$ref(state.opacity.hover)"
# Current M3 Expressive button tokens use 10%, unlike the baseline 12% state roles.
state-layer.opacity-focus = "0.1"
state-layer.opacity-active = "0.1"
state-layer.transition = "opacity $ref(motion.interaction)"

# ─── 通用 ────────────────────────────────────────────────────────────────────

root.transition = "border-radius $ref(motion.spatial.fast), background-color $ref(motion.interaction), border-color $ref(motion.interaction), color $ref(motion.interaction), opacity $ref(motion.interaction), box-shadow $ref(motion.interaction)"
link.transition = "transform $ref(motion.spatial.fast)"
root.opacity-loading = "1"
root.border-width = "1px"
root.opacity-disabled = "$ref(opacity.disabled)"
root.color-disabled = "$ref(color.text.primary)"
root.background-color-disabled = "color-mix(in srgb, $ref(color.text.primary) 10%, transparent)"


# ─── 尺寸 — Large ────────────────────────────────────────────────────────────

size.large.gap = "$ref(action.button.m.gap)"
size.large.height = "$ref(action.button.m.height)"
size.large.padding = "0 $ref(action.button.m.padding-inline)"
size.large.border-radius = "calc($ref(sizing.large.control) / 2)"
size.large.font-size = "$ref(action.button.m.font-size)"


# ─── 尺寸 — Middle (默认) ────────────────────────────────────────────────────

size.medium.gap = "$ref(action.button.s.gap)"
size.medium.height = "$ref(action.button.s.height)"
size.medium.padding = "0 $ref(action.button.s.padding-inline)"
size.medium.border-radius = "calc($ref(sizing.medium.control) / 2)"
size.medium.font-size = "$ref(action.button.s.font-size)"


# ─── 尺寸 — Small ────────────────────────────────────────────────────────────

size.small.gap = "$ref(action.button.xs.gap)"
size.small.height = "$ref(action.button.xs.height)"
size.small.padding = "0 $ref(action.button.xs.padding-inline)"
size.small.border-radius = "calc($ref(sizing.small.control) / 2)"
size.small.font-size = "$ref(action.button.xs.font-size)"


# ─── Primary — 主按钮 ────────────────────────────────────────────────────────

primary.color                   = "$ref(color.text.on-brand)"
primary.background-color          = "$ref(color.brand.primary)"
primary.background-color-disabled = "color-mix(in srgb, $ref(color.text.primary) 10%, transparent)"
primary.background-color-hover = "color-mix(in srgb, $ref(color.text.on-brand) calc($ref(state.opacity.hover) * 100%), $ref(color.brand.primary))"
primary.background-color-active = "color-mix(in srgb, $ref(color.text.on-brand) calc(var(--button-state-layer-opacity-active, 0.1) * 100%), $ref(color.brand.primary))"
primary.background-color-focus = "color-mix(in srgb, $ref(color.text.on-brand) calc(var(--button-state-layer-opacity-focus, 0.1) * 100%), $ref(color.brand.primary))"
primary.box-shadow = "$ref(navigation.button.primary-shadow)"

# Elevated — surface-container-low, primary label, level 1 / hover level 2.
elevated.color = "$ref(color.brand.primary)"
elevated.background-color = "$ref(color.surface.low)"
elevated.background-color-hover = "color-mix(in srgb, $ref(color.brand.primary) calc($ref(state.opacity.hover) * 100%), $ref(color.surface.low))"
elevated.background-color-focus = "color-mix(in srgb, $ref(color.brand.primary) calc(var(--button-state-layer-opacity-focus, 0.1) * 100%), $ref(color.surface.low))"
elevated.background-color-active = "color-mix(in srgb, $ref(color.brand.primary) calc(var(--button-state-layer-opacity-active, 0.1) * 100%), $ref(color.surface.low))"
elevated.box-shadow = "$ref(shadow.control)"
elevated.box-shadow-hover = "$ref(shadow.float)"
elevated.color-disabled = "$ref(color.text.primary)"
elevated.background-color-disabled = "color-mix(in srgb, $ref(color.text.primary) 10%, transparent)"


# ─── Link — 链接按钮 ─────────────────────────────────────────────────────────

link.color                   = "$ref(color.text.link)"
link.color-hover             = "$ref(color.text.link-hover)"
link.color-active            = "$ref(color.text.link)"
link.background-color          = "transparent"
link.background-color-disabled = "transparent"
link.text-underline-offset = "-4px"
link.text-decoration-color   = "$ref(color.brand.primary)"
link.text-decoration-width   = "2px"


# ─── Text — 文本按钮 ─────────────────────────────────────────────────────────

text.color = "$ref(color.brand.primary)"
text.background-color-hover = "color-mix(in srgb, $ref(color.brand.primary) calc($ref(state.opacity.hover) * 100%), transparent)"
text.background-color-active = "color-mix(in srgb, $ref(color.brand.primary) calc(var(--button-state-layer-opacity-active, 0.1) * 100%), transparent)"


# ─── Dashed — 虚线按钮 ───────────────────────────────────────────────────────

dashed.color                   = "$ref(color.text.primary)"
dashed.color-hover             = "$ref(color.text.primary)"
dashed.color-active            = "$ref(color.text.primary)"
dashed.background-color          = "$ref(color.surface.content)"
dashed.background-color-disabled = "$ref(color.background.disabled)"
dashed.box-shadow              = "none"
dashed.border-width            = "1px"
dashed.border-style            = "dashed"
dashed.border-color            = "$ref(color.border.default)"
dashed.border-color-hover      = "$ref(color.text.primary)"
dashed.border-color-active     = "$ref(color.text.primary)"


# ─── Subtle — legacy outlined token overrides ───────────────────────────────

subtle.color = "$ref(color.text.secondary)"
subtle.color-hover = "$ref(color.text.secondary)"
subtle.color-active = "$ref(color.text.secondary)"
subtle.color-disabled          = "$ref(color.text.primary)"
subtle.background-color = "transparent"
subtle.background-color-hover = "color-mix(in srgb, $ref(color.text.secondary) calc($ref(state.opacity.hover) * 100%), transparent)"
subtle.background-color-active = "color-mix(in srgb, $ref(color.text.secondary) calc(var(--button-state-layer-opacity-active, 0.1) * 100%), transparent)"
subtle.background-color-disabled = "transparent"
subtle.border-width            = "1px"
subtle.border-style            = "solid"
subtle.border-color = "$ref(color.border.subtle)"
subtle.border-color-hover = "$ref(color.border.subtle)"
subtle.border-color-active = "$ref(color.border.subtle)"
subtle.border-color-disabled = "$ref(color.border.subtle)"
subtle.box-shadow = "$ref(navigation.button.outlined-shadow)"
subtle.box-shadow-hover = "none"
subtle.box-shadow-active = "none"
subtle.box-shadow-disabled = "none"
subtle.box-shadow-selected = "none"


# ─── Danger — 危险按钮 ───────────────────────────────────────────────────────

danger.color                      = "$ref(color.feedback.error.on-solid)"
danger.background-color           = "$ref(color.feedback.error.solid)"
danger.background-color-disabled  = "color-mix(in srgb, $ref(color.text.primary) 10%, transparent)"
danger.background-color-hover = "color-mix(in srgb, $ref(color.feedback.error.on-solid) calc($ref(state.opacity.hover) * 100%), $ref(color.feedback.error.solid))"
danger.background-color-focus = "color-mix(in srgb, $ref(color.feedback.error.on-solid) 10%, $ref(color.feedback.error.solid))"
danger.background-color-active = "color-mix(in srgb, $ref(color.feedback.error.on-solid) 10%, $ref(color.feedback.error.solid))"
danger.box-shadow                 = "none"
danger.content.color = "$ref(color.feedback.error.border)"
danger.content.background-color-hover = "color-mix(in srgb, $ref(color.feedback.error.border) calc($ref(state.opacity.hover) * 100%), transparent)"
danger.content.background-color-active = "color-mix(in srgb, $ref(color.feedback.error.border) calc(var(--button-state-layer-opacity-active, 0.1) * 100%), transparent)"
danger.subtle.background-color = "transparent"
danger.subtle.background-color-hover = "color-mix(in srgb, $ref(color.feedback.error.border) calc($ref(state.opacity.hover) * 100%), transparent)"
danger.subtle.background-color-active = "color-mix(in srgb, $ref(color.feedback.error.border) calc(var(--button-state-layer-opacity-active, 0.1) * 100%), transparent)"


# ─── Selected — 选中状态覆盖 ─────────────────────────────────────────────────

root.background-color-selected = "$ref(color.brand.primary)"
root.color-selected = "$ref(color.text.on-brand)"
root.border-color-selected = "$ref(color.brand.primary)"


# ─── Shape — 形状变体 ────────────────────────────────────────────────────────

shape.circle.border-radius = "9999px"
shape.circle.padding       = "0"
shape.default.border-radius = "$ref(shape.button)"
shape.default.border-radius-selected = "var(--button-root-border-radius, $ref(shape.button-selected))"
shape.default.border-radius-active = "var(--button-root-border-radius-active, $ref(shape.button-pressed))"

icon.width = "$ref(space.card-padding)"

root.border-radius-active = "$ref(shape.small)"

root.border-radius-selected = "$ref(shape.medium)"

outlined.background-color-hover = "var(--button-subtle-background-color-hover, color-mix(in srgb, $ref(color.text.secondary) calc($ref(state.opacity.hover) * 100%), transparent))"

outlined.background-color-active = "var(--button-subtle-background-color-active, color-mix(in srgb, $ref(color.text.secondary) calc(var(--button-state-layer-opacity-active, 0.1) * 100%), transparent))"

subtle.background-color-focus = "color-mix(in srgb, $ref(color.text.secondary) calc(var(--button-state-layer-opacity-focus, 0.1) * 100%), transparent)"

outlined.background-color-focus = "var(--button-subtle-background-color-focus, color-mix(in srgb, $ref(color.text.secondary) calc(var(--button-state-layer-opacity-focus, 0.1) * 100%), transparent))"

outlined.color-selected = "$ref(color.text.inverse)"

outlined.background-color-selected = "$ref(color.background.inverse)"

# M3-derived shape states with customized desktop size steps.
root.height = "$ref(size.control)"
root.border-radius = "$ref(shape.medium)"
tonal.color-selected = "$ref(color.secondary.on-primary)"
tonal.background-color-selected = "$ref(color.secondary.primary)"
primary.unselected.color = "$ref(color.text.secondary)"
primary.unselected.background-color = "$ref(color.surface.container)"
group.gap = "$ref(space.inline-gap)"
text.background-color-focus = "color-mix(in srgb, $ref(color.brand.primary) calc(var(--button-state-layer-opacity-focus, 0.1) * 100%), transparent)"
size.small.line-height = "$ref(action.button.xs.line-height)"
size.small.square.border-radius = "$ref(action.button.xs.square-radius)"
size.small.border-radius-active = "$ref(action.button.xs.pressed-radius)"
size.small.icon.width = "$ref(action.button.xs.icon)"
size.medium.line-height = "$ref(action.button.s.line-height)"
size.medium.square.border-radius = "$ref(action.button.s.square-radius)"
size.medium.border-radius-active = "$ref(action.button.s.pressed-radius)"
size.medium.icon.width = "$ref(action.button.s.icon)"
size.large.line-height = "$ref(action.button.m.line-height)"
size.large.square.border-radius = "$ref(action.button.m.square-radius)"
size.large.border-radius-active = "$ref(action.button.m.pressed-radius)"
size.large.icon.width = "$ref(action.button.m.icon)"
size.extra-large.height = "$ref(action.button.l.height)"
size.extra-large.padding = "0 $ref(action.button.l.padding-inline)"
size.extra-large.font-size = "$ref(action.button.l.font-size)"
size.extra-large.gap = "$ref(action.button.l.gap)"
size.extra-large.line-height = "$ref(action.button.l.line-height)"
size.extra-large.square.border-radius = "$ref(action.button.l.square-radius)"
size.extra-large.border-radius-active = "$ref(action.button.l.pressed-radius)"
size.extra-large.icon.width = "$ref(action.button.l.icon)"
size.extra-large.border-width = "$ref(action.button.l.border-width)"
size.extra-extra-large.height = "$ref(action.button.xl.height)"
size.extra-extra-large.padding = "0 $ref(action.button.xl.padding-inline)"
size.extra-extra-large.font-size = "$ref(action.button.xl.font-size)"
size.extra-extra-large.gap = "$ref(action.button.xl.gap)"
size.extra-extra-large.line-height = "$ref(action.button.xl.line-height)"
size.extra-extra-large.square.border-radius = "$ref(action.button.xl.square-radius)"
size.extra-extra-large.border-radius-active = "$ref(action.button.xl.pressed-radius)"
size.extra-extra-large.icon.width = "$ref(action.button.xl.icon)"
size.extra-extra-large.border-width = "$ref(action.button.xl.border-width)"

# Error colors replace the color pair while preserving the tonal/elevated surface.
danger.tonal.color = "$ref(color.feedback.error.text)"
danger.tonal.background-color = "$ref(color.feedback.error.background)"

size.small.border-width = "$ref(action.button.xs.border-width)"
size.medium.border-width = "$ref(action.button.s.border-width)"
size.large.border-width = "$ref(action.button.m.border-width)"

# MD3 desktop defaults when size is inherited; explicit Expressive sizes stay intact.
size.inherited.small.height = "$ref(sizing.small.control)"
size.inherited.small.padding = "0 $ref(action.desktop.small.padding-inline)"
size.inherited.medium.height = "$ref(sizing.medium.control)"
size.inherited.medium.padding = "0 $ref(action.desktop.medium.padding-inline)"
size.inherited.large.height = "$ref(sizing.large.control)"
size.inherited.large.padding = "0 $ref(action.desktop.large.padding-inline)"

# Shared material roles resolve at the closest theme boundary.
material.backdrop-filter = "$ref(material.filter)"
material.background-image = "$ref(material.sheen)"

# macOS Tahoe 26: independent push-button prominence, glass bezel and feedback.
macos.control.color = "var(--button-outlined-color, $ref(color.text.primary))"
macos.control.background-color = "var(--button-outlined-background-color, $ref(color.surface.raised))"
macos.control.background-color-hover = "var(--button-outlined-background-color-hover, color-mix(in oklch, $ref(color.text.primary) 4%, $ref(color.surface.raised)))"
macos.control.background-color-active = "var(--button-outlined-background-color-active, color-mix(in oklch, $ref(color.text.primary) 10%, $ref(color.surface.raised)))"
macos.control.background-image = "$ref(material.sheen)"
macos.control.border-color = "var(--button-outlined-border-color, $ref(color.border.subtle))"
macos.control.border-radius = "var(--button-root-border-radius, $ref(shape.control))"
macos.control.box-shadow = "$ref(material.control-shadow)"
macos.control.box-shadow-active = "inset 0 1px 3px color-mix(in oklch, $ref(color.text.primary) 12%, transparent)"
macos.control.outline-color = "var(--button-root-outline-color-focus, $ref(color.focus.ring))"
macos.control.font-weight = "$ref(typography.label.font-weight)"
macos.control.transition = "background-color $ref(motion.effects.fast), color $ref(motion.effects.fast), box-shadow $ref(motion.effects.fast)"
macos.prominent.color = "$ref(color.text.on-brand)"
macos.prominent.background-color = "$ref(color.brand.primary)"
macos.prominent.background-color-hover = "$ref(color.brand.primary-hover)"
macos.prominent.background-color-active = "$ref(color.brand.primary-active)"
macos.prominent.border-color = "color-mix(in oklch, $ref(color.brand.primary) 80%, $ref(color.text.primary))"
macos.prominent.background-image = "linear-gradient(180deg, color-mix(in oklch, $ref(color.control.thumb) 5%, transparent), transparent 70%)"
macos.secondary.color = "$ref(color.text.link)"
macos.secondary.background-color = "color-mix(in srgb, $ref(color.brand.primary) 10%, $ref(color.surface.raised))"
macos.secondary.background-color-hover = "color-mix(in srgb, $ref(color.brand.primary) 14%, $ref(color.surface.raised))"
macos.secondary.background-color-active = "color-mix(in srgb, $ref(color.brand.primary) 18%, $ref(color.surface.raised))"
macos.tonal.color-selected = "var(--button-tonal-color-selected, $ref(color.text.on-brand))"
macos.tonal.background-color-selected = "var(--button-tonal-background-color-selected, $ref(color.brand.primary))"
macos.tonal.background-color-hover = "var(--button-tonal-background-color-selected, $ref(color.brand.primary-hover))"
macos.tonal.background-color-active = "var(--button-tonal-background-color-selected, $ref(color.brand.primary-active))"
macos.glass.background-color = "$ref(material.background)"
macos.glass.background-color-hover = "color-mix(in oklch, $ref(color.surface.raised) 20%, $ref(material.background))"
macos.glass.background-color-active = "color-mix(in oklch, $ref(color.text.primary) 8%, $ref(material.background))"
macos.glass.box-shadow = "$ref(material.control-shadow)"
macos.plain.color = "var(--button-text-color, $ref(color.text.primary))"
macos.danger.color = "$ref(color.feedback.error.text)"
macos.danger.background-color = "color-mix(in oklch, $ref(color.feedback.error.solid) 6%, $ref(color.surface.raised))"
macos.danger.background-color-hover = "color-mix(in oklch, $ref(color.feedback.error.solid) 10%, $ref(color.surface.raised))"
macos.danger.background-color-active = "color-mix(in oklch, $ref(color.feedback.error.solid) 14%, $ref(color.surface.raised))"
macos.group.padding = "$ref(space.stack-gap)"
macos.group.border-radius = "$ref(shape.overlay)"
