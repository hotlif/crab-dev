[build]
output = "./src/token.ts"
prefix = "radio"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]
root.outline-color-focus = "$ref(color.focus.ring)"
root.outline-width-focus = "2px"
root.outline-offset-focus = "2px"
# Keep the icon, circular state layer and touch target independent.
root.touch.min-width = "$ref(size.selection-target)"
root.touch.min-height = "$ref(size.selection-target)"
root.line-height = "$ref(typography.body.large.line-height)"
root.opacity-disabled = "$ref(opacity.disabled)"

# ─── 通用 ────────────────────────────────────────────────────────────────────

control.transition = "background-color $ref(motion.interaction), border-color $ref(motion.interaction), box-shadow $ref(motion.interaction)"
control.target.width = "$ref(size.selection-target)"
control.border-color-error = "$ref(color.border.error)"
dot.color-error = "$ref(color.feedback.error.solid)"
state-layer.width = "40px"
state-layer.border-radius = "$ref(radius.pill)"
state-layer.color = "$ref(color.text.primary)"
state-layer.color-selected = "$ref(color.brand.primary)"
state-layer.color-error = "$ref(color.feedback.error.solid)"
state-layer.opacity-hover = "$ref(state.opacity.hover)"
state-layer.opacity-focus = "$ref(state.opacity.focus)"
state-layer.opacity-active = "$ref(state.opacity.pressed)"
state-layer.transition = "opacity $ref(motion.interaction), background-color $ref(motion.interaction)"


# ─── 通用尺寸 ────────────────────────────────────────────────────────────────

label.gap            = "$ref(space.inline-gap)"
group.gap            = "$ref(space.component-gap)"


# ─── 尺寸 — Large ────────────────────────────────────────────────────────────

size.large.box.width = "24px"
size.large.dot.width = "12px"
size.large.label.font-size   = "$ref(font.size.subhead)"


# ─── 尺寸 — Middle (默认) ────────────────────────────────────────────

size.middle.box.width = "20px"
size.middle.dot.width = "10px"
size.middle.label.font-size = "$ref(typography.body.large.font-size)"


# ─── 尺寸 — Small ────────────────────────────────────────────────────────────

size.small.box.width = "16px"
size.small.dot.width = "8px"
size.small.label.font-size   = "$ref(typography.label.font-size)"


# ─── 默认状态 ────────────────────────────────────────────────────────────────

control.border-width = "2px"
control.border-style = "solid"
control.border-color = "$ref(color.text.secondary)"
control.border-color-hover = "$ref(color.text.primary)"
control.background-color = "transparent"


# ─── 选中状态 ────────────────────────────────────────────────────────────────

control.checked.background-color = "transparent"
control.checked.background-color-hover = "transparent"
control.checked.border-color = "$ref(color.brand.primary)"
dot.checked.color = "$ref(color.brand.primary)"
dot.scale-hidden = "0.6"
dot.scale = "1"
dot.transition = "opacity $ref(motion.interaction), scale $ref(motion.spatial.fast)"


# ─── 禁用状态 ────────────────────────────────────────────────────────────────

control.background-color-disabled = "transparent"
control.border-color-disabled = "$ref(color.text.primary)"
dot.color-disabled        = "$ref(color.text.primary)"


# ─── 标签 ────────────────────────────────────────────────────────────────────

label.color          = "$ref(color.text.primary)"
label.color-disabled = "$ref(color.text.primary)"
