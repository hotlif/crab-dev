[build]
output = "./src/token.ts"
prefix = "bar-chart"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

# 坐标轴文本渲染于 Canvas（bitmap 文本，WebGL 无法解析 CSS 变量），
# 其颜色为 palette.ts 中与 color.text.secondary 同值的 oklch 字面量。

# ─── 图例 ───────────────────────────────────
legend.gap             = "$ref(space.component-gap)"
legend.item-gap        = "$ref(space.component-gap)"
legend.swatch-gap      = "$ref(space.inline-gap)"
legend.swatch-size     = "10px"
legend.label.color     = "$ref(color.text.secondary)"
legend.label.font.size = "$ref(font.size.caption)"

# ─── 键盘焦点 ───────────────────────────────
focus.ring = "$ref(shadow.focus-ring)"

# ─── 悬浮提示 ───────────────────────────────
tooltip.background        = "$ref(color.background.elevated)"
tooltip.radius            = "$ref(radius.md)"
tooltip.shadow            = "$ref(shadow.float)"
tooltip.padding           = "8px 12px"
tooltip.row-gap           = "$ref(space.inline-gap)"
tooltip.key-gap           = "$ref(space.inline-gap)"
tooltip.font.size         = "$ref(font.size.caption)"
tooltip.category.color    = "$ref(color.text.secondary)"
tooltip.name.color        = "$ref(color.text.secondary)"
tooltip.value.color       = "$ref(color.text.primary)"
tooltip.value.font.weight = "$ref(font.weight.label)"
