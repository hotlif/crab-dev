[build]
output = "./src/token.ts"
prefix = "bar-chart"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

# Canvas 根节点会先在 DOM 继承上下文中解析这些 L3 CSS 值，再交给 WebGL。
palette.series.blue.color       = "$ref(data.chart.series.1)"
palette.series.orange.color     = "$ref(data.chart.series.2)"
palette.series.aqua.color       = "$ref(data.chart.series.3)"
palette.series.yellow.color     = "$ref(data.chart.series.4)"
palette.series.magenta.color    = "$ref(data.chart.series.5)"
palette.series.green.color      = "$ref(data.chart.series.6)"
palette.series.violet.color     = "$ref(data.chart.series.7)"
palette.series.red.color        = "$ref(data.chart.series.8)"
palette.gridline.color          = "$ref(color.border.subtle)"
palette.baseline.color          = "$ref(color.border.default)"
palette.axis-label.color        = "$ref(color.text.secondary)"
palette.canvas.background-color = "$ref(color.surface.content)"

# ─── 图例 ───────────────────────────────────
legend.gap                 = "$ref(density.gap)"
legend.column-gap          = "var(--bar-chart-legend-item-gap, $ref(density.gap))"
legend.row-gap             = "calc($ref(density.gap) / 2)"
legend.item.gap            = "calc($ref(density.gap) / 2)"
legend.swatch.inline-size  = "10px"
legend.swatch.block-size   = "10px"
legend.label.color         = "$ref(color.text.secondary)"
legend.label.font-size     = "$ref(typography.caption.font-size)"

# 图例项为切换系列显隐的按钮
legend.item.border-radius  = "$ref(radius.sm)"
legend.item.background-color-hover = "$ref(color.state.hover)"
legend.item.transition     = "$ref(motion.interaction)"
legend.item.opacity-hidden = "$ref(opacity.secondary)"

# ─── 键盘焦点 ───────────────────────────────
root.box-shadow-focus = "$ref(shadow.focus-ring)"
root.outline-color-focus = "$ref(color.focus.ring)"
root.font-family = "$ref(typography.body.font-family)"
root.line-height = "$ref(typography.body.line-height)"
root.outline-width-focus = "2px"
legend.item.touch.min-width = "$ref(size.touch-target)"
legend.item.touch.min-height = "$ref(size.touch-target)"

# ─── 悬浮提示 ───────────────────────────────
tooltip.background-color = "$ref(overlay.popover.background)"
tooltip.border-radius    = "$ref(overlay.popover.shape)"
tooltip.box-shadow       = "$ref(shadow.float)"
tooltip.padding          = "$ref(density.gap) $ref(density.padding)"
tooltip.rows.row-gap     = "calc($ref(density.gap) / 2)"
tooltip.row.column-gap   = "calc($ref(density.gap) / 2)"
tooltip.font-size        = "$ref(typography.caption.font-size)"
tooltip.category.color   = "$ref(color.text.secondary)"
tooltip.name.color       = "$ref(color.text.secondary)"
tooltip.value.color      = "$ref(color.text.primary)"
tooltip.value.font-weight = "$ref(typography.label.font-weight)"

# Legend and tooltip geometry stay local; rhythm follows the nearest density boundary.
legend.item.padding = "calc($ref(density.gap) / 4) $ref(density.gap)"
legend.swatch.border-radius = "2px"
bar.border-radius = "2px"
tooltip.line-height = "$ref(typography.body.line-height)"
tooltip.key.inline-size = "10px"
tooltip.key.block-size = "3px"
tooltip.key.border-radius = "1.5px"
tooltip.value.padding-inline-start = "$ref(density.padding)"

legend.item.background-color-pressed = "$ref(color.state.pressed)"
tooltip.border-color = "$ref(overlay.popover.border)"
tooltip.border-width = "1px"
