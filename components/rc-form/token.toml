[build]
output = "./src/token.ts"
prefix = "form"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

# ─── 字段行布局 ──────────────────────────────────────────────────────────────
# 行内元素（标签 / 编辑器 / 状态图标）之间的水平列间距
item.gap = "$ref(space.component-gap)"
# 相邻字段行之间的垂直行间距（Form 以 grid 统一控制，取代各示例自行设置的 gap）
row.gap = "$ref(density.gap)"

# ─── 标签 ────────────────────────────────────────────────────────────────────
label.color = "$ref(color.text.primary)"
label.font-size = "$ref(typography.label.font-size)"
label.font-weight = "$ref(typography.label.font-weight)"

# ─── 必填指示符 ──────────────────────────────────────────────────────────────
# 与输入字段共用标记角色，由主题控制颜色、位置与间距
required.color = "$ref(field.required.color)"
required.gap = "$ref(field.required.gap)"

# ─── 校验状态图标 ────────────────────────────────────────────────────────────
# 图标仅补充校验状态，错误与警告说明在字段下方持续显示。
status.width = "$ref(font.size.subhead)"
status.color-error = "$ref(color.feedback.error.text)"
status.warning.color = "$ref(color.feedback.warning.text)"
status.success.color = "$ref(color.feedback.success.text)"
status.validating.color = "$ref(color.text.secondary)"

message.font-size = "$ref(typography.body.small.font-size)"
message.line-height = "$ref(typography.body.small.line-height)"
message.padding-inline = "$ref(field.support.padding-inline)"
message.gap = "$ref(field.layout.row-gap)"
