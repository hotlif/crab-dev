[build]
output = "./src/token.ts"
prefix = "color-picker"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

# ===== 面板 Panel =====
panel.padding-block = "$ref(space.stack-gap)"
panel.padding-inline = "$ref(space.section-gap)"
panel.gap = "$ref(space.stack-gap)"
panel.min-width = "250px"
panel.rail.height = "12px"

footer.gap = "$ref(space.component-gap)"
footer.margin-top = "$ref(space.section-gap)"

panel.preview.height = "5rem"
panel.preview.width = "100%"
panel.preview.border-radius = "$ref(radius.lg)"
panel.preview.border-color = "$ref(color.border.default)"
panel.preview.margin-top = "$ref(space.section-gap)"

panel.slider.container.gap = "$ref(space.component-gap)"
panel.slider.label.width = "6em"
panel.slider.label.font-size = "$ref(typography.label.font-size)"
panel.slider.label.font-weight = "$ref(typography.label.font-weight)"
panel.slider.label.line-height = "$ref(typography.label.line-height)"

# ===== 滑块 Slider(覆盖 rc-slider 令牌变量所需的语义色)=====
slider.thumb.stroke-color = "$ref(color.surface.content)"
# alpha 滑块的棋盘格底色(表示透明)
slider.alpha.checker.color = "$ref(color.border.hover)"

# ===== 触发器 Trigger =====
trigger.border-color = "$ref(color.border.default)"
trigger.border-color-hover = "$ref(color.border.hover)"
trigger.background-color-hover = "$ref(color.background.hover-subtle)"
trigger.background-color-active = "$ref(color.background.active-subtle)"
trigger.border-radius = "$ref(shape.control)"
trigger.padding = "0.25rem"
trigger.gap = "$ref(space.inline-gap)"
trigger.touch.min-width = "$ref(size.touch-target)"
trigger.touch.min-height = "$ref(size.touch-target)"
trigger.opacity-disabled = "$ref(opacity.disabled)"
trigger.ring.color-focus = "$ref(color.focus.ring)"
trigger.ring.width-focus = "2px"
trigger.ring.outline-offset-focus = "2px"
trigger.background-color-disabled = "$ref(color.background.disabled)"
trigger.border-color-disabled = "$ref(color.border.default)"

trigger.swatch.small.width = "16px"
trigger.swatch.medium.width = "$ref(size.icon-large)"
trigger.swatch.large.width = "$ref(size.24)"

# ===== 文本输入 Input =====
input.gap = "$ref(space.inline-gap)"
input.format.width = "calc($ref(field.input.font-size) * 4 + $ref(field.control.padding-inline) * 2 + $ref(sizing.small.action) + $ref(space.inline-gap))"

# ===== 预设色板 Swatches =====
swatch.width = "20px"
swatch.touch.width = "$ref(size.touch-target)"
swatch.border-width = "1px"
swatch.gap = "$ref(space.inline-gap)"
swatch.border-color = "$ref(color.border.default)"
swatch.border-radius = "$ref(radius.sm)"
swatch.group.label.color = "$ref(color.text.secondary)"
swatch.group.label.font-size = "$ref(typography.body.small.font-size)"
