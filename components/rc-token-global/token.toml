red.800 = "oklch(0.444 0.177 26)"
red.900 = "oklch(0.396 0.141 27)"
red.950 = "oklch(0.318 0.100 27)"


# ── Green — 成功 ────────────────────────────────────────────────────────────
# 用途    成功提示、完成状态、在线标识
# 色相    H = 149 → 156（从亮到暗逐步偏冷）

green.50  = "oklch(0.982 0.018 149)"
green.100 = "oklch(0.962 0.044 150)"
green.200 = "oklch(0.925 0.084 150)"
green.300 = "oklch(0.871 0.138 151)"
