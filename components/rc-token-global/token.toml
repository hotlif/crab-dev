# ── 黑白 ────────────────────────────────────────────────────────────────────

white = "oklch(1.000 0 0)"
black = "oklch(0.000 0 0)"


# ─── 间距 · Spacing ─────────────────────────────────────────────────────────
# 基准    4px 乘数系统，含 1px / 2px 微调值
# 节奏    4 → 8 → 12 → 16 → 20 → 24 → 32 → 40 → 48 → 64 → 80 → 96

space.0   = "0px"
space.px  = "1px"
space.0-5 = "2px"
space.1   = "4px"
space.1-5 = "6px"
space.2   = "8px"
space.2-5 = "10px"
space.3   = "12px"
space.3-5 = "14px"
space.4   = "16px"
space.5   = "20px"
space.6   = "24px"
space.8   = "32px"
space.10  = "40px"
space.12  = "48px"
space.16  = "64px"
space.20  = "80px"
space.24  = "96px"


# ─── 圆角 · Radius ──────────────────────────────────────────────────────────
# 设计标尺    radius.3 (6px)  → 控件    按钮、输入框、Badge
#             radius.4 (8px)  → 卡片    Card、Panel
#             radius.6 (12px) → 浮层    Dialog、Popover、Dropdown

radius.0    = "0px"
radius.0-5  = "1px"
radius.1    = "2px"
radius.1-5  = "3px"
radius.2    = "4px"
radius.2-5  = "5px"
radius.3    = "6px"
radius.4    = "8px"
radius.5    = "10px"
radius.6    = "12px"
radius.8    = "16px"
radius.full = "9999px"


# ─── 排版 · Typography ──────────────────────────────────────────────────────


# ── 字体族 ──────────────────────────────────────────────────────────────────

font.family.sans = "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
font.family.mono = "'Geist Mono', 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace"


# ── 字号 — 16px 为基准 (md) ─────────────────────────────────────────────────

font.size.xs  = "12px"
font.size.sm  = "14px"
font.size.md  = "16px"
font.size.lg  = "18px"
font.size.xl  = "20px"
font.size.2xl = "24px"
font.size.3xl = "28px"
font.size.4xl = "32px"

# Chinese UI type metrics; unitless ratios scale with text enlargement.
line.height.14-22 = "1.5714285714"
line.height.14-20 = "1.4285714285714286"
line.height.20-28 = "1.4"
line.height.28-36 = "1.2857142857142858"
font.family.cjk = "'Inter', 'PingFang SC', 'Microsoft YaHei UI', 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif"
size.44 = "44px"
size.48 = "48px"


# ── 字重 ────────────────────────────────────────────────────────────────────

font.weight.regular  = "400"
font.weight.medium   = "500"
font.weight.semibold = "600"
font.weight.bold     = "700"


# ── 行高 — 紧凑，匹配 Inter / Geist 无衬线体系 ──────────────────────────────

line.height.none    = "1"
line.height.tight   = "1.25"
line.height.snug    = "1.375"
line.height.normal  = "1.5"
line.height.relaxed = "1.625"
line.height.loose   = "2"


# ─── 阴影 · Shadows ─────────────────────────────────────────────────────────
# 设计原则    极度克制，透明度仅 0.03 → 0.08
#             日常 UI 不使用阴影，依赖 1px border 分隔层级
#             阴影保留给浮层：Dropdown、Dialog、Tooltip、Toast

shadow.none = "none"
shadow.xs   = "0 1px 2px oklch(0 0 0 / 0.03)"
shadow.sm   = "0 1px 2px 0 oklch(0 0 0 / 0.05)"
shadow.md   = "0 4px 6px -1px oklch(0 0 0 / 0.1), 0 2px 4px -2px oklch(0 0 0 / 0.1)"
shadow.lg   = "0 0 0 1px oklch(0 0 0 / 0.03), 0 4px 8px -2px oklch(0 0 0 / 0.06), 0 12px 20px -4px oklch(0 0 0 / 0.08)"
shadow.xl   = "0 20px 25px -5px oklch(0 0 0 / 0.08), 0 8px 10px -6px oklch(0 0 0 / 0.04)"


# ─── 动效 · Motion ───────────────────────────────────────────────────────────
# 设计原则    快速、无感、不抢注意力
#             150ms 默认过渡 + ease-out 即覆盖绝大多数交互场景

duration.0      = "0ms"
duration.fast   = "100ms"
duration.normal = "200ms"
duration.slow   = "300ms"

easing.default = "cubic-bezier(0.4, 0, 0.2, 1)"
easing.in      = "cubic-bezier(0.4, 0, 1, 1)"
easing.out     = "cubic-bezier(0, 0, 0.2, 1)"
easing.linear  = "linear"


# ─── 透明度 · Opacity ────────────────────────────────────────────────────────

opacity.0   = "0"
opacity.5   = "0.05"
opacity.8   = "0.08"
opacity.12  = "0.12"
opacity.16  = "0.16"
opacity.38  = "0.38"
opacity.10  = "0.1"
opacity.20  = "0.2"
opacity.30  = "0.3"
opacity.50  = "0.5"
opacity.70  = "0.7"
opacity.80  = "0.8"
opacity.100 = "1"


# ─── 层级 · Z-Index ─────────────────────────────────────────────────────────
# 纯数字刻度，与间距 / 圆角保持统一命名风格
# 语义名称（dropdown、dialog 等）由 Layer 2 定义
# 值之间保留 100 间隔便于插入自定义层

z-index.0  = "0"
z-index.1  = "1"
z-index.10 = "1000"
z-index.20 = "1100"
z-index.30 = "1200"
z-index.40 = "1300"
z-index.50 = "1400"
z-index.60 = "1500"
z-index.70 = "1600"

