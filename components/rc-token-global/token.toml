[build]
output = "./src/token.ts"
prefix = "token-global"

[token]

# ═══════════════════════════════════════════════════════════════════════════════
#  🦀 Crab Design System — Global Tokens (Layer 1)
#
#  ┌─────────────────────────────────────────────────────────────────────────┐
#  │  设计哲学：极简克制 · 中性锋利                                            │
#  │                                                                         │
#  │  • Zinc 中性灰为绝对主角，承担 90% UI 职责                                │
#  │  • 原有五组色阶保持稳定；Purple 提供新增紫色基元                           │
#  │  • 品牌、反馈与焦点职责由 L2 指定，L1 不自动承担语义                        │
#  │  • 色彩空间使用 OKLCh；明暗主题在 L2 显式配对                             │
#  │  • 依赖 1px 边框分隔层级，阴影极度克制                                     │
#  │  • 150ms 默认过渡，交互快速无感                                           │
#  │  • 16px 基准排版，Inter + Geist Mono 紧凑体系                             │
#  └─────────────────────────────────────────────────────────────────────────┘
# ═══════════════════════════════════════════════════════════════════════════════


# ─── 色板 · Colors ──────────────────────────────────────────────────────────

# ── Purple — 紫色调阶，数字越大越亮（不同于原有 50–950 色阶） ─────────────────
# Source: Material Web v0.192 primary palette, converted to OKLCh.
# https://github.com/material-components/material-web/blob/main/tokens/versions/v0_192/_md-ref-palette.scss
# 保留当前站点已经使用的七档；没有定义的调阶不得插值后冒充公共值。
purple.10  = "oklch(0.24199786 0.14038488 286.089811)"
purple.20  = "oklch(0.32510160 0.13528526 291.151996)"
purple.30  = "oklch(0.41029262 0.13369038 292.705951)"
purple.40  = "oklch(0.49552086 0.13045663 293.709078)"
purple.80  = "oklch(0.83492620 0.09457492 298.017957)"
purple.90  = "oklch(0.91829316 0.04770250 302.827510)"
purple.100 = "oklch(0.99999999 0.00000004 0.000000)"


# ── Zinc — 核心中性色 ───────────────────────────────────────────────────────
# 角色    承担 90% 的 UI 职责：文本、背景、边框、分割线
# 色相    H = 286（冷灰调）
# 饱和度  极低 C ≤ 0.014，视觉近乎纯灰
# 明度    50 → 950 对称递减，ΔL 呈钟形分布，感知过渡均匀

zinc.50  = "oklch(0.980 0.002 286)"
zinc.100 = "oklch(0.950 0.003 286)"
zinc.200 = "oklch(0.900 0.004 286)"
zinc.300 = "oklch(0.840 0.008 286)"
zinc.400 = "oklch(0.760 0.012 286)"
zinc.500 = "oklch(0.660 0.014 286)"
zinc.600 = "oklch(0.550 0.014 286)"
zinc.700 = "oklch(0.430 0.012 286)"
zinc.800 = "oklch(0.320 0.008 286)"
zinc.900 = "oklch(0.220 0.005 286)"
zinc.950 = "oklch(0.140 0.004 286)"


# ── Blue — 信息 / 焦点 ─────────────────────────────────────────────────────
# 用途    焦点环、链接、选中态、信息提示
# 色相    H = 254 → 267（从亮到暗逐步偏蓝）

blue.50  = "oklch(0.970 0.014 254)"
blue.100 = "oklch(0.932 0.032 255)"
blue.200 = "oklch(0.882 0.059 256)"
blue.300 = "oklch(0.809 0.105 257)"
blue.400 = "oklch(0.714 0.165 259)"
blue.500 = "oklch(0.623 0.214 261)"
blue.600 = "oklch(0.546 0.245 262)"
blue.700 = "oklch(0.488 0.230 264)"
blue.800 = "oklch(0.424 0.199 265)"
blue.900 = "oklch(0.379 0.146 266)"
blue.950 = "oklch(0.282 0.091 267)"


# ── Red — 危险 / 破坏性操作 ─────────────────────────────────────────────────
# 用途    删除确认、错误状态、表单校验失败
# 色相    H = 17 → 27（从亮到暗逐步偏暖）

red.50  = "oklch(0.971 0.013 17)"
red.100 = "oklch(0.936 0.032 18)"
red.200 = "oklch(0.885 0.062 19)"
red.300 = "oklch(0.808 0.114 20)"
