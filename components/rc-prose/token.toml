[build]
output = "./src/token.ts"
prefix = "prose"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

# ═══════════════════════════════════════════════════════════════════════════════
#  Prose — Markdown 排版令牌（Layer 3）
#  颜色与字重通过令牌管理（支持主题覆写），度量值由 CSS 直接提供（匹配 tailwindcss-typography）
# ═══════════════════════════════════════════════════════════════════════════════

# ── 全局 ────────────────────────────────────────────────────────────────────
root.max-width = "100%"

# ── 颜色 ────────────────────────────────────────────────────────────────────
body.color     = "$ref(color.text.primary)"
heading.color  = "$ref(color.text.primary)"
lead.color     = "$ref(color.text.secondary)"
link.color     = "$ref(color.text.link)"
link.color-hover = "$ref(color.text.link-hover)"
strong.color   = "$ref(color.text.primary)"
list.counter.color = "$ref(color.text.secondary)"
list.bullet.color = "$ref(color.border.hover)"
hr.border-color = "$ref(color.border.default)"
blockquote.color = "$ref(color.text.primary)"
blockquote.border-color = "$ref(color.border.default)"
caption.color = "$ref(color.text.secondary)"
code.color     = "$ref(color.text.primary)"
code.background-color = "$ref(color.fill.subtle)"
pre.color      = "$ref(color.text.primary)"
pre.background-color = "$ref(color.fill.subtle)"
kbd.color      = "$ref(color.text.primary)"
kbd.box-shadow = "0 0 0 1px $ref(color.border.strong)"
table.heading.border-color = "$ref(color.border.hover)"
table.heading.background-color = "$ref(color.fill.subtle)"
table.cell.border-color = "$ref(color.border.default)"

# ── 反色容器 ────────────────────────────────────────────────────────────────
inverse.body.color = "color-mix(in oklch, $ref(color.text.inverse) 82%, transparent)"
inverse.heading.color = "color-mix(in oklch, $ref(color.text.inverse) 92%, transparent)"
inverse.lead.color = "color-mix(in oklch, $ref(color.text.inverse) 60%, transparent)"
inverse.link.color = "$ref(color.text.inverse)"
inverse.link.color-hover = "color-mix(in oklch, $ref(color.text.inverse) 80%, transparent)"
inverse.strong.color = "color-mix(in oklch, $ref(color.text.inverse) 92%, transparent)"
inverse.list.counter.color = "color-mix(in oklch, $ref(color.text.inverse) 60%, transparent)"
inverse.list.bullet.color = "color-mix(in oklch, $ref(color.text.inverse) 60%, transparent)"
inverse.hr.border-color = "color-mix(in oklch, $ref(color.text.inverse) 24%, transparent)"
inverse.blockquote.color = "color-mix(in oklch, $ref(color.text.inverse) 85%, transparent)"
inverse.blockquote.border-color = "color-mix(in oklch, $ref(color.text.inverse) 24%, transparent)"
inverse.caption.color = "color-mix(in oklch, $ref(color.text.inverse) 60%, transparent)"
inverse.code.color = "color-mix(in oklch, $ref(color.text.inverse) 90%, transparent)"
inverse.code.background-color = "color-mix(in oklch, $ref(color.text.inverse) 8%, transparent)"
inverse.pre.color = "color-mix(in oklch, $ref(color.text.inverse) 75%, transparent)"
inverse.pre.background-color = "color-mix(in oklch, $ref(color.text.inverse) 8%, transparent)"
inverse.kbd.color = "color-mix(in oklch, $ref(color.text.inverse) 90%, transparent)"
inverse.kbd.box-shadow = "0 0 0 1px color-mix(in oklch, $ref(color.text.inverse) 45%, transparent)"
inverse.table.heading.border-color = "color-mix(in oklch, $ref(color.text.inverse) 15%, transparent)"
inverse.table.heading.background-color = "color-mix(in oklch, $ref(color.text.inverse) 5%, transparent)"
inverse.table.cell.border-color = "color-mix(in oklch, $ref(color.text.inverse) 8%, transparent)"

# ── 字重 ────────────────────────────────────────────────────────────────────
a.font-weight          = "$ref(font.weight.body)"
strong.font-weight     = "$ref(font.weight.strong)"
h1.font-weight = "$ref(typography.headline.large.emphasized.font-weight)"
h2.font-weight         = "$ref(typography.title.font-weight)"
h3.font-weight         = "$ref(typography.label.font-weight)"
h4.font-weight         = "$ref(typography.label.font-weight)"
blockquote.font-weight = "$ref(font.weight.body)"
code.font-weight       = "$ref(font.weight.body)"
pre.font-weight        = "$ref(font.weight.body)"
kbd.font-weight        = "$ref(typography.label.font-weight)"
dt.font-weight         = "$ref(typography.title.font-weight)"
th.font-weight         = "$ref(typography.title.font-weight)"
marker.font-weight     = "$ref(font.weight.body)"
body.font-family = "$ref(typography.body.font-family)"
body.font-size = "$ref(typography.body.large.font-size)"
body.line-height = "$ref(typography.body.large.line-height)"
h1.font-size = "$ref(typography.headline.large.font-size)"
h1.line-height = "$ref(typography.headline.large.line-height)"
h2.font-size = "$ref(typography.headline.small.font-size)"
h2.line-height = "$ref(typography.headline.small.line-height)"
h3.font-size = "$ref(typography.title.large.font-size)"
h3.line-height = "$ref(typography.title.large.line-height)"
h4.font-size = "$ref(typography.title.medium.font-size)"
h4.line-height = "$ref(typography.title.medium.line-height)"
