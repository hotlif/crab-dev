[docs]
source_dir = "docs"
title = "TextEdit 多行文本输入框"
description = "多行文本编辑组件, 支持尺寸/验证状态/一键清除/字符计数与内容自适应高度"
locale = "zh-CN"

[test]
setup = ["../../test/wake-css.setup.ts"]
environment = "dom"
include = ["src/**/*.{test,spec}.{js,mjs,cjs,jsx,ts,mts,cts,tsx}"]
exclude = ["**/node_modules/**", "**/coverage/**", "**/esm/**", "**/cjs/**", "**/declarations/**"]
timeout_ms = 5000
leaks = "error"

[test.react]
strict_mode = false
cleanup = true
act_warnings = "error"
test_id_attribute = "data-testid"

[test.network]
mode = "deny"
allow_hosts = []

[test.coverage]
enabled = true
reporters = ["text", "lcov"]
