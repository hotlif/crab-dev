[build]
output = "./src/token.ts"
prefix = "text-edit"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

root.outline-color-focus = "$ref(color.focus.ring)"
root.outline-width-focus = "2px"
root.outline-offset-focus = "2px"
root.opacity-disabled = "$ref(opacity.disabled)"
root.touch.min-height = "$ref(size.touch-target)"
clear.width = "$ref(size.48)"
clear.height = "$ref(size.48)"
clear.touch.width = "$ref(size.touch-target)"
clear.touch.height = "$ref(size.touch-target)"

root.transition = "var(--text-edit-transition, border-color $ref(motion.interaction), box-shadow $ref(motion.interaction), background-color $ref(motion.interaction), color $ref(motion.interaction), opacity $ref(motion.interaction))"
root.border-radius = "var(--text-edit-border-radius, $ref(shape.extra-small))"
root.border-width = "var(--text-edit-border-width, 1px)"
root.border-style = "var(--text-edit-border-style, solid)"
root.border-color = "var(--text-edit-border-color, $ref(color.border.default))"
root.border-color-hover = "var(--text-edit-border-color-hover, $ref(color.border.hover))"
root.border-color-focus = "var(--text-edit-border-color-focus, $ref(color.border.focus))"
root.box-shadow = "var(--text-edit-box-shadow, var(--text-edit-box-shadow-default, none))"
root.box-shadow-focus-within = "var(--text-edit-box-shadow-focus-within, $ref(shadow.focus-ring))"
root.background-color = "var(--text-edit-background-color, $ref(color.surface.content))"
text.color = "$ref(color.text.primary)"
placeholder.color = "$ref(color.text.secondary)"
icon.color = "$ref(color.text.secondary)"
icon.gap = "$ref(space.component-gap)"

# 清除按钮定位：与容器内边距对齐，使其落在首行文本的行内高度上
clear.inset-block-start = "$ref(space.inline-gap)"
clear.inset-inline-end = "$ref(space.control-padding-x)"

# Material 多行文本字段：Outlined / Filled、浮动标签与下方信息区。
field.gap = "$ref(space.inline-gap)"
field.padding-inline = "$ref(space.section-gap)"
field.label.top = "$ref(space.section-gap)"
field.filled.label.top = "$ref(space.component-gap)"
field.label.padding-inline = "$ref(space.inline-gap)"
field.label.font-size = "$ref(typography.body.small.font-size)"
field.label.line-height = "$ref(typography.body.small.line-height)"
field.label.color = "$ref(color.text.secondary)"
field.label.color-focus = "$ref(color.brand.primary)"
field.input.padding-top = "$ref(space.section-gap)"
field.transition = "top $ref(motion.interaction), font-size $ref(motion.interaction), color $ref(motion.interaction), background-color $ref(motion.interaction)"
field.filled.background-color = "$ref(color.surface.highest)"
field.filled.background-color-hover = "color-mix(in oklch, $ref(color.text.primary) calc($ref(state.opacity.hover) * 100%), $ref(color.surface.highest))"
field.indicator.border-color = "$ref(color.text.secondary)"
field.color-error = "$ref(color.feedback.error.text)"
field.color-warning = "$ref(color.feedback.warning.text)"
field.support.line-height = "$ref(typography.body.small.line-height)"

# 验证状态令牌（反馈原理：通过边框颜色和焦点光环给用户清晰的表单验证反馈）
status.border-color-error = "var(--text-edit-status-error-border-color, $ref(color.feedback.error.border))"
status.box-shadow-error = "var(--text-edit-status-error-box-shadow-focus-within, 0 0 0 3px color-mix(in oklch, $ref(color.feedback.error.border) 25%, transparent))"
status.border-color-warning = "var(--text-edit-status-warning-border-color, $ref(color.feedback.warning.border))"
status.box-shadow-warning = "var(--text-edit-status-warning-box-shadow-focus-within, 0 0 0 3px color-mix(in oklch, $ref(color.feedback.warning.border) 25%, transparent))"

# 字符计数令牌（认知负荷减轻：让用户不必推算剩余字数）
count.color = "$ref(color.text.tertiary)"
count.font-size = "$ref(typography.caption.font-size)"

# 多行输入的高度由 rows / autoSize 决定，尺寸令牌只控制内边距与排版
size.large.padding = "$ref(space.inline-gap) $ref(space.control-padding-x)"
size.large.font-size = "$ref(typography.body.large.font-size)"
size.large.line-height = "calc($ref(typography.body.large.font-size) * $ref(typography.body.large.line-height))"

size.middle.padding = "$ref(space.inline-gap) $ref(space.control-padding-x)"
size.middle.font-size = "$ref(typography.body.large.font-size)"
size.middle.line-height = "calc($ref(typography.body.large.font-size) * $ref(typography.body.large.line-height))"

size.small.padding = "$ref(space.inline-gap) $ref(space.control-padding-x-small)"
size.small.font-size = "$ref(typography.body.large.font-size)"
size.small.line-height = "calc($ref(typography.body.large.font-size) * $ref(typography.body.large.line-height))"
