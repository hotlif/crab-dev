[build]
output = "./src/token.ts"
prefix = "text-edit"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

root.outline-color-focus = "$ref(color.focus.ring)"
root.outline-width-focus = "2px"
root.outline-offset-focus = "2px"
root.opacity-disabled = "$ref(opacity.disabled)"
root.touch.min-height = "$ref(size.touch-target)"
clear.width = "$ref(sizing.middle.action)"
clear.height = "$ref(sizing.middle.action)"
clear.touch.width = "$ref(size.touch-target)"
clear.touch.height = "$ref(size.touch-target)"

root.transition = "border-color $ref(motion.interaction), box-shadow $ref(motion.interaction), background-color $ref(motion.interaction), color $ref(motion.interaction), opacity $ref(motion.interaction)"
root.border-radius = "$ref(shape.control)"
root.border-width = "1px"
root.border-style = "solid"
root.border-color = "$ref(color.border.default)"
root.border-color-hover = "$ref(color.border.hover)"
root.border-color-focus = "$ref(color.border.focus)"
root.box-shadow = "$ref(field.control.shadow)"
root.box-shadow-focus-within = "$ref(field.control.shadow-focus)"
root.background-color = "$ref(color.surface.content)"
text.color = "$ref(color.text.primary)"
placeholder.color = "$ref(color.text.secondary)"
icon.color = "$ref(color.text.secondary)"
icon.gap = "$ref(space.component-gap)"

# 清除按钮定位：与容器内边距对齐，使其落在首行文本的行内高度上
clear.inset-block-start = "$ref(space.inline-gap)"
clear.inset-inline-end = "$ref(space.control-padding-x)"

# Shared field roles switch structure through the semantic theme boundary.
field.layout.row-gap = "$ref(field.layout.row-gap)"
field.control.min-height = "$ref(field.control.min-height)"
field.control.padding-inline = "$ref(field.control.padding-inline)"
field.input.font-size = "$ref(field.input.font-size)"
field.input.line-height = "$ref(field.input.line-height)"
field.input.multiline.padding-block = "$ref(field.input.multiline-padding-block)"
field.input.multiline.filled.padding-top = "$ref(field.input.multiline-filled-padding-top)"
field.input.multiline.filled.padding = "$ref(field.input.multiline-filled-padding-bottom)"
field.label.font-size = "$ref(field.label.font-size)"
field.label.line-height = "$ref(field.label.line-height)"
field.label.multiline.top = "$ref(field.label.multiline-offset)"
field.placeholder.color = "$ref(field.label.empty-placeholder-color)"
field.label.floating.font-size = "$ref(field.label.floating.font-size)"
field.label.floating.line-height = "$ref(field.label.floating.line-height)"
field.label.floating.transform = "$ref(field.label.floating.transform)"
field.label.filled.top = "$ref(field.label.filled.offset)"
field.label.color = "$ref(color.text.secondary)"
field.label.color-focus = "$ref(field.label.color-focus)"
field.transition = "top $ref(motion.interaction), font-size $ref(motion.interaction), color $ref(motion.interaction), background-color $ref(motion.interaction)"
field.outline.legend.margin = "$ref(field.outline.legend-margin)"
field.outline.legend.padding = "$ref(field.outline.legend-padding)"
field.outline.border-width-focus = "3px"
field.outlined.border-color = "$ref(field.outlined.border-color)"
field.outlined.border-color-hover = "$ref(field.outlined.border-color-hover)"
field.outlined.border-color-focus = "$ref(field.outlined.border-color-focus)"
field.outlined.border-color-error = "$ref(field.outlined.border-color-error)"
field.outlined.border-color-warning = "$ref(field.outlined.border-color-warning)"
field.outlined.box-shadow-focus = "$ref(field.outlined.shadow-focus)"
field.outlined.box-shadow-error = "$ref(field.outlined.shadow-error)"
field.outlined.box-shadow-warning = "$ref(field.outlined.shadow-warning)"
field.filled.border-radius = "$ref(field.filled.border-radius)"
field.filled.border-width = "$ref(field.filled.border-width)"
field.filled.background-color = "$ref(field.filled.background-color)"
field.filled.background-color-hover = "$ref(field.filled.background-color-hover)"
field.filled.border-color = "$ref(field.filled.border-color)"
field.filled.border-color-hover = "$ref(field.filled.border-color-hover)"
field.filled.border-color-focus = "$ref(field.filled.border-color-focus)"
field.filled.box-shadow-focus = "$ref(field.filled.shadow-focus)"
field.filled.box-shadow-error = "$ref(field.filled.shadow-error)"
field.filled.box-shadow-warning = "$ref(field.filled.shadow-warning)"
field.color-error = "$ref(color.feedback.error.text)"
field.required.color = "$ref(field.required.color)"
field.required.gap = "$ref(field.required.gap)"
field.color-warning = "$ref(color.feedback.warning.text)"
field.support.line-height = "$ref(field.label.floating.line-height)"
field.support.padding-inline = "$ref(field.support.padding-inline)"
field.color-disabled = "$ref(field.disabled.color)"
field.border-color-disabled = "$ref(field.disabled.border-color)"
field.filled.border-color-disabled = "$ref(field.disabled.filled-border-color)"
field.filled.background-color-disabled = "$ref(field.disabled.filled-background)"

# 验证状态沿用同一条轮廓，焦点加粗不产生外侧光晕。
status.border-color-error = "$ref(color.feedback.error.border)"
status.box-shadow-error = "$ref(field.control.shadow-error)"
status.border-color-warning = "$ref(color.feedback.warning.border)"
status.box-shadow-warning = "$ref(field.control.shadow-warning)"

# 字符计数令牌（认知负荷减轻：让用户不必推算剩余字数）
count.color = "$ref(color.text.tertiary)"
count.font-size = "$ref(typography.caption.font-size)"

# 多行输入的高度由 rows / autoSize 决定，尺寸令牌只控制内边距与排版
size.large.padding = "$ref(field.input.multiline-padding-block) $ref(field.control.padding-inline)"
size.large.font-size = "$ref(field.input.font-size)"
size.large.line-height = "$ref(field.input.line-height)"

size.middle.padding = "$ref(field.input.multiline-padding-block) $ref(field.control.padding-inline)"
size.middle.font-size = "$ref(field.input.font-size)"
size.middle.line-height = "$ref(field.input.line-height)"

size.small.padding = "$ref(field.input.multiline-padding-block) $ref(field.control.padding-inline)"
size.small.font-size = "$ref(field.input.font-size)"
size.small.line-height = "$ref(field.input.line-height)"

size.small.action.width = "$ref(sizing.small.action)"
size.middle.action.width = "$ref(sizing.middle.action)"
size.large.action.width = "$ref(sizing.large.action)"
