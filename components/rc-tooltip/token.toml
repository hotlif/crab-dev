[build]
output = "./src/token.ts"
prefix = "tooltip"
imports = ["@crab-dev/rc-token-semantic"]

[token]
root.background-color = "var(--tooltip-background-color, $ref(color.brand.primary))"
root.color = "var(--tooltip-color, $ref(color.text.on-brand))"
root.padding-inline = "var(--tooltip-padding-inline, var(--tooltip-padding-x, $ref(space.component-gap)))"
root.padding-block = "var(--tooltip-padding-block, var(--tooltip-padding-y, $ref(space.inline-gap)))"
root.font-size = "var(--tooltip-font-size, $ref(font.size.caption))"
root.line-height = "var(--tooltip-line-height, 1.5)"
root.border-radius = "var(--tooltip-border-radius, $ref(radius.md))"
root.max-width = "var(--tooltip-max-width, 250px)"
root.z-index = "var(--tooltip-z-index, $ref(z-index.elevated))"

motion.interaction = "$ref(motion.interaction)"
