[build]
output = "./src/token.ts"
prefix = "pdf-editor"
imports = ["@crab-dev/rc-token-semantic"]

[token]
root.background = "$ref(color.surface.content)"
root.color = "$ref(color.text.primary)"
root.font-family = "$ref(font.family.body)"
root.font-size = "$ref(font.size.body)"
root.line-height = "$ref(font.line-height.body)"
root.height = "min(800px, 85vh)"
root.min-height = "480px"
root.border-radius = "$ref(radius.lg)"
root.border-color = "$ref(color.border.default)"
root.border-width = "1px"
toolbar.background = "$ref(color.surface.container)"
toolbar.min-height = "$ref(size.64)"
toolbar.padding = "$ref(space.section-gap)"
toolbar.gap = "$ref(space.component-gap)"
toolbar.file-name.min-width = "$ref(size.96)"
toolbar.icon.width = "$ref(space.group-gap)"
toolbar.target.width = "$ref(size.touch-target)"
toolbar.icon.color = "$ref(color.text.secondary)"
toolbar.icon.background-color-hover = "color-mix(in oklch, $ref(color.text.secondary) calc($ref(state.opacity.hover) * 100%), transparent)"
toolbar.icon.background-color-focus = "color-mix(in oklch, $ref(color.text.secondary) calc($ref(state.opacity.focus) * 100%), transparent)"
toolbar.icon.background-color-pressed = "color-mix(in oklch, $ref(color.text.secondary) calc($ref(state.opacity.pressed) * 100%), transparent)"
objects.height = "calc($ref(size.40) * 4)"
objects.max-height = "40%"
objects.gap = "$ref(space.component-gap)"
objects.font-size = "$ref(typography.body.medium.font-size)"
objects.line-height = "$ref(typography.body.medium.line-height)"
objects.icon.width = "$ref(space.section-gap)"
panel.width = "240px"
panel.properties.width = "280px"
panel.padding = "$ref(space.section-gap)"
panel.gap = "$ref(space.stack-gap)"
panel.scroll.padding = "$ref(space.inline-gap)"
panel.scrollbar-color = "color-mix(in oklch, $ref(color.text.primary) 50%, transparent)"
panel.heading.font-size = "$ref(font.size.subhead)"
panel.heading.font-weight = "$ref(font.weight.label)"
canvas.background = "$ref(color.surface.overlay)"
canvas.paper.background-color = "oklch(1 0 0)"
canvas.padding = "$ref(space.page-padding)"
selection.color = "$ref(color.selection.border)"
selection.background = "color-mix(in oklch, $ref(color.selection.border) 12%, transparent)"
selection.border-width = "2px"
status.color = "$ref(color.text.secondary)"
status.font-size = "$ref(font.size.caption)"
status.padding-block = "$ref(space.inline-gap)"
status.zoom.width = "calc($ref(size.64) + $ref(space.component-gap))"
status.zoom.height = "$ref(size.32)"
status.zoom.font-size = "$ref(typography.label.large.font-size)"
status.zoom.line-height = "calc($ref(typography.label.large.font-size) * $ref(typography.label.large.line-height))"
root.color-error = "$ref(color.feedback.error.text)"
root.background-color-error = "$ref(color.surface.container)"
thumbnail.height = "200px"
thumbnail.drop.height = "2px"
thumbnail.drop.background-color = "$ref(color.selection.border)"
thumbnail.background-color-dragging = "$ref(color.state.dragged)"
thumbnail.image.width = "160px"
thumbnail.image.height = "152px"
