[build]
output = "./src/token.ts"
prefix = "switch"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]
root.outline-color-focus = "$ref(color.focus.ring)"
root.outline-width-focus = "2px"
root.outline-offset-focus = "2px"
# Crab independent touch targets; visual size props remain unchanged.
root.touch.min-width = "44px"
root.touch.min-height = "44px"
root.line-height = "$ref(font.line-height.body)"
root.opacity-disabled = "$ref(opacity.disabled)"
track.border-width = "1px"

# ─── 通用 ────────────────────────────────────────────────────────────────────

root.transition = "var(--switch-transition, transform $ref(motion.fade), background-color $ref(motion.fade), box-shadow $ref(motion.fade))"


# ─── 通用尺寸 ────────────────────────────────────────────────────────────────

label.gap             = "$ref(space.inline-gap)"
label.font-size       = "$ref(font.size.body)"


# ─── 尺寸 — Large ────────────────────────────────────────────────────────────

size.large.track.width         = "52px"
size.large.track.height        = "28px"
size.large.track.border-radius = "14px"
size.large.handle.width = "var(--switch-size-large-handle-size, 24px)"
size.large.handle.left = "var(--switch-size-large-handle-offset, 2px)"


# ─── 尺寸 — Middle (默认) ────────────────────────────────────────────────

size.middle.track.width         = "44px"
size.middle.track.height        = "22px"
size.middle.track.border-radius = "11px"
size.middle.handle.width = "var(--switch-size-middle-handle-size, 18px)"
size.middle.handle.left = "var(--switch-size-middle-handle-offset, 2px)"


# ─── 尺寸 — Small ────────────────────────────────────────────────────────────

size.small.track.width         = "28px"
size.small.track.height        = "16px"
size.small.track.border-radius = "8px"
size.small.handle.width = "var(--switch-size-small-handle-size, 12px)"
size.small.handle.left = "var(--switch-size-small-handle-offset, 2px)"


# ─── 默认状态（未选中） ──────────────────────────────────────────────────────

track.background-color       = "$ref(color.control.track)"
track.background-color-hover = "$ref(color.control.track-hover)"


# ─── 选中状态 ────────────────────────────────────────────────────────────────

track.background-color-checked       = "var(--switch-checked-track-background-color, $ref(color.brand.primary))"
track.checked.background-color-hover = "var(--switch-checked-track-background-color-hover, $ref(color.brand.primary-hover))"


# ─── 手柄 ────────────────────────────────────────────────────────────────────

handle.background-color = "$ref(color.control.thumb)"
handle.checked.background-color = "var(--switch-handle-background-color, $ref(color.text.on-brand))"
handle.box-shadow       = "$ref(shadow.float)"


# ─── 禁用状态 ────────────────────────────────────────────────────────────────

track.background-color-disabled         = "var(--switch-disabled-track-background-color, $ref(color.background.disabled))"
track.checked.background-color-disabled = "var(--switch-disabled-checked-track-background-color, $ref(color.background.disabled))"
handle.background-color-disabled        = "var(--switch-disabled-handle-background-color, $ref(color.control.thumb))"


# ─── 标签 ────────────────────────────────────────────────────────────────────

label.color          = "$ref(color.text.primary)"
label.color-disabled = "$ref(color.text.disabled)"
