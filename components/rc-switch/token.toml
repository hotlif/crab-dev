[build]
output = "./src/token.ts"
prefix = "switch"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]
root.outline-color-focus = "$ref(color.focus.ring)"
root.outline-width-focus = "2px"
root.outline-offset-focus = "2px"
# The visual track and the 48px interaction target are independent.
root.touch.min-width = "$ref(size.touch-target)"
root.touch.min-height = "$ref(size.touch-target)"
root.line-height = "$ref(typography.body.medium.line-height)"
root.min-height = "$ref(size.touch-target)"
root.opacity-disabled = "$ref(opacity.disabled)"
track.border-width = "$ref(border.toggle.width)"

# ─── 通用 ────────────────────────────────────────────────────────────────────

root.transition = "transform $ref(motion.spatial.fast), translate $ref(motion.spatial.fast), scale $ref(motion.spatial.fast), background-color $ref(motion.interaction), box-shadow $ref(motion.interaction)"


# ─── 通用尺寸 ────────────────────────────────────────────────────────────────

label.gap             = "$ref(space.inline-gap)"
label.font-size = "$ref(typography.body.medium.font-size)"


# ─── 尺寸 — Large ────────────────────────────────────────────────────────────

size.large.track.width = "$ref(sizing.large.toggle.track-width)"
size.large.track.height = "$ref(sizing.large.toggle.track-height)"
size.large.track.border-radius = "$ref(shape.full)"
size.large.handle.width = "$ref(sizing.large.toggle.handle-width)"
size.large.handle.left = "$ref(sizing.large.toggle.handle-inset)"


# ─── 尺寸 — Middle (默认) ────────────────────────────────────────────────

size.middle.track.width = "$ref(sizing.middle.toggle.track-width)"
size.middle.track.height = "$ref(sizing.middle.toggle.track-height)"
size.middle.track.border-radius = "$ref(shape.full)"
size.middle.handle.width = "$ref(sizing.middle.toggle.handle-width)"
size.middle.handle.left = "$ref(sizing.middle.toggle.handle-inset)"


# ─── 尺寸 — Small ────────────────────────────────────────────────────────────

size.small.track.width = "$ref(sizing.small.toggle.track-width)"
size.small.track.height = "$ref(sizing.small.toggle.track-height)"
size.small.track.border-radius = "$ref(shape.full)"
size.small.handle.width = "$ref(sizing.small.toggle.handle-width)"
size.small.handle.left = "$ref(sizing.small.toggle.handle-inset)"


# ─── 默认状态（未选中） ──────────────────────────────────────────────────────

track.background-color = "$ref(color.surface.highest)"
track.background-color-hover = "$ref(color.surface.highest)"


# ─── 选中状态 ────────────────────────────────────────────────────────────────

track.background-color-checked       = "$ref(color.brand.primary)"
track.checked.background-color-hover = "$ref(color.brand.primary)"


# ─── 手柄 ────────────────────────────────────────────────────────────────────

handle.background-color = "$ref(color.control.toggle-thumb)"
handle.checked.background-color = "$ref(toggle.handle.selected-color)"
handle.box-shadow = "$ref(toggle.handle.shadow)"


# ─── 禁用状态 ────────────────────────────────────────────────────────────────

track.background-color-disabled = "color-mix(in oklch, $ref(color.surface.highest) calc($ref(toggle.disabled.track-opacity) * 100%), transparent)"
track.checked.background-color-disabled = "color-mix(in oklch, $ref(color.text.primary) calc($ref(toggle.disabled.track-opacity) * 100%), transparent)"
track.border-color-disabled = "color-mix(in oklch, $ref(color.text.primary) calc($ref(toggle.disabled.track-opacity) * 100%), transparent)"
handle.background-color-disabled = "$ref(toggle.disabled.handle-color)"
handle.checked.background-color-disabled = "$ref(toggle.disabled.selected-handle-color)"


# ─── 标签 ────────────────────────────────────────────────────────────────────

label.color          = "$ref(color.text.primary)"
label.color-disabled = "$ref(color.text.primary)"
track.border-color = "$ref(color.border.default)"
handle.unchecked.scale = "$ref(toggle.handle.unchecked-scale)"
handle.pressed.scale = "$ref(toggle.handle.pressed-scale)"
handle.interactive.background-color = "$ref(toggle.handle.interactive-color)"
handle.checked.interactive.background-color = "$ref(toggle.handle.selected-interactive-color)"
track.border-color-error = "$ref(color.border.error)"
track.background-color-error = "$ref(color.feedback.error.solid)"
handle.background-color-error = "$ref(color.feedback.error.on-solid)"
track.state-layer.background-color-hover = "color-mix(in oklch, $ref(color.text.primary) calc($ref(state.opacity.hover) * 100%), transparent)"
track.state-layer.background-color-active = "color-mix(in oklch, $ref(color.text.primary) calc($ref(state.opacity.pressed) * 100%), transparent)"
track.checked.state-layer.background-color-hover = "color-mix(in oklch, $ref(color.brand.primary) calc($ref(state.opacity.hover) * 100%), transparent)"
track.checked.state-layer.background-color-active = "color-mix(in oklch, $ref(color.brand.primary) calc($ref(state.opacity.pressed) * 100%), transparent)"
track.halo.width = "$ref(size.toggle-state-layer)"
track.halo.left = "-5px"
track.halo.translate-checked = "14px"
