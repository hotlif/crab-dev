# Published ESM and real extracted CSS, without the ordinary suite's css mock.
[test]
environment = "browser"
include = ["dial-labels.test.tsx", "field-position.test.tsx", "viewport-fallback.test.tsx"]
timeout_ms = 15000
leaks = "error"

[test.react]
strict_mode = false
cleanup = true
act_warnings = "error"

[test.network]
mode = "deny"
allow_hosts = []

[test.coverage]
enabled = true
reporters = ["text", "lcov"]
