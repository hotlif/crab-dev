[build]
output = "./src/token.ts"
prefix = "date-picker"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

root.background-color-selected = "$ref(color.brand.primary)"
root.color-selected = "$ref(color.text.on-brand)"
cell.background-color-hover = "$ref(color.state.hover)"
cell.color-hover = "$ref(color.text.primary)"
cell.color-disabled = "$ref(color.text.disabled)"

header.padding = "$ref(space.section-gap) $ref(space.component-gap)"
header.cell.height = "40px"
header.font-size = "$ref(typography.body.large.font-size)"
header.line-height = "1.4"
header.font-weight = "400"

cell.padding = "0px"
cell.border-radius = "$ref(shape.full)"
cell.content.width = "$ref(size.40)"
cell.font-size = "$ref(typography.label.font-size)"
cell.font-weight = "400"
cell.transition = "$ref(motion.interaction)"

action.bar.margin-top = "$ref(space.component-gap)"
action.bar.gap = "$ref(space.component-gap)"

panel.font-size = "$ref(typography.label.font-size)"
panel.padding = "$ref(space.section-gap)"
panel.narrow.padding = "$ref(space.component-gap)"
panel.max-width = "calc(100vw - $ref(size.48))"
navigation.width = "$ref(size.48)"
timezone.font-size = "$ref(typography.label.medium.font-size)"

out-of-range.opacity = "$ref(opacity.disabled)"
icon.opacity = "$ref(opacity.secondary)"
icon.opacity-hover = "$ref(opacity.hover)"
field.action.width = "$ref(sizing.middle.action)"
field.action.touch.width = "$ref(size.touch-target)"
field.action.color = "$ref(color.text.secondary)"
field.icon.width = "$ref(space.group-gap)"
timezone.opacity = "$ref(opacity.tertiary)"
panel.background-color = "$ref(color.surface.high)"
panel.border-radius = "$ref(shape.extra-large)"
cell.touch.width = "$ref(size.48)"

# M3 baseline Time picker (input / vertical dial), dp mapped to CSS px.
time.padding = "$ref(space.dialog-padding)"
time.input.width = "$ref(size.96)"
time.input.height = "calc($ref(size.48) + $ref(space.group-gap))"
time.input.gap = "$ref(space.component-gap)"
time.input.font-size = "$ref(typography.display.medium.font-size)"
time.input.font-weight = "$ref(typography.display.medium.font-weight)"
time.input.line-height = "$ref(typography.display.medium.line-height)"
time.input.border-radius = "$ref(shape.small)"
time.input.background = "$ref(color.surface.highest)"
time.input.color = "$ref(color.text.primary)"
time.input.background-selected = "$ref(color.brand.container)"
time.input.color-selected = "$ref(color.brand.on-container)"
time.input.outline-color = "$ref(color.brand.primary)"
time.input.outline-width = "2px"
time.input.color-error = "$ref(color.border.error)"
time.section.gap = "$ref(space.group-gap)"
time.title.color = "$ref(color.text.secondary)"
time.title.font-size = "$ref(typography.label.medium.font-size)"
time.title.font-weight = "$ref(typography.label.medium.font-weight)"
time.title.line-height = "$ref(typography.label.medium.line-height)"
time.support.color = "$ref(color.text.secondary)"
time.support.font-size = "$ref(typography.body.small.font-size)"
time.support.line-height = "$ref(typography.body.small.line-height)"
time.support.gap = "$ref(space.inline-gap)"
time.separator.width = "$ref(space.group-gap)"
time.dial.width = "calc($ref(size.64) * 4)"
time.dial.field.width = "114px"
time.dial.field.height = "calc($ref(size.40) * 2)"
time.dial.font-size = "$ref(typography.display.large.font-size)"
time.dial.line-height = "$ref(typography.display.large.line-height)"
time.dial.label.font-size = "$ref(typography.body.large.font-size)"
time.dial.handle.width = "$ref(size.48)"
time.dial.track.width = "2px"
time.dial.background-selected = "$ref(color.brand.primary)"
time.dial.color-selected = "$ref(color.text.on-brand)"
time.period.width = "calc($ref(size.48) + $ref(space.inline-gap))"
time.period.color = "$ref(color.text.secondary)"
time.period.background-selected = "$ref(color.tertiary.container)"
time.period.color-selected = "$ref(color.tertiary.on-container)"
time.period.outline-color = "$ref(color.border.default)"
time.period.outline-width = "1px"
time.period.font-size = "$ref(typography.title.medium.font-size)"
time.period.font-weight = "$ref(typography.title.medium.font-weight)"
time.opacity-hover = "$ref(state.opacity.hover)"
time.pressed.opacity = "$ref(state.opacity.pressed)"
time.action.width = "$ref(size.48)"
