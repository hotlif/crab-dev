[build]
output = "./src/token.ts"
prefix = "date-picker"

[token]

selected.background.color = "oklch(0.2855 0.0113 271)"
selected.text.color = "oklch(1 0 0)"
cell.background.color-hover = "oklch(0.2855 0.0113 271 / 75%)"
cell.text.color-hover = "oklch(1 0 0)"

header.padding = "16px 8px"
header.cell.height = "40px"
header.font.size = "12px"
header.font.weight = "400"

cell.padding = "3px 4px"
cell.border.radius = "4px"
cell.content.size = "24px"
cell.font.size = "14px"
cell.font.weight = "400"
cell.transition = "background-color 0.2s, color 0.2s"

action.bar.margin.top = "0.5rem"
action.bar.gap = "0.5rem"

panel.font.size = "14px"
timezone.font.size = "10px"

opacity.out-of-range = "0.3"
opacity.icon = "0.5"
opacity.icon-hover = "0.8"
opacity.timezone = "0.6"