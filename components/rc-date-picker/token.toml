[build]
output = "./src/token.ts"
prefix = "date-picker"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

root.background-color-selected = "var(--date-picker-background-color-selected, var(--date-picker-selected-background-color, $ref(color.brand.primary)))"
root.color-selected = "var(--date-picker-color-selected, var(--date-picker-selected-color, var(--date-picker-selected-text-color, $ref(color.text.on-brand))))"
cell.background-color-hover = "$ref(color.state.hover)"
cell.color-hover = "var(--date-picker-cell-text-color-hover, $ref(color.text.primary))"
cell.color-disabled = "$ref(color.text.disabled)"

header.padding = "$ref(space.section-gap) $ref(space.component-gap)"
header.cell.height = "40px"
header.font-size = "$ref(typography.body.large.font-size)"
header.line-height = "1.4"
header.font-weight = "400"

cell.padding = "0px"
cell.border-radius = "$ref(shape.full)"
cell.content.width = "var(--date-picker-cell-content-size, $ref(size.40))"
cell.font-size = "$ref(typography.label.font-size)"
cell.font-weight = "400"
cell.transition = "$ref(motion.interaction)"

action.bar.margin-top = "$ref(space.component-gap)"
action.bar.gap = "$ref(space.component-gap)"

panel.font-size = "$ref(typography.label.font-size)"
panel.padding = "$ref(space.section-gap)"
panel.narrow.padding = "$ref(space.component-gap)"
panel.max-width = "calc(100vw - $ref(size.48))"
navigation.width = "var(--date-picker-navigation-size, $ref(size.48))"
timezone.font-size = "$ref(typography.label.medium.font-size)"

out-of-range.opacity = "var(--date-picker-opacity-out-of-range, $ref(opacity.disabled))"
icon.opacity = "var(--date-picker-opacity-icon, $ref(opacity.secondary))"
icon.opacity-hover = "var(--date-picker-opacity-icon-hover, $ref(opacity.hover))"
timezone.opacity = "var(--date-picker-opacity-timezone, $ref(opacity.tertiary))"
panel.background-color = "$ref(color.surface.high)"
panel.border-radius = "$ref(shape.extra-large)"
cell.touch.width = "$ref(size.48)"

# Material TimeInput：小时与分钟使用可键盘编辑的 Filled 数字字段；秒为明确标注的企业扩展。
time.input.width = "80px"
time.input.gap = "$ref(space.component-gap)"
time.section.gap = "$ref(space.section-gap)"
time.title.color = "$ref(color.text.primary)"
time.title.font-size = "$ref(typography.title.large.font-size)"
time.title.font-weight = "$ref(typography.title.large.font-weight)"
time.title.line-height = "$ref(typography.title.large.line-height)"
time.support.color = "$ref(color.text.secondary)"
time.support.font-size = "$ref(typography.body.small.font-size)"
time.support.line-height = "$ref(typography.body.small.line-height)"
