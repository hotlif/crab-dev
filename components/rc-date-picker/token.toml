[build]
output = "./src/token.ts"
prefix = "picker"

[token.color]
selected-background = "oklch(0.2855 0.0113 271)"
selected-text = "oklch(1 0 0)"
cell-hover-background = "oklch(0.2855 0.0113 271 / 75%)"
cell-hover-text = "oklch(1 0 0)"

[token.dimension]
header-padding = "16px 8px"
header-cell-height = "40px"
cell-padding = "3px 4px"
cell-border-radius = "4px"
cell-content-size = "24px"
action-bar-margin-top = "0.5rem"
action-bar-gap = "0.5rem"

[token.typography]
panel-font-size = "14px"
header-font-size = "12px"
header-font-weight = "400"
cell-font-size = "14px"
cell-font-weight = "400"
timezone-font-size = "10px"

[token.motion]
cell-transition = "background-color 0.2s, color 0.2s"

[token.elevation]

[token.border]

[token.opacity]
out-of-range = "0.3"
icon = "0.5"
icon-hover = "0.8"
timezone = "0.6"