[build]
output = "./src/token.ts"
prefix = "masonry"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

# ─── 通用 ────────────────────────────────────────────────────────────────────

root.transition = "var(--masonry-transition, transform 200ms cubic-bezier(0.4, 0, 0.2, 1), opacity 200ms cubic-bezier(0.4, 0, 0.2, 1))"

# ─── 间距 ────────────────────────────────────────────────────────────────────

root.gap = "var(--masonry-gutter, $ref(space.component-gap))"
