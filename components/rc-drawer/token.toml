[build]
output = "./src/token.ts"
prefix = "drawer"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

overlay.background-color = "$ref(color.background.overlay)"
root.background-color = "$ref(color.surface.low)"
root.box-shadow = "$ref(shadow.overlay)"

size.small.width   = "280px"
size.medium.width  = "420px"
size.large.width   = "560px"

size.small.height  = "240px"
size.medium.height = "360px"
size.large.height  = "480px"

header.padding              = "$ref(space.card-padding) $ref(space.dialog-padding)"
header.border-color         = "$ref(color.border.subtle)"
header.title.font-weight    = "$ref(typography.title.large.emphasized.font-weight)"
header.title.font-size      = "$ref(typography.title.font-size)"
header.title.color          = "$ref(color.text.primary)"
header.title.line-height    = "$ref(typography.title.line-height)"
header.title.letter-spacing = "-0.01em"

body.padding              = "$ref(space.card-padding) $ref(space.dialog-padding)"

footer.padding            = "$ref(space.stack-gap) $ref(space.dialog-padding)"
footer.border-color       = "$ref(color.border.subtle)"
footer.gap                = "$ref(space.component-gap)"

close.width               = "32px"
close.icon.width          = "16px"
close.color               = "$ref(color.text.secondary)"
close.color-hover         = "$ref(color.text.primary)"
close.background-color-hover = "$ref(color.state.hover)"
close.border-radius       = "$ref(shape.control)"

panel.animation-duration       = "$ref(motion.sheet.enter-duration)"
panel.animation-timing-function = "$ref(motion.sheet.easing)"

motion.fade.transition = "$ref(motion.fade)"
motion.expand.transition = "var(--drawer-panel-animation-duration, $ref(motion.sheet.enter-duration)) var(--drawer-panel-animation-timing-function, $ref(motion.sheet.easing))"
motion.exit.transition = "var(--drawer-panel-animation-duration, $ref(motion.sheet.exit-duration)) var(--drawer-panel-animation-timing-function, $ref(motion.sheet.easing))"
motion.interaction.transition = "$ref(motion.interaction)"
motion.spatial.transition = "$ref(motion.spatial.fast)"
root.border-radius = "$ref(shape.large)"
