[build]
output = "./src/token.ts"
prefix = "card"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

# ─── 表面 ────────────────────────────────────────────────────────────────────
# 卡片底面：elevated / outlined 共用 surface 白底，filled 用弱灰底。

surface.background-color = "var(--card-surface-background, $ref(color.background.surface))"

# ─── 变体 — outlined / filled ────────────────────────────────────────────────

root.border-color = "var(--card-border-color, $ref(color.border.default))"
root.border-color-hover = "var(--card-border-color-hover, $ref(color.border.hover))"

filled.background-color       = "var(--card-filled-background, $ref(color.background.hover-subtle))"
filled.background-color-hover = "var(--card-filled-background-hover, $ref(color.background.active-subtle))"

# ─── 拟物纵深 elevation 三档 ─────────────────────────────────────────────────
# rest 近乎平贴；hover 轻抬一档（克制的悬浮反馈）；active 按压回落。
# L2 无多档阴影，此处为组件级自建阶梯。

root.box-shadow = "var(--card-box-shadow, var(--card-elevation-rest, $ref(shadow.float)))"
root.box-shadow-hover = "var(--card-box-shadow-hover, var(--card-elevation-hover, $ref(shadow.overlay)))"
root.box-shadow-active = "var(--card-box-shadow-active, var(--card-elevation-active, $ref(shadow.float)))"

# ─── 浮起位移 ────────────────────────────────────────────────────────────────

root.transform-hover = "var(--card-root-translate-y-hover, translateY(var(--card-root-translate-y-hover, var(--card-translate-y-hover, var(--card-lift-hover, -2px)))))"
root.transform-active = "var(--card-root-translate-y-active, translateY(var(--card-root-translate-y-active, var(--card-translate-y-active, var(--card-lift-active, 0)))))"

# ─── 尺寸 — Large ────────────────────────────────────────────────────────────

size.large.padding    = "$ref(space.dialog-padding)"
size.large.gap        = "$ref(space.stack-gap)"
size.large.border-radius     = "var(--card-size-large-radius, $ref(radius.xl))"
size.large.title.font-size = "var(--card-size-large-title-size, $ref(font.size.heading))"

# ─── 尺寸 — Middle（默认）────────────────────────────────────────────────────

size.middle.padding    = "$ref(space.card-padding)"
size.middle.gap        = "$ref(space.stack-gap)"
size.middle.border-radius     = "var(--card-size-middle-radius, $ref(radius.xl))"
size.middle.title.font-size = "var(--card-size-middle-title-size, $ref(font.size.subhead))"

# ─── 尺寸 — Small ────────────────────────────────────────────────────────────

size.small.padding    = "$ref(space.section-gap)"
size.small.gap        = "$ref(space.component-gap)"
size.small.border-radius     = "var(--card-size-small-radius, $ref(radius.lg))"
size.small.title.font-size = "var(--card-size-small-title-size, $ref(font.size.body))"

# ─── 标题区 ──────────────────────────────────────────────────────────────────

header.title.color = "$ref(color.text.primary)"
header.title.font-weight = "var(--card-header-title-weight, $ref(font.weight.heading))"

# ─── 正文区 ──────────────────────────────────────────────────────────────────
# L2 未定义 line-height 语义令牌，正文行高取静态 1.6。

body.color       = "$ref(color.text.primary)"
body.font-size   = "$ref(font.size.body)"
body.line-height = "1.6"

# ─── 封面 ────────────────────────────────────────────────────────────────────
# background 作图片加载前的占位底色。

cover.background-color = "var(--card-cover-background, $ref(color.background.hover-subtle))"

# ─── 操作区（footer）─────────────────────────────────────────────────────────
# L2 无 divider 令牌，分割线复用 border.default（库内既定 workaround）。

footer.divider.border-color = "var(--card-footer-divider-color, $ref(color.border.default))"
footer.padding-block     = "var(--card-footer-padding-y, $ref(space.component-gap))"
footer.gap           = "$ref(space.component-gap)"

# ─── Meta（头像 + 标题 + 描述）───────────────────────────────────────────────

meta.gap          = "$ref(space.stack-gap)"
meta.text.gap = "$ref(space.inline-gap)"
meta.title.color = "$ref(color.text.primary)"
meta.title.font-weight = "var(--card-meta-title-weight, $ref(font.weight.label))"
meta.title.font-size = "var(--card-meta-title-size, $ref(font.size.body))"
meta.desc.color = "$ref(color.text.secondary)"
meta.desc.font-size = "var(--card-meta-desc-size, $ref(font.size.caption))"

# ─── 动效 ────────────────────────────────────────────────────────────────────
# 浮起 / 封面缩放走 easeOutExpo（快出缓收，丝滑收尾）；时长略长于 L2 interaction，
# 让阴影展开有可感知的过渡但不拖沓。

root.transition  = "var(--card-motion-lift, transform 200ms cubic-bezier(0.16, 1, 0.3, 1), box-shadow 200ms cubic-bezier(0.16, 1, 0.3, 1), border-color 200ms cubic-bezier(0.16, 1, 0.3, 1))"
cover.transition = "var(--card-motion-cover, transform 320ms cubic-bezier(0.16, 1, 0.3, 1))"

# ─── 焦点环 ──────────────────────────────────────────────────────────────────

ring.color-focus = "var(--card-focus-ring-color, $ref(color.focus.ring))"

# ─── 禁用 ────────────────────────────────────────────────────────────────────

root.opacity-disabled = "var(--card-opacity-disabled, var(--card-disabled-opacity, $ref(opacity.disabled)))"
