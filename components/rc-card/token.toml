[build]
output = "./src/token.ts"
prefix = "card"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

# ─── 表面 ────────────────────────────────────────────────────────────────────
# Material Web：elevated 使用 surface-container-low，outlined 使用 surface。

surface.background-color = "$ref(color.surface.content)"
elevated.background-color = "var(--card-surface-background-color, $ref(color.surface.low))"

# ─── 变体 — outlined / filled ────────────────────────────────────────────────

root.border-color = "$ref(color.border.subtle)"
root.border-color-hover = "$ref(color.border.hover)"

filled.background-color = "$ref(color.surface.highest)"
filled.background-color-hover = "$ref(color.state.pressed)"

# M3 elevation：elevated 1→2→1；filled / outlined 0→1→0。

root.box-shadow = "$ref(shadow.control)"
root.box-shadow-hover = "$ref(shadow.float)"
root.box-shadow-active = "$ref(shadow.control)"
filled.box-shadow-hover = "$ref(shadow.control)"
filled.box-shadow-active = "none"
outlined.box-shadow-hover = "$ref(shadow.control)"
outlined.box-shadow-active = "none"
outlined.border-color-focus = "$ref(color.text.primary)"
state-layer.color = "$ref(color.text.primary)"
state-layer.opacity-hover = "$ref(state.opacity.hover)"
state-layer.opacity-focus = "$ref(state.opacity.focus)"
state-layer.opacity-pressed = "$ref(state.opacity.pressed)"
state-layer.transition = "opacity $ref(motion.interaction)"

# ─── 浮起位移 ────────────────────────────────────────────────────────────────

root.transform-hover = "translateY(0px)"
root.transform-active = "translateY(0px)"

# ─── 尺寸 — Large ────────────────────────────────────────────────────────────

size.large.padding = "$ref(sizing.large.padding)"
size.large.gap = "$ref(sizing.large.gap)"
size.large.border-radius     = "$ref(shape.card)"
size.large.title.font-size = "$ref(font.size.heading)"

# ─── 尺寸 — Middle（默认）────────────────────────────────────────────────────

size.middle.padding = "$ref(sizing.middle.padding)"
size.middle.gap = "$ref(sizing.middle.gap)"
size.middle.border-radius     = "$ref(shape.card)"
size.middle.title.font-size = "$ref(font.size.subhead)"

# ─── 尺寸 — Small ────────────────────────────────────────────────────────────

size.small.padding = "$ref(sizing.small.padding)"
size.small.gap = "$ref(sizing.small.gap)"
size.small.border-radius     = "$ref(shape.card)"
size.small.title.font-size = "$ref(typography.body.font-size)"

# ─── 标题区 ──────────────────────────────────────────────────────────────────

header.title.color = "$ref(color.text.primary)"
header.title.font-weight = "$ref(typography.title.large.emphasized.font-weight)"

# ─── 正文区 ──────────────────────────────────────────────────────────────────
# L2 未定义 line-height 语义令牌，正文行高取静态 1.6。

body.color       = "$ref(color.text.primary)"
body.font-size   = "$ref(typography.body.font-size)"
body.font-family = "$ref(typography.body.font-family)"
body.line-height = "$ref(typography.body.line-height)"

# ─── 封面 ────────────────────────────────────────────────────────────────────
# background 作图片加载前的占位底色。

cover.background-color = "$ref(color.background.hover-subtle)"

# ─── 操作区（footer）─────────────────────────────────────────────────────────
# 内容分组使用弱边框，避免与可交互控件争夺视觉权重。

footer.divider.border-color = "$ref(color.border.subtle)"
footer.padding-block     = "$ref(space.component-gap)"
footer.gap           = "$ref(space.component-gap)"

# ─── Meta（头像 + 标题 + 描述）───────────────────────────────────────────────

meta.gap          = "$ref(space.stack-gap)"
meta.text.gap = "$ref(space.inline-gap)"
meta.title.color = "$ref(color.text.primary)"
meta.title.font-weight = "$ref(typography.label.font-weight)"
meta.title.font-size = "$ref(typography.body.font-size)"
meta.desc.color = "$ref(color.text.secondary)"
meta.desc.font-size = "$ref(typography.caption.font-size)"

# ─── 动效 ────────────────────────────────────────────────────────────────────
# 状态反馈统一 interaction，封面缩放使用 expand。

root.transition  = "transform $ref(motion.spatial.fast), box-shadow $ref(motion.interaction), border-color $ref(motion.interaction), background-color $ref(motion.interaction)"
cover.transition = "transform $ref(motion.expand)"

# ─── 焦点环 ──────────────────────────────────────────────────────────────────

ring.color-focus = "$ref(color.focus.ring)"

# ─── 禁用 ────────────────────────────────────────────────────────────────────

root.opacity-disabled = "$ref(opacity.disabled)"

interaction.touch.min-width = "$ref(size.touch-target)"
interaction.touch.min-height = "$ref(size.touch-target)"
interaction.outline-color-focus = "$ref(color.focus.ring)"
interaction.outline-width-focus = "2px"
interaction.outline-offset-focus = "2px"
