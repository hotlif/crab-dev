[docs]
source_dir = "docs"
title = "Card 卡片"
description = "卡片容器, 用于承载标题、封面、内容与操作的通用信息单元"
locale = "zh-CN"

[test]
setup = ["../../test/wake-css.setup.ts"]
environment = "dom"
include = ["src/**/*.{test,spec}.{js,mjs,cjs,jsx,ts,mts,cts,tsx}"]
exclude = ["**/node_modules/**", "**/coverage/**", "**/esm/**", "**/cjs/**", "**/declarations/**"]
timeout_ms = 5000
leaks = "error"

[test.react]
strict_mode = false
cleanup = true
act_warnings = "error"
test_id_attribute = "data-testid"

[test.network]
mode = "deny"
allow_hosts = []

[test.coverage]
enabled = true
reporters = ["text", "lcov"]
