[build]
output = "./src/token.ts"
prefix = "checkbox"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

# ─── 通用 ────────────────────────────────────────────────────────────────────

transition = "background-color 100ms cubic-bezier(0.4, 0, 0.2, 1), border-color 100ms cubic-bezier(0.4, 0, 0.2, 1), box-shadow 100ms cubic-bezier(0.4, 0, 0.2, 1)"


# ─── 通用尺寸 ────────────────────────────────────────────────────────────────

label.gap            = "$ref(space.inline-gap)"
group.gap           = "$ref(space.component-gap)"


# ─── 尺寸 — Large ────────────────────────────────────────────────────────────

size.large.box.size          = "20px"
size.large.box.border.radius = "$ref(radius.sm)"
size.large.icon.size         = "14px"
size.large.label.font.size   = "$ref(font.size.heading)"
size.large.indeterminate.width  = "10px"
size.large.indeterminate.height = "2px"


# ─── 尺寸 — Middle (默认) ────────────────────────────────────────────────

size.middle.box.size          = "16px"
size.middle.box.border.radius = "$ref(radius.sm)"
size.middle.icon.size         = "12px"
size.middle.label.font.size   = "$ref(font.size.body)"
size.middle.indeterminate.width  = "8px"
size.middle.indeterminate.height = "2px"


# ─── 尺寸 — Small ────────────────────────────────────────────────────────────

size.small.box.size          = "14px"
size.small.box.border.radius = "$ref(radius.sm)"
size.small.icon.size         = "10px"
size.small.label.font.size   = "$ref(font.size.body)"
size.small.indeterminate.width  = "6px"
size.small.indeterminate.height = "2px"


# ─── 默认状态 ────────────────────────────────────────────────────────────────

border.width         = "1px"
border.style         = "solid"
border.color         = "$ref(color.border.default)"
border.color-hover   = "$ref(color.border.hover)"
background.color     = "$ref(color.background.surface)"


# ─── 选中状态 ────────────────────────────────────────────────────────────────

checked.background.color       = "$ref(color.brand.primary)"
checked.background.color-hover = "$ref(color.brand.primary-hover)"
checked.border.color           = "$ref(color.brand.primary)"
checked.icon.color             = "$ref(color.text.on-brand)"


# ─── 半选状态 ────────────────────────────────────────────────────────────────

indeterminate.background.color = "$ref(color.brand.primary)"
indeterminate.border.color     = "$ref(color.brand.primary)"
indeterminate.icon.color       = "$ref(color.text.on-brand)"


# ─── 禁用状态 ────────────────────────────────────────────────────────────────

disabled.background.color = "$ref(color.background.disabled)"
disabled.border.color     = "$ref(color.border.default)"
disabled.icon.color       = "$ref(color.text.disabled)"


# ─── 标签 ────────────────────────────────────────────────────────────────────

label.color          = "$ref(color.text.primary)"
label.color-disabled = "$ref(color.text.disabled)"
