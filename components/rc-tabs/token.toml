[build]
output = "./src/token.ts"
prefix = "tabs"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

# ─── 容器 ────────────────────────────────────────────────────────────────────
root.font-weight = "$ref(typography.label.font-weight)"
root.line-height = "$ref(typography.title.small.line-height)"
bar.gap = "$ref(space.inline-gap)"
bar.border-color = "$ref(color.border.subtle)"
content.padding-top = "$ref(space.stack-gap)"

# ─── 尺寸 · 高度 / 字号 / 内边距 ─────────────────────────────────────────────
size.small.height = "$ref(sizing.small.item)"
size.small.font-size = "$ref(typography.label.large.font-size)"
size.small.padding-inline = "12px"

size.medium.height = "$ref(size.48)"
size.medium.font-size = "$ref(typography.label.large.font-size)"
size.medium.padding-inline = "16px"

size.large.height = "$ref(size.64)"
size.large.font-size = "$ref(typography.label.large.font-size)"
size.large.padding-inline = "20px"

# ─── 标签 · 颜色 ────────────────────────────────────────────────────────────
item.color = "$ref(color.text.secondary)"
item.color-hover = "$ref(color.text.primary)"
item.color-active = "$ref(color.brand.primary)"
item.color-disabled = "$ref(color.text.disabled)"
item.opacity-disabled = "$ref(opacity.disabled)"
state-layer.opacity-hover = "$ref(state.opacity.hover)"
state-layer.opacity-focus = "$ref(state.opacity.focus)"
state-layer.opacity-pressed = "$ref(state.opacity.pressed)"
state-layer.transition = "opacity $ref(motion.interaction)"

item.icon.gap = "$ref(space.inline-gap)"

# ─── Line 类型 ───────────────────────────────────────────────────────────────
indicator.height = "3px"
indicator.min-width = "$ref(space.group-gap)"
indicator.color = "$ref(color.brand.primary)"
indicator.transition = "transform $ref(motion.spatial.fast)"

# ─── Card 类型 ───────────────────────────────────────────────────────────────
card.background-color = "transparent"
card.background-color-hover = "$ref(color.state.hover)"
card.background-color-active = "$ref(color.surface.content)"
card.border-color = "$ref(color.border.subtle)"
card.border-radius = "$ref(shape.control)"

# ─── Pill 类型 ───────────────────────────────────────────────────────────────
pill.background-color-hover = "$ref(color.state.hover)"
pill.background-color-active = "$ref(color.secondary.container)"
pill.color-active = "$ref(color.secondary.on-container)"
pill.border-radius = "$ref(radius.pill)"

# ─── 关闭按钮 ────────────────────────────────────────────────────────────────
close.color = "$ref(color.text.tertiary)"
close.color-hover = "$ref(color.text.primary)"
close.width = "16px"
close.touch.width = "$ref(size.32)"
close.gap = "$ref(space.inline-gap)"
close.border-radius = "$ref(radius.sm)"
close.background-color-hover = "$ref(color.state.pressed)"

# ─── 焦点环 ──────────────────────────────────────────────────────────────────
tab.outline-color-focus = "$ref(color.focus.ring)"
tab.outline-width-focus = "2px"
tab.outline-offset-focus = "-2px"
close.outline-color-focus = "$ref(color.focus.ring)"
close.outline-width-focus = "2px"
close.outline-offset-focus = "1px"

# ─── 动效 ────────────────────────────────────────────────────────────────────
motion.color = "color $ref(motion.interaction), background-color $ref(motion.interaction)"

interaction.touch.min-width = "$ref(size.touch-target)"
interaction.touch.min-height = "$ref(size.touch-target)"
interaction.outline-color-focus = "$ref(color.focus.ring)"
interaction.outline-width-focus = "2px"
interaction.outline-offset-focus = "2px"
interaction.transition = "$ref(motion.interaction)"
indicator.border-radius = "$ref(shape.full)"
