[build]
output = "./src/token.ts"
prefix = "tabs"
imports = [
    "@crab-dev/rc-token-semantic"
]

[token]

# ─── 容器 ────────────────────────────────────────────────────────────────────
root.font-weight = "var(--tabs-font-weight, $ref(font.weight.label))"
bar.gap = "$ref(space.inline-gap)"
bar.border-color = "$ref(color.border.subtle)"
content.padding-top = "$ref(space.stack-gap)"

# ─── 尺寸 · 高度 / 字号 / 内边距 ─────────────────────────────────────────────
size.small.height = "32px"
size.small.font-size = "$ref(font.size.caption)"
size.small.padding-inline = "var(--tabs-size-small-padding-x, 12px)"

size.medium.height = "40px"
size.medium.font-size = "$ref(font.size.body)"
size.medium.padding-inline = "var(--tabs-size-medium-padding-x, 16px)"

size.large.height = "48px"
size.large.font-size = "$ref(font.size.subhead)"
size.large.padding-inline = "var(--tabs-size-large-padding-x, 20px)"

# ─── 标签 · 颜色 ────────────────────────────────────────────────────────────
item.color = "$ref(color.text.secondary)"
item.color-hover = "$ref(color.text.primary)"
item.color-active = "$ref(color.text.primary)"
item.color-disabled = "$ref(color.text.disabled)"

item.icon.gap = "$ref(space.inline-gap)"

# ─── Line 类型 ───────────────────────────────────────────────────────────────
indicator.height = "2px"
indicator.color = "$ref(color.brand.primary)"
indicator.transition = "transform $ref(motion.interaction), width $ref(motion.interaction)"

# ─── Card 类型 ───────────────────────────────────────────────────────────────
card.background-color = "var(--tabs-card-background, transparent)"
card.background-color-hover = "var(--tabs-card-background-hover, $ref(color.background.hover-subtle))"
card.background-color-active = "var(--tabs-card-background-active, $ref(color.background.surface))"
card.border-color = "$ref(color.border.subtle)"
card.border-radius = "$ref(radius.md)"

# ─── Pill 类型 ───────────────────────────────────────────────────────────────
pill.background-color-hover = "var(--tabs-pill-background-hover, $ref(color.background.hover-subtle))"
pill.background-color-active = "var(--tabs-pill-background-active, $ref(color.brand.primary))"
pill.color-active = "$ref(color.text.on-brand)"
pill.border-radius = "$ref(radius.pill)"

# ─── 关闭按钮 ────────────────────────────────────────────────────────────────
close.color = "$ref(color.text.tertiary)"
close.color-hover = "$ref(color.text.primary)"
close.width = "var(--tabs-close-size, 16px)"
close.gap = "$ref(space.inline-gap)"
close.border-radius = "$ref(radius.sm)"
close.background-color-hover = "var(--tabs-close-background-hover, $ref(color.background.active-subtle))"

# ─── 焦点环 ──────────────────────────────────────────────────────────────────
tab.outline-color-focus = "var(--tabs-focus-ring-color, $ref(color.focus.ring))"
tab.outline-width-focus = "var(--tabs-focus-ring-width, 2px)"
tab.outline-offset-focus = "var(--tabs-focus-ring-offset, 2px)"
close.outline-color-focus = "var(--tabs-focus-ring-color, $ref(color.focus.ring))"
close.outline-width-focus = "var(--tabs-focus-ring-width, 2px)"
close.outline-offset-focus = "1px"

# ─── 动效 ────────────────────────────────────────────────────────────────────
motion.color = "color $ref(motion.interaction), background-color $ref(motion.interaction)"
