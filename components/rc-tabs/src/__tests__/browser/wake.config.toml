# Published ESM and compiled CSS are prerequisites of the layout-only regression.
# Run from rc-tabs through yarn test:browser, which builds and prepares the fixture.
[test]
environment = "browser"
include = ["button-feedback.test.tsx", "keyboard-close.test.tsx", "card-scroll-layout.test.tsx"]
timeout_ms = 15000
leaks = "error"

[test.react]
strict_mode = false
cleanup = true
act_warnings = "error"

[test.network]
mode = "deny"
allow_hosts = []

[test.coverage]
enabled = true
reporters = ["text", "lcov"]
